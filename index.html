<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>빠른길</title>

  <!--
    여기에 네 Kakao JavaScript 키만 넣기.
    REST API 키가 아니라 JavaScript 키.
  -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_JAVASCRIPT_KEY&libraries=services"></script>

  <style>
    :root {
      --mint1: #98C0AB;
      --mint2: #7FA18E;
      --teal: #4B8281;

      --cream1: #E0E1D2;
      --cream2: #D0D4BC;

      --green1: #A4BCA5;
      --green2: #8BA58A;
      --green3: #778D78;
      --green4: #4F6962;

      --deep: #263D38;
      --white: #FFFFFF;
      --black: #141817;

      --bg: #F4F6F2;
      --border: #E2E7E1;
      --gray: #6D7873;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--deep);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    .app {
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    header {
      padding: 28px 20px 24px;
      background: var(--deep);
      color: white;
    }

    .smallTitle {
      color: var(--mint1);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 5px 0 0;
      font-size: 30px;
    }

    .headerText {
      margin-top: 8px;
      color: var(--cream1);
      font-size: 13px;
      line-height: 1.5;
    }

    .panel {
      margin: 15px;
      padding: 17px;

      background: white;
      border-radius: 19px;

      box-shadow:
        0 5px 20px
        rgba(38, 61, 56, 0.08);
    }

    .inputRow {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 10px;
    }

    .letter {
      width: 31px;
      height: 31px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--cream1);

      font-size: 12px;
      font-weight: 900;
    }

    input {
      width: 100%;
      min-width: 0;

      padding: 13px;

      border:
        1px solid var(--border);

      border-radius: 11px;

      outline: none;

      font-size: 15px;
    }

    input:focus {
      border-color: var(--teal);
    }

    .buttons {
      display: grid;
      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 12px;
    }

    button {
      padding: 13px 8px;

      border: 0;
      border-radius: 11px;

      cursor: pointer;

      font-weight: 750;
      font-size: 14px;
    }

    #locationButton {
      background: var(--cream1);
      color: var(--deep);
    }

    #destinationButton {
      background: var(--mint1);
      color: var(--deep);
    }

    #routeButton {
      width: 100%;

      margin-top: 9px;

      background: var(--deep);
      color: white;
    }

    #message {
      margin: 0 15px 15px;
      padding: 12px;

      background: var(--cream1);

      border-radius: 11px;

      color: var(--green4);

      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .mapSection {
      margin: 0 15px 20px;
    }

    .sectionTop {
      display: flex;
      justify-content:
        space-between;
      align-items: center;

      margin-bottom: 9px;
    }

    .sectionTitle {
      font-size: 18px;
      font-weight: 850;
    }

    .sectionSub {
      color: var(--gray);
      font-size: 11px;
    }

    .mapCard {
      padding: 5px;

      background: white;
      border-radius: 17px;

      overflow: hidden;

      box-shadow:
        0 5px 20px
        rgba(38, 61, 56, 0.08);
    }

    #map {
      width: 100%;
      height: 330px;

      border-radius: 13px;
    }

    #routeResults {
      padding: 0 15px;
    }

    .resultsTitle {
      margin: 0 0 5px;

      font-size: 20px;
      font-weight: 850;
    }

    .resultsSub {
      margin-bottom: 12px;

      color: var(--gray);

      font-size: 12px;
      line-height: 1.5;
    }

    .routeCard {
      margin-bottom: 13px;
      padding: 17px;

      background: white;

      border:
        2px solid transparent;

      border-radius: 18px;

      cursor: pointer;

      box-shadow:
        0 5px 18px
        rgba(38, 61, 56, 0.07);
    }

    .routeCard.selected {
      border-color: var(--teal);
    }

    .routeTop {
      display: flex;
      justify-content:
        space-between;
      align-items: flex-start;

      gap: 10px;
    }

    .rank {
      color: var(--teal);

      font-size: 11px;
      font-weight: 850;
    }

    .time {
      margin-top: 3px;

      font-size: 29px;
      font-weight: 850;
    }

    .badge {
      padding: 7px 9px;

      background: var(--cream1);

      border-radius: 20px;

      font-size: 11px;
      font-weight: 850;

      text-align: center;
    }

    .passed {
      background: var(--mint1);
    }

    .failed {
      background: #EEEDE8;
      color: #6D716E;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .chip {
      padding: 7px 8px;

      background: #F4F6F3;

      border-radius: 8px;

      color: var(--green4);

      font-size: 12px;
    }

    .transport {
      margin-top: 12px;

      color: var(--deep);

      font-size: 13px;
      font-weight: 750;

      line-height: 1.7;
    }

    .realtime {
      margin-top: 12px;
      padding: 12px;

      background: var(--cream1);

      border-radius: 11px;

      font-size: 12px;
      line-height: 1.6;
    }

    .detailButton {
      margin-top: 13px;
      padding-top: 12px;

      border-top:
        1px solid var(--border);

      color: var(--green4);

      font-size: 12px;
      font-weight: 800;
    }

    .details {
      display: none;

      margin-top: 14px;
    }

    .routeCard.open
    .details {
      display: block;
    }

    .step {
      margin-bottom: 10px;
      padding: 11px;

      background: #F7F8F5;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.6;
    }

    .stepTitle {
      font-weight: 800;
    }

    .stepMeta {
      color: var(--gray);
      font-size: 12px;
    }

    @media (
      max-width: 480px
    ) {
      #map {
        height: 300px;
      }

      .panel,
      .mapSection {
        margin-left: 12px;
        margin-right: 12px;
      }

      #routeResults {
        padding:
          0 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="smallTitle">
      FAST ROUTE
    </div>

    <h1>
      빠른길
    </h1>

    <div class="headerText">
      실제 도착시간과 탑승지까지 이동시간을 비교해
      3분 초과 여유가 있는 경로를 확인합니다.
    </div>
  </header>


  <section class="panel">

    <div class="inputRow">
      <div class="letter">
        A
      </div>

      <input
        id="start"
        placeholder="출발지"
        readonly
      >
    </div>


    <div class="inputRow">
      <div class="letter">
        B
      </div>

      <input
        id="end"
        placeholder="도착지를 입력하세요"
      >
    </div>


    <div class="buttons">

      <button
        id="locationButton"
        onclick="findMyLocation()"
      >
        현재 위치
      </button>

      <button
        id="destinationButton"
        onclick="searchDestination()"
      >
        도착지 찾기
      </button>

    </div>


    <button
      id="routeButton"
      onclick="findRoute()"
    >
      빠른 대중교통 찾기
    </button>

  </section>


  <div id="message">
    현재 위치를 먼저 확인해주세요.
  </div>


  <section class="mapSection">

    <div class="sectionTop">

      <div class="sectionTitle">
        지도
      </div>

      <div class="sectionSub">
        경로 카드를 누르면 지도에 표시됩니다
      </div>

    </div>

    <div class="mapCard">
      <div id="map"></div>
    </div>

  </section>


  <section id="routeResults">
  </section>

</div>


<script>

var map = null;
var places = null;

var startLat = null;
var startLng = null;

var endLat = null;
var endLng = null;

var myMarker = null;
var destinationMarker = null;

var polylines = [];

var allRoutes = [];
var displayedRoutes = [];

var selectedIndex = 0;

var searchVersion = 0;


// 정확히 180초는 실패.
// 반드시 180초 초과.
var MIN_SPARE_SECONDS = 180;


// ==========================================
// 지도
// ==========================================

function initializeMap() {

  if (
    typeof kakao === "undefined" ||
    !kakao.maps
  ) {
    setMessage(
      "카카오 지도를 불러오지 못했습니다."
    );

    return;
  }

  map =
    new kakao.maps.Map(
      document.getElementById(
        "map"
      ),
      {
        center:
          new kakao.maps.LatLng(
            37.5665,
            126.9780
          ),

        level: 4
      }
    );

  places =
    new kakao.maps.services.Places();

  console.log(
    "지도 초기화 완료"
  );
}


window.addEventListener(
  "load",
  initializeMap
);


function setMessage(
  text
) {
  document.getElementById(
    "message"
  ).innerText = text;
}


// ==========================================
// 현재 위치
// ==========================================

function findMyLocation() {

  setMessage(
    "현재 위치를 확인하고 있습니다..."
  );

  if (!navigator.geolocation) {
    setMessage(
      "현재 위치 기능을 사용할 수 없습니다."
    );

    return;
  }

  navigator.geolocation
    .getCurrentPosition(

      function(position) {

        startLat =
          position.coords.latitude;

        startLng =
          position.coords.longitude;

        document.getElementById(
          "start"
        ).value =
          "내 현재 위치";

        var point =
          new kakao.maps.LatLng(
            startLat,
            startLng
          );

        map.setCenter(point);
        map.setLevel(3);

        if (myMarker) {
          myMarker.setMap(null);
        }

        myMarker =
          new kakao.maps.Marker({
            position: point
          });

        myMarker.setMap(map);

        setMessage(
          "현재 위치를 확인했습니다."
        );
      },

      function(error) {

        console.error(
          "위치 오류:",
          error
        );

        if (error.code === 1) {
          setMessage(
            "위치 권한을 허용해주세요."
          );
        } else {
          setMessage(
            "현재 위치를 확인하지 못했습니다."
          );
        }
      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
}


// ==========================================
// 목적지
// ==========================================

function searchDestination() {

  var keyword =
    document
      .getElementById("end")
      .value
      .trim();

  if (!keyword) {
    alert(
      "도착지를 입력해주세요."
    );

    return;
  }

  if (!places) {
    setMessage(
      "지도가 아직 준비되지 않았습니다."
    );

    return;
  }

  setMessage(
    "도착지를 찾고 있습니다..."
  );

  places.keywordSearch(
    keyword,

    function(data, status) {

      if (
        status ===
          kakao.maps.services.Status.OK &&
        data.length > 0
      ) {

        var place =
          data[0];

        endLat =
          Number(place.y);

        endLng =
          Number(place.x);

        document.getElementById(
          "end"
        ).value =
          place.place_name;

        var point =
          new kakao.maps.LatLng(
            endLat,
            endLng
          );

        if (destinationMarker) {
          destinationMarker
            .setMap(null);
        }

        destinationMarker =
          new kakao.maps.Marker({
            position: point
          });

        destinationMarker
          .setMap(map);

        map.setCenter(point);

        setMessage(
          "도착지를 설정했습니다 · " +
          place.place_name
        );

      } else {
        setMessage(
          "도착지를 찾지 못했습니다."
        );
      }
    }
  );
}


document
  .getElementById("end")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {
        searchDestination();
      }
    }
  );


// ==========================================
// 경로
// ==========================================

async function findRoute() {

  if (
    startLat === null ||
    startLng === null
  ) {
    setMessage(
      "현재 위치를 먼저 확인해주세요."
    );

    return;
  }

  if (
    endLat === null ||
    endLng === null
  ) {
    setMessage(
      "도착지를 먼저 설정해주세요."
    );

    return;
  }

  searchVersion++;

  var version =
    searchVersion;

  setMessage(
    "대중교통 경로를 찾고 있습니다..."
  );

  document.getElementById(
    "routeResults"
  ).innerHTML = "";

  var url =
    "/api/kakao" +

    "?startX=" +
    encodeURIComponent(
      startLng
    ) +

    "&startY=" +
    encodeURIComponent(
      startLat
    ) +

    "&endX=" +
    encodeURIComponent(
      endLng
    ) +

    "&endY=" +
    encodeURIComponent(
      endLat
    );

  try {

    var response =
      await fetch(url);

    var data =
      await response.json();

    console.log(
      "경로 결과:",
      data
    );

    if (
      version !==
      searchVersion
    ) {
      return;
    }

    if (
      !response.ok ||
      !Array.isArray(
        data.routes
      ) ||
      data.routes.length === 0
    ) {
      setMessage(
        "이용 가능한 대중교통 경로가 없습니다."
      );

      return;
    }

    allRoutes =
      data.routes.slice();

    allRoutes.sort(
      function(a, b) {
        return (
          getTotalTime(a) -
          getTotalTime(b)
        );
      }
    );

    // 먼저 일반 빠른 경로 3개 표시
    displayedRoutes =
      allRoutes
        .slice(0, 3)
        .map(
          createInitialState
        );

    selectedIndex = 0;

    renderRoutes();

    if (
      displayedRoutes.length
    ) {
      drawRoute(
        displayedRoutes[0].route
      );
    }

    setMessage(
      "경로 " +
      allRoutes.length +
      "개를 찾았습니다. 실시간 탑승 가능 여부를 확인합니다."
    );

    // 화면을 막지 않고 별도로 검증
    verifyRealtime(
      allRoutes,
      version
    );

  } catch (error) {

    console.error(
      "경로 오류:",
      error
    );

    setMessage(
      "경로를 불러오지 못했습니다."
    );
  }
}


// ==========================================
// 실시간 검증
// ==========================================

async function verifyRealtime(
  routes,
  version
) {

  var analyzed =
    await Promise.all(
      routes.map(
        analyzeRoute
      )
    );

  if (
    version !==
    searchVersion
  ) {
    return;
  }

  var passed =
    analyzed
      .filter(function(item) {
        return (
          item.realtimeChecked &&
          item.catchable
        );
      })
      .sort(compareRouteTime);

  var unknown =
    analyzed
      .filter(function(item) {
        return (
          !item.realtimeChecked
        );
      })
      .sort(compareRouteTime);

  var failed =
    analyzed
      .filter(function(item) {
        return (
          item.realtimeChecked &&
          !item.catchable
        );
      })
      .sort(compareRouteTime);

  displayedRoutes =
    passed
      .concat(unknown)
      .concat(failed)
      .slice(0, 3);

  selectedIndex = 0;

  renderRoutes();

  if (
    displayedRoutes.length
  ) {
    drawRoute(
      displayedRoutes[0].route
    );
  }

  if (passed.length) {
    setMessage(
      "실시간 확인 완료 · 3분 초과 여유가 확인된 경로 " +
      passed.length +
      "개를 우선 표시합니다."
    );
  } else {
    setMessage(
      "경로는 정상입니다. 현재 3분 초과 탑승 여유가 확인된 경로는 없습니다."
    );
  }
}


function compareRouteTime(
  a,
  b
) {
  return (
    getTotalTime(a.route) -
    getTotalTime(b.route)
  );
}


function createInitialState(
  route
) {

  var transit =
    findFirstTransit(route);

  var info =
    getTransitInfo(
      transit
        ? transit.step
        : null
    );

  return {
    route,

    realtimeChecked: false,
    catchable: false,

    state: "checking",

    firstTransitType:
      info.type,

    transitName:
      info.name,

    busNumbers:
      info.busNumbers,

    boardingName:
      info.boarding,

    alightingName:
      info.alighting,

    nextStopName:
      info.nextStop,

    walkingSeconds: null,
    walkingDistance: null,
    walkingEstimated: false,

    arrivalSeconds: null,
    spareSeconds: null,

    reason:
      "실시간 확인 중"
  };
}


async function analyzeRoute(
  route
) {

  var result =
    createInitialState(
      route
    );

  var firstTransit =
    findFirstTransit(
      route
    );

  if (!firstTransit) {
    result.state =
      "unknown";

    result.reason =
      "첫 탑승 정보를 확인할 수 없습니다.";

    return result;
  }

  var walking =
    calculateWalking(
      route,
      firstTransit
    );

  result.walkingSeconds =
    walking.seconds;

  result.walkingDistance =
    walking.distance;

  result.walkingEstimated =
    walking.estimated;

  if (
    result.walkingSeconds === null
  ) {
    result.state =
      "unknown";

    result.reason =
      "탑승지까지 이동시간을 계산하지 못했습니다.";

    return result;
  }

  if (
    result.firstTransitType ===
    "SUBWAY"
  ) {
    await checkSubway(
      result
    );

    return result;
  }

  if (
    result.firstTransitType ===
    "BUS"
  ) {
    await checkBus(
      result
    );

    return result;
  }

  result.state =
    "unknown";

  result.reason =
    "실시간 확인 대상이 아닙니다.";

  return result;
}


// ==========================================
// 지하철 실시간
// ==========================================

async function checkSubway(
  result
) {

  var station =
    cleanStation(
      result.boardingName
    );

  if (!station) {
    result.state =
      "unknown";

    result.reason =
      "승차역을 확인할 수 없습니다.";

    return;
  }

  try {

    var response =
      await fetchWithTimeout(

        "/api/seoul-subway?station=" +
        encodeURIComponent(
          station
        ),

        4000
      );

    var data =
      await response.json();

    if (
      !response.ok ||
      data.success === false ||
      !Array.isArray(
        data.arrivals
      )
    ) {
      result.state =
        "unknown";

      result.reason =
        data.error ||
        "지하철 실시간 정보를 확인하지 못했습니다.";

      return;
    }

    var arrivals =
      data.arrivals
        .filter(function(item) {
          return (
            Number(
              item.arrivalSeconds
            ) > 0
          );
        });

    var subwayId =
      getSubwayId(
        result.transitName
      );

    if (subwayId) {
      arrivals =
        arrivals.filter(
          function(item) {
            return (
              String(
                item.subwayId
              ) ===
              String(
                subwayId
              )
            );
          }
        );
    }

    // 진행방향 확인
    var next =
      normalizeText(
        result.nextStopName
      );

    if (next) {
      var directionMatches =
        arrivals.filter(
          function(item) {

            var line =
              normalizeText(
                item.trainLine
              );

            return (
              line.indexOf(
                next
              ) !== -1
            );
          }
        );

      // 반대 방향 열차를
      // 대신 사용하지 않는다.
      if (
        directionMatches.length === 0
      ) {
        result.state =
          "unknown";

        result.reason =
          "진행 방향 실시간 정보를 확인하지 못했습니다.";

        return;
      }

      arrivals =
        directionMatches;
    }

    arrivals.sort(
      function(a, b) {
        return (
          Number(
            a.arrivalSeconds
          ) -
          Number(
            b.arrivalSeconds
          )
        );
      }
    );

    applyArrivalRule(
      result,
      arrivals
    );

  } catch (error) {

    console.error(
      "지하철 실시간 오류:",
      error
    );

    result.state =
      "unknown";

    result.reason =
      "지하철 실시간 응답을 받지 못했습니다.";
  }
}


// ==========================================
// 버스 실시간
// ==========================================

async function checkBus(
  result
) {

  if (
    !result.boardingName ||
    !result.busNumbers.length
  ) {
    result.state =
      "unknown";

    result.reason =
      "버스 정류장 또는 버스 번호를 확인할 수 없습니다.";

    return;
  }

  try {

    var url =
      "/api/seoul-bus" +

      "?station=" +
      encodeURIComponent(
        result.boardingName
      ) +

      "&buses=" +
      encodeURIComponent(
        result.busNumbers.join(",")
      );

    var response =
      await fetchWithTimeout(
        url,
        5000
      );

    var data =
      await response.json();

    console.log(
      "버스 실시간:",
      data
    );

    if (
      !response.ok ||
      data.success === false
    ) {
      result.state =
        "unknown";

      result.reason =
        data.error ||
        "버스 실시간 정보를 확인하지 못했습니다.";

      return;
    }

    if (
      !Array.isArray(
        data.arrivals
      ) ||
      data.arrivals.length === 0
    ) {
      result.state =
        "unknown";

      result.reason =
        data.message ||
        "현재 버스 도착정보가 없습니다.";

      return;
    }

    var arrivals =
      data.arrivals
        .filter(function(item) {
          return (
            Number(
              item.arrivalSeconds
            ) > 0
          );
        })
        .sort(
          function(a, b) {
            return (
              Number(
                a.arrivalSeconds
              ) -
              Number(
                b.arrivalSeconds
              )
            );
          }
        );

    applyArrivalRule(
      result,
      arrivals
    );

  } catch (error) {

    console.error(
      "버스 실시간 오류:",
      error
    );

    result.state =
      "unknown";

    result.reason =
      "버스 실시간 응답을 받지 못했습니다.";
  }
}


// ==========================================
// 3분 규칙
// ==========================================

function applyArrivalRule(
  result,
  arrivals
) {

  if (
    !arrivals.length
  ) {
    result.state =
      "unknown";

    result.reason =
      "사용 가능한 도착시간이 없습니다.";

    return;
  }

  result.realtimeChecked =
    true;

  result.catchable =
    false;

  result.state =
    "failed";

  // 첫 차부터 순서대로 확인.
  // 못 타면 다음 차를 확인.
  for (
    var i = 0;
    i < arrivals.length;
    i++
  ) {

    var arrival =
      Number(
        arrivals[i]
          .arrivalSeconds
      );

    var spare =
      arrival -
      result.walkingSeconds;

    console.log(
      "3분 판정:",
      {
        type:
          result.firstTransitType,

        boarding:
          result.boardingName,

        arrivalSeconds:
          arrival,

        walkingSeconds:
          result.walkingSeconds,

        spareSeconds:
          spare,

        passed:
          spare >
          MIN_SPARE_SECONDS
      }
    );

    // 정확히 180은 실패.
    if (
      spare >
      MIN_SPARE_SECONDS
    ) {
      result.catchable =
        true;

      result.state =
        "passed";

      result.arrivalSeconds =
        arrival;

      result.spareSeconds =
        spare;

      result.reason =
        "3분 초과 탑승 여유 확인";

      if (
        arrivals[i]
          .busNumber
      ) {
        result.transitName =
          arrivals[i]
            .busNumber;
      }

      return;
    }
  }

  result.arrivalSeconds =
    Number(
      arrivals[0]
        .arrivalSeconds
    );

  result.spareSeconds =
    result.arrivalSeconds -
    result.walkingSeconds;

  result.reason =
    "3분 초과 여유가 있는 차량이 없습니다.";
}


// ==========================================
// 첫 탑승
// ==========================================

function findFirstTransit(
  route
) {

  if (
    !route ||
    !Array.isArray(
      route.steps
    )
  ) {
    return null;
  }

  for (
    var i = 0;
    i < route.steps.length;
    i++
  ) {
    var type =
      getStepType(
        route.steps[i]
      );

    if (
      type === "SUBWAY" ||
      type === "BUS"
    ) {
      return {
        step:
          route.steps[i],
        index: i
      };
    }
  }

  return null;
}


function getTransitInfo(
  step
) {

  var empty = {
    type: "",
    name: "",
    busNumbers: [],
    boarding: "",
    alighting: "",
    nextStop: ""
  };

  if (!step) {
    return empty;
  }

  var p =
    step.properties || {};

  var type =
    getStepType(step);

  var stops =
    Array.isArray(p.stops)
      ? p.stops
      : [];

  var boarding =
    stops.length
      ? getStopName(
          stops[0]
        )
      : "";

  var alighting =
    stops.length
      ? getStopName(
          stops[
            stops.length - 1
          ]
        )
      : "";

  var nextStop =
    stops.length > 1
      ? getStopName(
          stops[1]
        )
      : "";

  var name = "";

  var busNumbers = [];

  if (
    type === "SUBWAY"
  ) {
    name =
      getSubwayLine(
        p.guidance || ""
      );
  }

  if (
    type === "BUS"
  ) {
    busNumbers =
      getBusNumbers(p);

    name =
      busNumbers.join(" · ");
  }

  return {
    type,
    name,
    busNumbers,
    boarding:
      cleanStation(boarding),
    alighting:
      cleanStation(alighting),
    nextStop:
      cleanStation(nextStop)
  };
}


function getBusNumbers(
  properties
) {

  var vehicles =
    Array.isArray(
      properties.vehicles
    )
      ? properties.vehicles
      : [];

  var numbers =
    vehicles
      .map(function(vehicle) {
        return String(
          vehicle.name || ""
        ).trim();
      })
      .filter(Boolean);

  if (
    numbers.length
  ) {
    return numbers;
  }

  var guidance =
    String(
      properties.guidance || ""
    );

  var beforeParen =
    guidance.split("(")[0];

  var matches =
    beforeParen.match(
      /\b\d+[A-Za-z가-힣-]*\b/g
    );

  return matches || [];
}


// ==========================================
// 도보 계산
// ==========================================

function calculateWalking(
  route,
  transit
) {

  var seconds = 0;
  var distance = 0;

  var found = false;

  for (
    var i = 0;
    i < transit.index;
    i++
  ) {
    var step =
      route.steps[i];

    var type =
      getStepType(step);

    if (
      type === "WALKING" ||
      type === "WALK"
    ) {
      var p =
        step.properties || {};

      var time =
        Number(
          p.time || 0
        );

      var dist =
        Number(
          p.distance || 0
        );

      if (time > 0) {
        seconds += time;
        found = true;
      }

      if (dist > 0) {
        distance += dist;
      }
    }
  }

  if (found) {
    return {
      seconds:
        Math.ceil(seconds),

      distance:
        Math.round(distance),

      estimated: false
    };
  }

  var point =
    getFirstPathPoint(
      transit.step
    );

  if (
    !point ||
    startLat === null ||
    startLng === null
  ) {
    return {
      seconds: null,
      distance: null,
      estimated: true
    };
  }

  var straight =
    haversine(
      startLat,
      startLng,
      point.lat,
      point.lng
    );

  // 실제 보행로가 직선보다 길기 때문에
  // 1.25배로 보수적으로 추정
  var walkingMeters =
    straight * 1.25;

  // 약 4km/h
  var metersPerSecond =
    4000 / 3600;

  return {
    seconds:
      Math.ceil(
        walkingMeters /
        metersPerSecond
      ),

    distance:
      Math.round(
        walkingMeters
      ),

    estimated: true
  };
}


function haversine(
  lat1,
  lng1,
  lat2,
  lng2
) {

  var R = 6371000;

  var dLat =
    toRad(
      lat2 - lat1
    );

  var dLng =
    toRad(
      lng2 - lng1
    );

  var a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(
      toRad(lat1)
    ) *

    Math.cos(
      toRad(lat2)
    ) *

    Math.sin(dLng / 2) *
    Math.sin(dLng / 2);

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );
}


function toRad(
  value
) {
  return (
    value *
    Math.PI /
    180
  );
}

function selectRoute(
  index
) {

  selectedIndex =
    index;

  var cards =
    document.querySelectorAll(
      ".routeCard"
    );

  cards.forEach(
    function(card, i) {

      if (i === index) {
        card.classList
          .add("selected");

        card.classList
          .toggle("open");
      } else {
        card.classList
          .remove("selected");

        card.classList
          .remove("open");
      }
    }
  );

  drawRoute(
    displayedRoutes[index]
      .route
  );
}


function getStatus(
  item
) {

  if (
    item.state ===
    "passed"
  ) {
    return {
      text:
        "3분 초과 확인",
      className:
        "passed"
    };
  }

  if (
    item.state ===
    "failed"
  ) {
    return {
      text:
        "3분 여유 부족",
      className:
        "failed"
    };
  }

  if (
    item.state ===
    "checking"
  ) {
    return {
      text:
        "실시간 확인 중",
      className: ""
    };
  }

  return {
    text:
      "실시간 확인 불가",
    className: ""
  };
}


function buildRealtimeText(
  item
) {

  var walkingText =
    item.walkingSeconds !== null

      ? Math.ceil(
          item.walkingSeconds /
          60
        ) + "분"

      : "확인 불가";

  var estimate =
    item.walkingEstimated
      ? " · 추정 도보"
      : "";

  if (
    item.state ===
    "passed"
  ) {
    return (
      "탑승지까지 " +
      walkingText +
      estimate +

      "<br>" +

      "선택된 차량 도착 약 " +
      Math.ceil(
        item.arrivalSeconds /
        60
      ) +
      "분 후" +

      "<br>" +

      "탑승 여유 약 " +
      Math.floor(
        item.spareSeconds /
        60
      ) +
      "분 " +
      (
        item.spareSeconds %
        60
      ) +
      "초"
    );
  }

  return (
    "탑승지까지 " +
    walkingText +
    estimate +
    "<br>" +
    escapeHTML(
      item.reason || ""
    )
  );
}


function buildTransportSummary(
  route
) {

  if (
    !Array.isArray(
      route.steps
    )
  ) {
    return "";
  }

  var parts = [];

  route.steps.forEach(
    function(step) {

      var type =
        getStepType(step);

      var p =
        step.properties || {};

      if (
        type === "SUBWAY"
      ) {
        parts.push(
          "🚇 " +
          getSubwayLine(
            p.guidance || ""
          )
        );
      }

      if (
        type === "BUS"
      ) {
        var buses =
          getBusNumbers(p);

        parts.push(
          "🚌 " +
          (
            buses.length
              ? buses.join(" · ")
              : "버스"
          )
        );
      }
    }
  );

  return parts
    .map(escapeHTML)
    .join(" → ");
}


function buildSteps(
  route
) {

  if (
    !Array.isArray(
      route.steps
    )
  ) {
    return "";
  }

  var html = "";

  route.steps.forEach(
    function(step) {

      var type =
        getStepType(step);

      var p =
        step.properties || {};

      var minutes =
        p.time
          ? Math.max(
              1,
              Math.ceil(
                Number(p.time) /
                60
              )
            )
          : null;

      if (
        type === "WALKING" ||
        type === "WALK"
      ) {
        html += `
          <div class="step">
            <div class="stepTitle">
              🚶 도보
            </div>

            <div class="stepMeta">
              ${
                minutes
                  ? minutes + "분"
                  : ""
              }

              ${
                p.distance
                  ? " · " +
                    Math.round(
                      p.distance
                    ) +
                    "m"
                  : ""
              }
            </div>
          </div>
        `;

        return;
      }

      var info =
        getTransitInfo(step);

      if (
        type === "SUBWAY"
      ) {
        html += `
          <div class="step">

            <div class="stepTitle">
              🚇
              ${escapeHTML(
                info.name ||
                "지하철"
              )}
            </div>

            <div class="stepMeta">
              ${escapeHTML(
                info.boarding
              )}
              →
              ${escapeHTML(
                info.alighting
              )}

              ${
                minutes
                  ? " · " +
                    minutes +
                    "분"
                  : ""
              }
            </div>

          </div>
        `;
      }

      if (
        type === "BUS"
      ) {
        html += `
          <div class="step">

            <div class="stepTitle">
              🚌
              ${escapeHTML(
                info.name ||
                "버스"
              )}
            </div>

            <div class="stepMeta">
              ${escapeHTML(
                info.boarding
              )}
              →
              ${escapeHTML(
                info.alighting
              )}

              ${
                minutes
                  ? " · " +
                    minutes +
                    "분"
                  : ""
              }
            </div>

          </div>
        `;
      }
    }
  );

  return html;
}


// ==========================================
// 지도 경로
// ==========================================

function drawRoute(
  route
) {

  clearPolylines();

  if (
    !route ||
    !Array.isArray(
      route.steps
    )
  ) {
    return;
  }

  var bounds =
    new kakao.maps.LatLngBounds();

  var hasPoint =
    false;

  route.steps.forEach(
    function(step) {

      if (
        !step.path ||
        !Array.isArray(
          step.path.points
        ) ||
        step.path.points.length <
        2
      ) {
        return;
      }

      var path =
        step.path.points
          .map(function(point) {

            var latLng =
              new kakao.maps.LatLng(
                Number(point[1]),
                Number(point[0])
              );

            bounds.extend(
              latLng
            );

            hasPoint = true;

            return latLng;
          });

      var type =
        getStepType(step);

      var color =
        "#778D78";

      if (
        type === "SUBWAY"
      ) {
        color =
          "#263D38";
      }

      if (
        type === "BUS"
      ) {
        color =
          "#4B8281";
      }

      var polyline =
        new kakao.maps.Polyline({
          path,
          strokeWeight: 5,
          strokeColor: color,
          strokeOpacity: 0.85,
          strokeStyle: "solid"
        });

      polyline.setMap(map);

      polylines.push(
        polyline
      );
    }
  );

  if (hasPoint) {
    map.setBounds(
      bounds,
      40,
      40,
      40,
      40
    );
  }
}


function clearPolylines() {

  polylines.forEach(
    function(line) {
      line.setMap(null);
    }
  );

  polylines = [];
}


// ==========================================
// 공통 도우미
// ==========================================

function getStepType(
  step
) {
  return String(
    step?.properties?.type ||
    step?.type ||
    ""
  ).toUpperCase();
}


function getTotalTime(
  route
) {
  return Number(
    route?.properties
      ?.totalTime ||
    999999999
  );
}


function getStopName(
  stop
) {
  return String(
    stop?.name ||
    stop?.stationName ||
    stop?.stopName ||
    ""
  );
}


function cleanStation(
  value
) {
  return String(
    value || ""
  )
    .trim()
    .replace(/역$/, "");
}


function normalizeText(
  value
) {
  return cleanStation(
    value
  )
    .replace(/\s+/g, "")
    .replace(/[()]/g, "")
    .toLowerCase();
}


function getSubwayLine(
  guidance
) {

  var text =
    String(
      guidance || ""
    );

  var index =
    text.indexOf("(");

  if (index !== -1) {
    text =
      text.slice(
        0,
        index
      );
  }

  return (
    text.trim() ||
    "지하철"
  );
}


function getSubwayId(
  line
) {

  var text =
    String(line || "");

  var match =
    text.match(
      /([1-9])호선/
    );

  if (match) {
    return (
      "100" +
      match[1]
    );
  }

  if (
    text.includes(
      "공항"
    )
  ) {
    return "1065";
  }

  if (
    text.includes(
      "경의중앙"
    ) ||
    text.includes(
      "경의·중앙"
    )
  ) {
    return "1063";
  }

  return "";
}


function getFirstPathPoint(
  step
) {

  var points =
    step?.path?.points;

  if (
    !Array.isArray(points) ||
    !points.length ||
    !Array.isArray(
      points[0]
    )
  ) {
    return null;
  }

  var lng =
    Number(
      points[0][0]
    );

  var lat =
    Number(
      points[0][1]
    );

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ) {
    return null;
  }

  return {
    lat,
    lng
  };
}


function formatDistance(
  meters
) {

  var number =
    Number(meters || 0);

  if (number < 1000) {
    return (
      Math.round(number) +
      "m"
    );
  }

  return (
    (
      Math.round(
        number / 100
      ) / 10
    ) +
    "km"
  );
}


async function fetchWithTimeout(
  url,
  timeout
) {

  var controller =
    new AbortController();

  var timer =
    setTimeout(
      function() {
        controller.abort();
      },
      timeout
    );

  try {
    return await fetch(
      url,
      {
        signal:
          controller.signal
      }
    );
  } finally {
    clearTimeout(timer);
  }
}


function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

</script>
