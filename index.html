<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>빠른길</title>

  <!--
    Kakao JavaScript 키
    REST API 키가 아님
  -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=16010f0659e99afc9e0d760620666d16&libraries=services"></script>

  <style>
    :root {
      --mint: #98C0AB;
      --mint-dark: #7FA18E;
      --teal: #4B8281;

      --cream: #E0E1D2;
      --cream-dark: #D0D4BC;

      --green-light: #A4BCA5;
      --green: #8BA58A;
      --green-mid: #778D78;
      --green-dark: #4F6962;

      --deep-green: #263D38;

      --black: #151918;
      --white: #FFFFFF;

      --background: #F4F6F2;
      --border: #E2E7E1;
      --gray: #6D7873;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--deep-green);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ================================
       HEADER
       ================================ */

    .header {
      padding: 29px 20px 25px;
      background: var(--deep-green);
      color: var(--white);
    }

    .headerSmall {
      margin-bottom: 5px;
      color: var(--mint);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.2px;
    }

    .headerTitle {
      margin: 0;
      font-size: 30px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .headerDescription {
      margin-top: 8px;
      color: var(--cream);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ================================
       검색
       ================================ */

    .searchPanel {
      margin: 15px;
      padding: 17px;
      background: var(--white);
      border-radius: 20px;
      box-shadow:
        0 5px 20px rgba(38, 61, 56, 0.08);
    }

    .inputRow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .inputIcon {
      width: 31px;
      height: 31px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: var(--cream);

      color: var(--deep-green);
      font-size: 13px;
      font-weight: 850;
    }

    input {
      width: 100%;
      min-width: 0;

      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: #FAFBF9;
      color: var(--black);

      outline: none;

      font-size: 15px;
    }

    input:focus {
      border-color: var(--teal);
      background: var(--white);
    }

    input::placeholder {
      color: #9AA39F;
    }

    .buttonRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 12px;

      padding: 13px 10px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 750;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    #locationButton {
      background: var(--cream);
      color: var(--deep-green);
    }

    #routeButton {
      background: var(--mint);
      color: var(--deep-green);
    }

    #trafficButton {
      width: 100%;
      margin-top: 9px;
      padding: 15px;

      background: var(--deep-green);
      color: var(--white);

      font-size: 15px;
    }

    /* ================================
       메시지
       ================================ */

    #message {
      margin: 0 15px 15px;
      padding: 12px 14px;

      background: var(--cream);
      border-radius: 12px;

      color: var(--green-dark);

      font-size: 13px;
      font-weight: 650;
      text-align: center;
      line-height: 1.5;
    }

    /* ================================
       지도
       ================================ */

    .mapSection {
      margin: 0 15px 20px;
    }

    .sectionHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 10px;
    }

    .sectionTitle {
      margin: 0;
      color: var(--deep-green);
      font-size: 18px;
      font-weight: 850;
    }

    .sectionDescription {
      color: var(--gray);
      font-size: 11px;
      text-align: right;
    }

    .mapCard {
      padding: 5px;

      background: var(--white);
      border-radius: 18px;

      box-shadow:
        0 5px 20px rgba(38, 61, 56, 0.08);

      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 330px;
      border-radius: 14px;
    }

    /* ================================
       결과
       ================================ */

    #routeResults {
      padding: 0 15px;
    }

    .resultsHeader {
      margin-bottom: 11px;
    }

    .resultsTitle {
      margin: 0;
      color: var(--deep-green);
      font-size: 20px;
      font-weight: 850;
    }

    .resultsSub {
      margin-top: 5px;
      color: var(--gray);
      font-size: 12px;
      line-height: 1.5;
    }

    /* ================================
       경로 카드
       ================================ */

    .routeCard {
      margin-bottom: 13px;
      padding: 18px;

      background: var(--white);

      border: 2px solid transparent;
      border-radius: 19px;

      box-shadow:
        0 5px 18px rgba(38, 61, 56, 0.07);

      cursor: pointer;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .routeCard:hover {
      border-color: var(--green-light);
    }

    .routeCard.selected {
      border-color: var(--teal);

      box-shadow:
        0 7px 22px rgba(75, 130, 129, 0.14);
    }

    .routeTop {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .routeRank {
      margin-bottom: 4px;

      color: var(--teal);

      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.4px;
    }

    .routeTime {
      color: var(--deep-green);
      font-size: 30px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .routeBadge {
      max-width: 150px;

      padding: 7px 10px;

      border-radius: 20px;

      font-size: 11px;
      font-weight: 850;
      text-align: center;
      line-height: 1.3;
    }

    .badgePassed {
      background: var(--mint);
      color: var(--deep-green);
    }

    .badgeUnknown {
      background: var(--cream);
      color: var(--green-dark);
    }

    .badgeFailed {
      background: #ECEDE8;
      color: #707872;
    }

    .routeSummary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;

      margin-top: 13px;
    }

    .summaryChip {
      padding: 7px 9px;

      background: #F4F6F3;
      border-radius: 8px;

      color: var(--green-dark);

      font-size: 12px;
      font-weight: 650;
    }

    .firstTransit {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-top: 15px;
    }

    .transportIcon {
      width: 30px;
      height: 30px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--mint);
      border-radius: 9px;

      color: var(--deep-green);

      font-size: 12px;
      font-weight: 900;
    }

    .firstTransitText {
      min-width: 0;
    }

    .firstTransitTitle {
      color: var(--deep-green);
      font-size: 14px;
      font-weight: 800;
    }

    .firstTransitSub {
      margin-top: 2px;
      color: var(--gray);
      font-size: 11px;
    }

    /* ================================
       실시간 박스
       ================================ */

    .realtimeBox {
      margin-top: 14px;
      padding: 13px;

      background: var(--cream);
      border-radius: 12px;
    }

    .realtimeTitle {
      margin-bottom: 9px;

      color: var(--deep-green);

      font-size: 12px;
      font-weight: 850;
    }

    .realtimeGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .realtimeItem {
      padding: 8px 4px;

      background:
        rgba(255,255,255,0.58);

      border-radius: 9px;

      text-align: center;
    }

    .realtimeValue {
      color: var(--deep-green);
      font-size: 15px;
      font-weight: 850;
    }

    .realtimeLabel {
      margin-top: 3px;

      color: var(--green-dark);

      font-size: 10px;
    }

    .realtimeMessage {
      color: var(--green-dark);
      font-size: 12px;
      line-height: 1.6;
    }

    /* ================================
       상세보기
       ================================ */

    .detailHint {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 15px;
      padding-top: 13px;

      border-top: 1px solid var(--border);

      color: var(--green-dark);

      font-size: 12px;
      font-weight: 800;
    }

    .detailArrow {
      transition: transform 0.2s ease;
    }

    .routeCard.open .detailArrow {
      transform: rotate(180deg);
    }

    .routeDetails {
      display: none;

      margin-top: 16px;
    }

    .routeCard.open .routeDetails {
      display: block;
    }

    .detailTitle {
      margin-bottom: 14px;

      color: var(--deep-green);

      font-size: 14px;
      font-weight: 850;
    }

    /* ================================
       상세 단계
       ================================ */

    .step {
      display: flex;
      position: relative;
      gap: 11px;
    }

    .step:not(:last-child) {
      padding-bottom: 18px;
    }

    .stepMarkerColumn {
      position: relative;

      width: 27px;
      flex-shrink: 0;

      display: flex;
      justify-content: center;
    }

    .stepDot {
      position: relative;
      z-index: 2;

      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--mint);
      border-radius: 50%;

      color: var(--deep-green);

      font-size: 10px;
      font-weight: 900;
    }

    .stepLine {
      position: absolute;

      top: 24px;
      bottom: -18px;
      left: 50%;

      width: 2px;

      transform: translateX(-50%);

      background: var(--cream-dark);
    }

    .step:last-child .stepLine {
      display: none;
    }

    .stepContent {
      flex: 1;
      min-width: 0;

      padding-top: 2px;
    }

    .stepMain {
      color: var(--deep-green);

      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;
    }

    .stepMeta {
      margin-top: 4px;

      color: var(--gray);

      font-size: 12px;
      line-height: 1.5;
    }

    .stepGuidance {
      margin-top: 5px;

      color: var(--green-dark);

      font-size: 12px;
      line-height: 1.5;
    }

    /* ================================
       결과 없음
       ================================ */

    .emptyCard {
      padding: 23px 18px;

      background: var(--white);
      border-radius: 18px;

      box-shadow:
        0 5px 18px rgba(38, 61, 56, 0.06);

      text-align: center;
    }

    .emptyTitle {
      margin-bottom: 7px;

      color: var(--deep-green);

      font-size: 17px;
      font-weight: 850;
    }

    .emptyText {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .header {
        padding: 25px 17px 21px;
      }

      .headerTitle {
        font-size: 27px;
      }

      .searchPanel {
        margin: 12px;
      }

      #message {
        margin: 0 12px 13px;
      }

      .mapSection {
        margin: 0 12px 18px;
      }

      #routeResults {
        padding: 0 12px;
      }

      #map {
        height: 300px;
      }

      .routeCard {
        padding: 16px;
      }

      .routeTime {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="headerSmall">
      FAST ROUTE
    </div>

    <h1 class="headerTitle">
      빠른길
    </h1>

    <div class="headerDescription">
      지금 이동 가능한 대중교통 경로를 찾아보세요.
    </div>

  </header>


  <section class="searchPanel">

    <div class="inputRow">

      <div class="inputIcon">
        A
      </div>

      <input
        id="start"
        type="text"
        placeholder="출발지"
        readonly
      >

    </div>


    <div class="inputRow">

      <div class="inputIcon">
        B
      </div>

      <input
        id="end"
        type="text"
        placeholder="도착지를 입력하세요"
      >

    </div>


    <div class="buttonRow">

      <button
        id="locationButton"
        onclick="findMyLocation()"
      >
        현재 위치
      </button>

      <button
        id="routeButton"
        onclick="searchDestination()"
      >
        도착지 찾기
      </button>

    </div>


    <button
      id="trafficButton"
      onclick="findRoute()"
    >
      빠른 대중교통 찾기
    </button>

  </section>


  <div id="message">
    현재 위치를 먼저 확인해주세요.
  </div>


  <section class="mapSection">

    <div class="sectionHeader">

      <h2 class="sectionTitle">
        지도
      </h2>

      <div class="sectionDescription">
        경로 카드를 누르면 해당 경로가 표시됩니다
      </div>

    </div>


    <div class="mapCard">
      <div id="map"></div>
    </div>

  </section>


  <section id="routeResults"></section>

</div>


<script>

  // =====================================================
  // 상태 변수
  // =====================================================

  var fastRouteMap = null;
  var kakaoPlaceService = null;

  var appStartLat = null;
  var appStartLng = null;

  var appEndLat = null;
  var appEndLng = null;

  var appMyMarker = null;
  var appDestinationMarker = null;

  var routePolylines = [];
  var routeMarkers = [];

  var displayedRoutes = [];

  var openedRouteIndex = null;

  // 도착시간 - 도보시간 > 3분
  var MINIMUM_SPARE_SECONDS = 180;


  // =====================================================
  // 지도 초기화
  // =====================================================

  function initializeMap() {

    var messageBox =
      document.getElementById("message");


    if (
      typeof kakao === "undefined" ||
      !kakao.maps
    ) {

      messageBox.innerText =
        "카카오 지도를 불러오지 못했습니다.";

      console.error(
        "Kakao Maps SDK load failed"
      );

      return;
    }


    var container =
      document.getElementById("map");


    var options = {

      center:
        new kakao.maps.LatLng(
          37.5665,
          126.9780
        ),

      level: 4

    };


    fastRouteMap =
      new kakao.maps.Map(
        container,
        options
      );


    kakaoPlaceService =
      new kakao.maps.services.Places();


    console.log(
      "카카오 지도 준비 완료"
    );

  }


  window.addEventListener(
    "load",
    initializeMap
  );


  // =====================================================
  // 현재 위치
  // =====================================================

  function findMyLocation() {

    var messageBox =
      document.getElementById("message");


    messageBox.innerText =
      "현재 위치를 확인하고 있습니다...";


    if (!navigator.geolocation) {

      messageBox.innerText =
        "현재 위치 기능을 사용할 수 없습니다.";

      return;
    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        appStartLat =
          position.coords.latitude;

        appStartLng =
          position.coords.longitude;


        document.getElementById(
          "start"
        ).value =
          "내 현재 위치";


        if (fastRouteMap) {

          var currentPosition =
            new kakao.maps.LatLng(
              appStartLat,
              appStartLng
            );


          fastRouteMap.setCenter(
            currentPosition
          );


          fastRouteMap.setLevel(3);


          if (appMyMarker) {

            appMyMarker.setMap(null);

          }


          appMyMarker =
            new kakao.maps.Marker({

              position:
                currentPosition

            });


          appMyMarker.setMap(
            fastRouteMap
          );

        }


        messageBox.innerText =
          "현재 위치를 확인했습니다.";

      },


      function(error) {

        console.error(
          "위치 오류:",
          error
        );


        if (error.code === 1) {

          messageBox.innerText =
            "위치 권한을 허용해주세요.";

        }

        else if (error.code === 3) {

          messageBox.innerText =
            "현재 위치 확인 시간이 초과되었습니다.";

        }

        else {

          messageBox.innerText =
            "현재 위치를 확인하지 못했습니다.";

        }

      },


      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );

  }


  // =====================================================
  // 도착지 검색
  // =====================================================

  function searchDestination() {

    var keyword =
      document.getElementById(
        "end"
      ).value.trim();


    if (!keyword) {

      alert(
        "도착지를 입력해주세요."
      );

      return;
    }


    if (!kakaoPlaceService) {

      document.getElementById(
        "message"
      ).innerText =
        "지도가 아직 준비되지 않았습니다.";

      return;
    }


    document.getElementById(
      "message"
    ).innerText =
      "도착지를 찾고 있습니다...";


    kakaoPlaceService.keywordSearch(

      keyword,

      destinationSearchResult

    );

  }


  function destinationSearchResult(
    data,
    status
  ) {

    var messageBox =
      document.getElementById(
        "message"
      );


    if (
      status ===
      kakao.maps.services.Status.OK
    ) {

      var place =
        data[0];


      appEndLat =
        Number(
          place.y
        );


      appEndLng =
        Number(
          place.x
        );


      document.getElementById(
        "end"
      ).value =
        place.place_name;


      var destinationPosition =
        new kakao.maps.LatLng(
          appEndLat,
          appEndLng
        );


      if (fastRouteMap) {

        fastRouteMap.setCenter(
          destinationPosition
        );


        if (
          appDestinationMarker
        ) {

          appDestinationMarker.setMap(
            null
          );

        }


        appDestinationMarker =
          new kakao.maps.Marker({

            position:
              destinationPosition

          });


        appDestinationMarker.setMap(
          fastRouteMap
        );

      }


      messageBox.innerText =
        "도착지를 설정했습니다 · " +
        place.place_name;

    }


    else if (
      status ===
      kakao.maps.services.Status.ZERO_RESULT
    ) {

      messageBox.innerText =
        "검색 결과가 없습니다.";

    }


    else {

      messageBox.innerText =
        "도착지를 검색하지 못했습니다.";

    }

  }


  // =====================================================
  // 경로 검색
  // =====================================================

  async function findRoute() {

    var messageBox =
      document.getElementById(
        "message"
      );


    if (
      appStartLat === null ||
      appStartLng === null
    ) {

      messageBox.innerText =
        "현재 위치를 먼저 확인해주세요.";

      return;
    }


    if (
      appEndLat === null ||
      appEndLng === null
    ) {

      messageBox.innerText =
        "도착지를 먼저 설정해주세요.";

      return;
    }


    messageBox.innerText =
      "대중교통 경로를 찾고 있습니다...";


    document.getElementById(
      "routeResults"
    ).innerHTML = "";


    var apiUrl =

      "/api/kakao" +

      "?startX=" +
      encodeURIComponent(
        appStartLng
      ) +

      "&startY=" +
      encodeURIComponent(
        appStartLat
      ) +

      "&endX=" +
      encodeURIComponent(
        appEndLng
      ) +

      "&endY=" +
      encodeURIComponent(
        appEndLat
      );


    try {

      var response =
        await fetch(apiUrl);


      var data =
        await response.json();


      console.log(
        "경로 결과:",
        data
      );


      if (!response.ok) {

        console.error(
          "카카오 경로 API 오류:",
          data
        );


        messageBox.innerText =
          "대중교통 경로 검색에 실패했습니다.";

        return;
      }


      if (
        !Array.isArray(
          data.routes
        ) ||
        data.routes.length === 0
      ) {

        messageBox.innerText =
          "이용 가능한 대중교통 경로가 없습니다.";

        return;
      }


      // 카카오가 경로를 찾은 시점
      // 여기부터 실시간 API 실패 때문에
      // 경로 자체를 없애면 안 됨
      messageBox.innerText =
        "경로 " +
        data.routes.length +
        "개를 찾았습니다. 실시간 정보를 확인하고 있습니다...";


      await analyzeAllRoutes(
        data.routes
      );

    }


    catch (error) {

      console.error(
        "경로 검색 오류:",
        error
      );


      messageBox.innerText =
        "경로를 불러오는 중 오류가 발생했습니다.";

    }

  }


  // =====================================================
  // 모든 경로 분석
  // =====================================================

  async function analyzeAllRoutes(
    routes
  ) {

    var analyzed = [];


    // 한 경로의 실시간 API가 실패하더라도
    // 다음 경로 계속 분석
    for (
      var i = 0;
      i < routes.length;
      i++
    ) {

      try {

        var result =
          await analyzeSingleRoute(
            routes[i]
          );


        analyzed.push(
          result
        );

      }

      catch (error) {

        console.error(
          "개별 경로 분석 실패:",
          error
        );


        analyzed.push({

          route:
            routes[i],

          firstTransitType:
            "",

          transitName:
            "",

          boardingName:
            "",

          alightingName:
            "",

          nextStopName:
            "",

          walkingSeconds:
            null,

          walkingDistance:
            null,

          realtimeChecked:
            false,

          catchable:
            false,

          arrivalSeconds:
            null,

          spareSeconds:
            null,

          reason:
            "실시간 분석 오류"

        });

      }

    }


    console.log(
      "전체 분석 결과:",
      analyzed
    );


    // -----------------------------------------
    // 3분 초과 확인
    // -----------------------------------------

    var catchableRoutes =
      analyzed.filter(
        function(item) {

          return (
            item.realtimeChecked === true &&
            item.catchable === true
          );

        }
      );


    // -----------------------------------------
    // 실시간 확인 불가
    // -----------------------------------------

    var uncheckedRoutes =
      analyzed.filter(
        function(item) {

          return (
            item.realtimeChecked !== true
          );

        }
      );


    // -----------------------------------------
    // 실시간 확인했으나 3분 이하
    // -----------------------------------------

    var failedRoutes =
      analyzed.filter(
        function(item) {

          return (
            item.realtimeChecked === true &&
            item.catchable === false
          );

        }
      );


    function sortByTotalTime(
      a,
      b
    ) {

      return (

        Number(
          a.route?.properties?.totalTime ||
          999999
        )

        -

        Number(
          b.route?.properties?.totalTime ||
          999999
        )

      );

    }


    catchableRoutes.sort(
      sortByTotalTime
    );


    uncheckedRoutes.sort(
      sortByTotalTime
    );


    failedRoutes.sort(
      sortByTotalTime
    );


    // =========================================
    // 핵심
    //
    // 실시간 데이터가 없어도
    // 카카오 경로 자체는 삭제하지 않음
    // =========================================

    var orderedRoutes =

      catchableRoutes

        .concat(
          uncheckedRoutes
        )

        .concat(
          failedRoutes
        );


    displayedRoutes =
      orderedRoutes.slice(
        0,
        3
      );


    openedRouteIndex =
      null;


    if (
      displayedRoutes.length === 0
    ) {

      showNoRoutes();


      document.getElementById(
        "message"
      ).innerText =
        "표시할 수 있는 경로가 없습니다.";

      return;
    }


    showRouteResults(
      displayedRoutes
    );


    drawRouteOnMap(
      displayedRoutes[0].route
    );


    if (
      catchableRoutes.length > 0
    ) {

      document.getElementById(
        "message"
      ).innerText =

        "3분 초과 탑승 여유가 확인된 경로 " +
        catchableRoutes.length +
        "개가 있습니다.";

    }

    else {

      document.getElementById(
        "message"
      ).innerText =

        "경로는 정상적으로 찾았습니다. 실시간 확인이 어려운 경로는 일반 경로 정보로 표시합니다.";

    }

  }


  // =====================================================
  // 경로 하나 분석
  // =====================================================

  async function analyzeSingleRoute(
    route
  ) {

    var result = {

      route: route,

      firstTransitType: "",

      transitName: "",

      boardingName: "",

      alightingName: "",

      nextStopName: "",

      walkingSeconds: null,

      walkingDistance: null,

      realtimeChecked: false,

      catchable: false,

      arrivalSeconds: null,

      spareSeconds: null,

      reason: ""

    };


    if (
      !route ||
      !Array.isArray(
        route.steps
      )
    ) {

      result.reason =
        "경로 단계 없음";

      return result;
    }


    var firstTransitStep =
      null;


    for (
      var i = 0;
      i < route.steps.length;
      i++
    ) {

      var step =
        route.steps[i];


      var properties =
        step.properties || {};


      var type =
        String(
          properties.type ||
          step.type ||
          ""
        ).toUpperCase();


      if (
        type === "SUBWAY" ||
        type === "BUS"
      ) {

        firstTransitStep =
          step;

        break;
      }

    }


    if (!firstTransitStep) {

      result.reason =
        "대중교통 단계 없음";

      return result;
    }


    var properties =
      firstTransitStep.properties ||
      {};


    result.firstTransitType =
      String(
        properties.type ||
        firstTransitStep.type ||
        ""
      ).toUpperCase();


    var stops =
      Array.isArray(
        properties.stops
      )
        ? properties.stops
        : [];


    if (
      stops.length > 0
    ) {

      result.boardingName =
        cleanStationName(
          getStopName(
            stops[0]
          )
        );


      result.alightingName =
        cleanStationName(
          getStopName(
            stops[
              stops.length - 1
            ]
          )
        );

    }


    if (
      stops.length > 1
    ) {

      result.nextStopName =
        cleanStationName(
          getStopName(
            stops[1]
          )
        );

    }


    var guidance =
      String(
        properties.guidance ||
        ""
      );


    var endpoints =
      parseEndpoints(
        guidance
      );


    if (
      !result.boardingName
    ) {

      result.boardingName =
        cleanStationName(
          endpoints.start
        );

    }


    if (
      !result.alightingName
    ) {

      result.alightingName =
        cleanStationName(
          endpoints.end
        );

    }


    if (
      result.firstTransitType ===
      "SUBWAY"
    ) {

      result.transitName =
        getSubwayLineName(
          guidance
        );

    }

    else {

      result.transitName =
        getBusName(
          properties
        );

    }


    // 첫 탑승 위치
    var boardingPoint =
      getFirstPathPoint(
        firstTransitStep
      );


    if (
      boardingPoint &&
      appStartLat !== null &&
      appStartLng !== null
    ) {

      var walking =
        estimateWalking(

          appStartLat,
          appStartLng,

          boardingPoint.lat,
          boardingPoint.lng

        );


      result.walkingSeconds =
        walking.seconds;


      result.walkingDistance =
        walking.distance;

    }


    // =========================================
    // 지하철
    // =========================================

    if (
      result.firstTransitType ===
      "SUBWAY"
    ) {

      if (
        result.walkingSeconds === null
      ) {

        result.reason =
          "탑승지까지 도보시간 확인 불가";

        return result;
      }


      await checkSubwayRealtime(
        result
      );

    }


    // =========================================
    // 버스
    // 아직 실시간 미연동
    // 경로 자체는 그대로 유지
    // =========================================

    else if (
      result.firstTransitType ===
      "BUS"
    ) {

      result.realtimeChecked =
        false;


      result.reason =
        "버스 실시간 확인 대기";

    }


    return result;

  }


  // =====================================================
  // 지하철 실시간
  // =====================================================

  async function checkSubwayRealtime(
    result
  ) {

    var station =
      normalizeStationName(
        result.boardingName
      );


    if (!station) {

      result.reason =
        "승차역 이름 확인 불가";

      return;
    }


    try {

      var response =
        await fetch(

          "/api/seoul-subway?station=" +

          encodeURIComponent(
            station
          )

        );


      // 502든 200이든
      // 가능하면 JSON은 읽음
      var data = null;


      try {

        data =
          await response.json();

      }

      catch (jsonError) {

        result.reason =
          "실시간 API 응답 확인 불가";

        return;

      }


      console.log(
        "지하철 실시간:",
        station,
        response.status,
        data
      );


      // =========================================
      // API 오류/데이터 없음
      //
      // 여기서 throw 하지 않음
      // 경로 자체를 살려둠
      // =========================================

      if (
        !response.ok ||
        !data ||
        data.success === false
      ) {

        result.realtimeChecked =
          false;


        result.reason =
          data?.error ||
          data?.message ||
          "실시간 정보 없음";


        return;

      }


      if (
        !Array.isArray(
          data.arrivals
        ) ||
        data.arrivals.length === 0
      ) {

        result.realtimeChecked =
          false;


        result.reason =
          data.message ||
          "현재 실시간 도착정보 없음";


        return;

      }


      var arrivals =
        data.arrivals.slice();


      // =========================================
      // 호선 필터
      // =========================================

      var subwayId =
        getSubwayId(
          result.transitName
        );


      if (subwayId) {

        var sameLine =
          arrivals.filter(
            function(item) {

              return (
                String(
                  item.subwayId
                ) ===
                String(
                  subwayId
                )
              );

            }
          );


        if (
          sameLine.length > 0
        ) {

          arrivals =
            sameLine;

        }

        else {

          result.realtimeChecked =
            false;


          result.reason =
            "해당 호선 실시간 정보 없음";


          return;

        }

      }


      // =========================================
      // 0초 이하 제외
      // =========================================

      arrivals =
        arrivals.filter(
          function(item) {

            return (
              Number(
                item.arrivalSeconds
              ) > 0
            );

          }
        );


      if (
        arrivals.length === 0
      ) {

        result.realtimeChecked =
          false;


        result.reason =
          "사용 가능한 도착시간 없음";


        return;

      }


      // =========================================
      // 진행 방향
      // 다음 역 이름으로 확인
      // =========================================

      var nextStop =
        normalizeStationName(
          result.nextStopName
        );


      if (nextStop) {

        var directionMatched =
          arrivals.filter(
            function(item) {

              var trainLine =
                normalizeCompareText(
                  item.trainLine ||
                  ""
                );


              var target =
                normalizeCompareText(
                  nextStop
                );


              return (
                trainLine.indexOf(
                  target
                ) !== -1
              );

            }
          );


        // 방향 데이터가 실제로 매칭된 경우만 교체
        if (
          directionMatched.length > 0
        ) {

          arrivals =
            directionMatched;

        }

      }


      arrivals.sort(
        function(a, b) {

          return (
            Number(
              a.arrivalSeconds
            ) -
            Number(
              b.arrivalSeconds
            )
          );

        }
      );


      result.realtimeChecked =
        true;


      // =========================================
      // 핵심 알고리즘
      //
      // 열차 도착 - 도보 > 180초
      //
      // 첫 열차가 안 되면
      // 다음 열차 계속 확인
      // =========================================

      for (
        var i = 0;
        i < arrivals.length;
        i++
      ) {

        var arrivalSeconds =
          Number(
            arrivals[i]
              .arrivalSeconds
          );


        var spareSeconds =
          arrivalSeconds -
          result.walkingSeconds;


        console.log(
          "3분 판정:",
          result.transitName,
          result.boardingName,
          {
            arrivalSeconds:
              arrivalSeconds,

            walkingSeconds:
              result.walkingSeconds,

            spareSeconds:
              spareSeconds
          }
        );


        if (
          spareSeconds >
          MINIMUM_SPARE_SECONDS
        ) {

          result.catchable =
            true;


          result.arrivalSeconds =
            arrivalSeconds;


          result.spareSeconds =
            spareSeconds;


          result.reason =
            "3분 초과 탑승 가능";


          return;

        }

      }


      // 도착정보는 확인했지만
      // 조건을 만족하는 열차 없음
      result.catchable =
        false;


      // 화면 표시용으로 가장 가까운 열차 저장
      if (
        arrivals.length > 0
      ) {

        result.arrivalSeconds =
          Number(
            arrivals[0]
              .arrivalSeconds
          );


        result.spareSeconds =

          result.arrivalSeconds -

          result.walkingSeconds;

      }


      result.reason =
        "3분 초과 여유 열차 없음";

    }


    catch (error) {

      console.error(
        "지하철 실시간 오류:",
        error
      );


      // 중요:
      // API 실패가 경로 전체 실패가 아님
      result.realtimeChecked =
        false;


      result.reason =
        "실시간 정보 확인 실패";

    }

  }


  // =====================================================
  // 카드 상태

  // =====================================================
  // 카드 펼치기
  // =====================================================

  function toggleRoute(
    index
  ) {

    var selected =
      document.getElementById(
        "route-card-" +
        index
      );


    if (!selected) {
      return;
    }


    // 같은 카드 다시 클릭
    if (
      openedRouteIndex ===
      index
    ) {

      selected.classList.remove(
        "open"
      );


      selected.classList.remove(
        "selected"
      );


      openedRouteIndex =
        null;


      return;
    }


    var cards =
      document.querySelectorAll(
        ".routeCard"
      );


    cards.forEach(
      function(card) {

        card.classList.remove(
          "open"
        );


        card.classList.remove(
          "selected"
        );

      }
    );


    selected.classList.add(
      "open"
    );


    selected.classList.add(
      "selected"
    );


    openedRouteIndex =
      index;


    if (
      displayedRoutes[index]
    ) {

      drawRouteOnMap(
        displayedRoutes[index]
          .route
      );

    }

  }


  // =====================================================
  // 상세 경로
  // =====================================================

  function buildDetailedSteps(
    route
  ) {

    if (
      !route ||
      !Array.isArray(
        route.steps
      )
    ) {

      return "";

    }


    var html = "";


    route.steps.forEach(
      function(step) {

        var properties =
          step.properties || {};


        var type =
          String(
            properties.type ||
            step.type ||
            ""
          ).toUpperCase();


        var time =
          Number(
            properties.time ||
            0
          );


        var distance =
          Number(
            properties.distance ||
            0
          );


        var minutes =
          time > 0
            ? secondsToMinutes(time)
            : 0;


        var guidance =
          cleanGuidance(
            properties.guidance ||
            ""
          );


        var title =
          "이동";


        var meta =
          "";


        var icon =
          "•";


        // =====================================
        // 도보
        // =====================================

        if (
          type === "WALKING" ||
          type === "WALK"
        ) {

          title =
            "도보";


          icon =
            "W";


          if (minutes > 0) {

            meta +=
              minutes +
              "분";

          }


          if (distance > 0) {

            if (meta) {
              meta += " · ";
            }


            meta +=
              formatDistance(
                distance
              );

          }

        }


        // =====================================
        // 지하철
        // =====================================

        else if (
          type === "SUBWAY"
        ) {

          title =
            getSubwayLineName(
              properties.guidance ||
              ""
            );


          icon =
            "M";


          var subwayEndpoints =
            parseEndpoints(
              properties.guidance ||
              ""
            );


          if (
            subwayEndpoints.start ||
            subwayEndpoints.end
          ) {

            meta =
              cleanStationName(
                subwayEndpoints.start
              ) +

              " → " +

              cleanStationName(
                subwayEndpoints.end
              );

          }


          if (minutes > 0) {

            if (meta) {
              meta += " · ";
            }


            meta +=
              minutes +
              "분";

          }


          if (distance > 0) {

            if (meta) {
              meta += " · ";
            }


            meta +=
              formatDistance(
                distance
              );

          }

        }


        // =====================================
        // 버스
        // =====================================

        else if (
          type === "BUS"
        ) {

          title =
            getBusName(
              properties
            );


          icon =
            "B";


          var busEndpoints =
            parseEndpoints(
              properties.guidance ||
              ""
            );


          if (
            busEndpoints.start ||
            busEndpoints.end
          ) {

            meta =
              cleanStationName(
                busEndpoints.start
              ) +

              " → " +

              cleanStationName(
                busEndpoints.end
              );

          }


          if (minutes > 0) {

            if (meta) {
              meta += " · ";
            }


            meta +=
              minutes +
              "분";

          }


          if (distance > 0) {

            if (meta) {
              meta += " · ";
            }


            meta +=
              formatDistance(
                distance
              );

          }

        }


        html += `

          <div class="step">

            <div class="stepMarkerColumn">

              <div class="stepDot">
                ${icon}
              </div>

              <div class="stepLine"></div>

            </div>


            <div class="stepContent">

              <div class="stepMain">
                ${escapeHTML(title)}
              </div>

              ${
                meta

                  ? `
                    <div class="stepMeta">
                      ${escapeHTML(meta)}
                    </div>
                  `

                  : ""
              }

              ${
                guidance

                  ? `
                    <div class="stepGuidance">
                      ${escapeHTML(guidance)}
                    </div>
                  `

                  : ""
              }

            </div>

          </div>

        `;

      }
    );


    return html;

  }


  // =====================================================
  // 중복 역명 제거
  // =====================================================

  function removeRepeatedWord(
    value
  ) {

    var text =
      String(
        value || ""
      );


    // 응암응암 → 응암
    // 불광불광 → 불광
    // 충무로충무로 → 충무로
    text =
      text.replace(
        /([가-힣]{2,})\1/g,
        "$1"
      );


    return text;

  }


  function cleanStationName(
    value
  ) {

    var text =
      String(
        value || ""
      ).trim();


    text =
      removeRepeatedWord(
        text
      );


    text =
      text.replace(
        /역역/g,
        "역"
      );


    text =
      text.replace(
        /정류장정류장/g,
        "정류장"
      );


    return text.trim();

  }


  function cleanGuidance(
    value
  ) {

    var text =
      String(
        value || ""
      ).trim();


    text =
      removeRepeatedWord(
        text
      );


    text =
      text.replace(
        /역역/g,
        "역"
      );


    text =
      text.replace(
        /정류장정류장/g,
        "정류장"
      );


    return text.trim();

  }


  // =====================================================
  // 실시간용 역 이름
  // =====================================================

  function normalizeStationName(
    value
  ) {

    var text =
      cleanStationName(
        value
      );


    // 새절(신사) → 새절
    text =
      text.replace(
        /\([^)]*\)/g,
        ""
      );


    // 서울역 → 서울
    text =
      text.replace(
        /역$/,
        ""
      );


    return text.trim();

  }


  function normalizeCompareText(
    value
  ) {

    return normalizeStationName(
      value
    )
    .replace(
      /\s+/g,
      ""
    );

  }


  // =====================================================
  // stop 이름
  // =====================================================

  function getStopName(
    stop
  ) {

    if (!stop) {
      return "";
    }


    if (
      typeof stop ===
      "string"
    ) {

      return stop;
    }


    return String(

      stop.name ||

      stop.stationName ||

      stop.stopName ||

      stop.statnNm ||

      ""

    );

  }


  // =====================================================
  // guidance 출발/도착
  // =====================================================

  function parseEndpoints(
    guidance
  ) {

    var result = {

      start: "",
      end: ""

    };


    var text =
      String(
        guidance || ""
      );


    // 새절(신사)처럼 역 이름 자체에 괄호가 있으므로
    // 바깥 괄호를 기준으로 > 앞뒤를 나눔
    var firstParen =
      text.indexOf("(");


    var lastParen =
      text.lastIndexOf(")");


    if (
      firstParen !== -1 &&
      lastParen >
      firstParen
    ) {

      var inside =
        text.substring(
          firstParen + 1,
          lastParen
        );


      var arrowIndex =
        inside.indexOf(
          ">"
        );


      if (
        arrowIndex !== -1
      ) {

        result.start =
          cleanStationName(
            inside
              .substring(
                0,
                arrowIndex
              )
              .trim()
          );


        result.end =
          cleanStationName(
            inside
              .substring(
                arrowIndex + 1
              )
              .trim()
          );

      }

    }


    return result;

  }


  // =====================================================
  // 지하철 호선
  // =====================================================

  function getSubwayLineName(
    guidance
  ) {

    var text =
      String(
        guidance || ""
      );


    var index =
      text.indexOf("(");


    if (
      index !== -1
    ) {

      return text
        .substring(
          0,
          index
        )
        .trim();

    }


    return (
      text.trim() ||
      "지하철"
    );

  }


  // =====================================================
  // 서울 지하철 ID
  // =====================================================

  function getSubwayId(
    lineName
  ) {

    var text =
      String(
        lineName || ""
      );


    var numberMatch =
      text.match(
        /([1-9])호선/
      );


    if (numberMatch) {

      return (
        "100" +
        numberMatch[1]
      );

    }


    var lineMap = {

      "경의중앙선":
        "1063",

      "공항철도":
        "1065",

      "경춘선":
        "1067",

      "수인분당선":
        "1075"

    };


    for (
      var name in lineMap
    ) {

      if (
        text.indexOf(name) !==
        -1
      ) {

        return lineMap[name];

      }

    }


    return "";

  }


  // =====================================================
  // 버스 이름
  // =====================================================

  function getBusName(
    properties
  ) {

    var vehicles =
      Array.isArray(
        properties.vehicles
      )
        ? properties.vehicles
        : [];


    if (
      vehicles.length > 0
    ) {

      return vehicles.map(
        function(vehicle) {

          var type =
            String(
              vehicle.type ||
              ""
            ).trim();


          var name =
            String(
              vehicle.name ||
              ""
            ).trim();


          return (
            type +
            " " +
            name
          ).trim();

        }
      ).join(
        " · "
      );

    }


    var guidance =
      String(
        properties.guidance ||
        ""
      );


    if (guidance) {

      return guidance
        .split("(")[0]
        .trim();

    }


    return "버스";

  }


  // =====================================================
  // 첫 탑승 좌표
  // =====================================================

  function getFirstPathPoint(
    step
  ) {

    if (
      !step ||
      !step.path ||
      !Array.isArray(
        step.path.points
      ) ||
      step.path.points.length === 0
    ) {

      return null;
    }


    var point =
      step.path.points[0];


    // 실제 확인한 구조:
    // [경도, 위도]
    if (
      Array.isArray(point) &&
      point.length >= 2
    ) {

      var lng =
        Number(
          point[0]
        );


      var lat =
        Number(
          point[1]
        );


      if (
        Number.isFinite(lng) &&
        Number.isFinite(lat)
      ) {

        return {

          lng: lng,
          lat: lat

        };

      }

    }


    return null;

  }


  // =====================================================
  // 도보시간 임시 추정
  // =====================================================

  function estimateWalking(
    startLat,
    startLng,
    endLat,
    endLng
  ) {

    var earthRadius =
      6371000;


    var lat1 =
      startLat *
      Math.PI / 180;


    var lat2 =
      endLat *
      Math.PI / 180;


    var deltaLat =
      (endLat - startLat) *
      Math.PI / 180;


    var deltaLng =
      (endLng - startLng) *
      Math.PI / 180;


    var a =

      Math.sin(
        deltaLat / 2
      ) *
      Math.sin(
        deltaLat / 2
      )

      +

      Math.cos(lat1) *
      Math.cos(lat2) *

      Math.sin(
        deltaLng / 2
      ) *
      Math.sin(
        deltaLng / 2
      );


    var c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );


    var straightDistance =
      earthRadius * c;


    // 실제 보행경로가 아니므로
    // 직선거리보다 조금 길게 추정
    var estimatedDistance =
      straightDistance * 1.25;


    // 약 시속 4km
    var walkingSpeed =
      4000 / 3600;


    var seconds =
      Math.ceil(
        estimatedDistance /
        walkingSpeed
      );


    return {

      seconds:
        seconds,

      distance:
        Math.round(
          estimatedDistance
        )

    };

  }


  // =====================================================
  // 지도 경로 제거
  // =====================================================

  function clearRouteObjects() {

    routePolylines.forEach(
      function(polyline) {

        polyline.setMap(null);

      }
    );


    routeMarkers.forEach(
      function(marker) {

        marker.setMap(null);

      }
    );


    routePolylines = [];
    routeMarkers = [];

  }


  // =====================================================
  // 선택한 경로 지도에 그리기
  // =====================================================

  function drawRouteOnMap(
    route
  ) {

    if (
      !fastRouteMap ||
      !route ||
      !Array.isArray(
        route.steps
      )
    ) {

      return;
    }


    clearRouteObjects();


    var bounds =
      new kakao.maps.LatLngBounds();


    if (
      appStartLat !== null &&
      appStartLng !== null
    ) {

      bounds.extend(

        new kakao.maps.LatLng(
          appStartLat,
          appStartLng
        )

      );

    }


    route.steps.forEach(
      function(step) {

        var properties =
          step.properties || {};


        var type =
          String(
            properties.type ||
            step.type ||
            ""
          ).toUpperCase();


        var points = [];


        if (
          step.path &&
          Array.isArray(
            step.path.points
          )
        ) {

          points =
            step.path.points;

        }


        var path =
          convertPoints(
            points
          );


        if (
          path.length === 0
        ) {

          return;
        }


        path.forEach(
          function(position) {

            bounds.extend(
              position
            );

          }
        );


        var color =
          "#A4BCA5";


        // 버스
        if (
          type === "BUS"
        ) {

          color =
            "#4B8281";

        }


        // 지하철
        else if (
          type === "SUBWAY"
        ) {

          color =
            "#263D38";

        }


        // 도보
        else if (
          type === "WALKING" ||
          type === "WALK"
        ) {

          color =
            "#8BA58A";

        }


        var polyline =
          new kakao.maps.Polyline({

            path:
              path,

            strokeWeight:
              5,

            strokeColor:
              color,

            strokeOpacity:
              0.85

          });


        polyline.setMap(
          fastRouteMap
        );


        routePolylines.push(
          polyline
        );


        // 대중교통 구간의
        // 승차/하차 위치
        if (
          type === "BUS" ||
          type === "SUBWAY"
        ) {

          var startMarker =
            new kakao.maps.Marker({

              position:
                path[0]

            });


          var endMarker =
            new kakao.maps.Marker({

              position:
                path[
                  path.length - 1
                ]

            });


          startMarker.setMap(
            fastRouteMap
          );


          endMarker.setMap(
            fastRouteMap
          );


          routeMarkers.push(
            startMarker
          );


          routeMarkers.push(
            endMarker
          );

        }

      }
    );


    if (
      appEndLat !== null &&
      appEndLng !== null
    ) {

      bounds.extend(

        new kakao.maps.LatLng(
          appEndLat,
          appEndLng
        )

      );

    }


    fastRouteMap.setBounds(
      bounds
    );

  }


  // =====================================================
  // [경도, 위도] → LatLng
  // =====================================================

  function convertPoints(
    points
  ) {

    var result = [];


    if (!Array.isArray(points)) {

      return result;
    }


    points.forEach(
      function(point) {

        if (
          !Array.isArray(point) ||
          point.length < 2
        ) {

          return;
        }


        var lng =
          Number(
            point[0]
          );


        var lat =
          Number(
            point[1]
          );


        if (
          !Number.isFinite(lng) ||
          !Number.isFinite(lat)
        ) {

          return;
        }


        result.push(

          new kakao.maps.LatLng(
            lat,
            lng
          )

        );

      }
    );


    return result;

  }


  // =====================================================
  // 결과 없음
  // =====================================================

  function showNoRoutes() {

    document.getElementById(
      "routeResults"
    ).innerHTML = `

      <div class="resultsHeader">

        <h2 class="resultsTitle">
          추천 경로
        </h2>

      </div>


      <div class="emptyCard">

        <div class="emptyTitle">
          표시할 경로가 없습니다
        </div>

        <div class="emptyText">
          출발지와 도착지를 다시 확인해주세요.
        </div>

      </div>

    `;

  }


  // =====================================================
  // 초 → 분
  // =====================================================

  function secondsToMinutes(
    seconds
  ) {

    var value =
      Number(
        seconds
      );


    if (
      !Number.isFinite(value) ||
      value <= 0
    ) {

      return 0;
    }


    return Math.ceil(
      value / 60
    );

  }


  // =====================================================
  // 여유시간
  // =====================================================

  function formatSeconds(
    seconds
  ) {

    var value =
      Math.max(
        0,
        Math.round(
          Number(seconds) ||
          0
        )
      );


    var minutes =
      Math.floor(
        value / 60
      );


    var remaining =
      value % 60;


    if (
      remaining === 0
    ) {

      return (
        minutes +
        "분"
      );

    }


    return (
      minutes +
      "분 " +
      remaining +
      "초"
    );

  }


  // =====================================================
  // 거리
  // =====================================================

  function formatDistance(
    meters
  ) {

    var value =
      Number(
        meters
      );


    if (
      !Number.isFinite(value)
    ) {

      return "";
    }


    if (
      value < 1000
    ) {

      return (
        Math.round(value) +
        "m"
      );

    }


    return (

      (
        Math.round(
          value / 100
        ) / 10
      )

      +

      "km"

    );

  }


  // =====================================================
  // HTML escape
  // =====================================================

  function escapeHTML(
    value
  ) {

    return String(
      value || ""
    )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

  }

</script>
