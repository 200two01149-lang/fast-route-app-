<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>빠른길</title>

  <style>
    :root {
      --mint1: #98C0AB;
      --mint2: #7FA18E;
      --teal: #4B8281;

      --cream1: #E0E1D2;
      --cream2: #D0D4BC;

      --green1: #A4BCA5;
      --green2: #8BA58A;
      --green3: #778D78;
      --green4: #4F6962;

      --deep: #263D38;
      --white: #FFFFFF;
      --black: #141817;

      --background: #F4F6F2;
      --border: #E2E7E1;
      --gray: #6D7873;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      background:
        var(--background);

      color:
        var(--deep);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
    }


    .app {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;

      margin: 0 auto;
      padding-bottom: 40px;
    }


    header {
      padding:
        28px 20px 24px;

      background:
        var(--deep);

      color: white;
    }


    .smallTitle {
      color:
        var(--mint1);

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
    }


    h1 {
      margin:
        5px 0 0;

      font-size: 30px;
    }


    .headerText {
      margin-top: 8px;

      color:
        var(--cream1);

      font-size: 13px;
      line-height: 1.6;
    }


    .panel {
      margin: 15px;
      padding: 17px;

      background: white;

      border-radius: 19px;

      box-shadow:
        0 5px 20px
        rgba(38, 61, 56, 0.08);
    }


    .inputRow {
      display: flex;
      align-items: center;

      gap: 9px;

      margin-bottom: 10px;
    }


    .letter {
      width: 31px;
      height: 31px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        var(--cream1);

      font-size: 12px;
      font-weight: 900;
    }


    input {
      width: 100%;
      min-width: 0;

      padding: 13px;

      border:
        1px solid
        var(--border);

      border-radius: 11px;

      outline: none;

      font-size: 15px;
    }


    input:focus {
      border-color:
        var(--teal);
    }


    .buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 12px;
    }


    button {
      padding: 13px 8px;

      border: 0;
      border-radius: 11px;

      cursor: pointer;

      font-weight: 750;
      font-size: 14px;
    }


    #locationButton {
      background:
        var(--cream1);

      color:
        var(--deep);
    }


    #destinationButton {
      background:
        var(--mint1);

      color:
        var(--deep);
    }


    #routeButton {
      width: 100%;

      margin-top: 9px;

      background:
        var(--deep);

      color: white;
    }


    #message {
      margin:
        0 15px 15px;

      padding: 12px;

      background:
        var(--cream1);

      border-radius: 11px;

      color:
        var(--green4);

      text-align: center;

      font-size: 13px;
      line-height: 1.6;
    }


    .mapSection {
      margin:
        0 15px 20px;
    }


    .sectionTop {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 9px;
    }


    .sectionTitle {
      font-size: 18px;
      font-weight: 850;
    }


    .sectionSub {
      color:
        var(--gray);

      font-size: 11px;
    }


    .mapCard {
      padding: 5px;

      background: white;

      border-radius: 17px;

      overflow: hidden;

      box-shadow:
        0 5px 20px
        rgba(38, 61, 56, 0.08);
    }


    #map {
      width: 100%;
      height: 330px;

      border-radius: 13px;

      background:
        #E9EDE8;
    }


    #routeResults {
      padding:
        0 15px;
    }


    .resultsTitle {
      margin:
        0 0 5px;

      font-size: 20px;
      font-weight: 850;
    }


    .resultsSub {
      margin-bottom: 12px;

      color:
        var(--gray);

      font-size: 12px;
      line-height: 1.6;
    }


    .routeCard {
      margin-bottom: 13px;
      padding: 17px;

      background: white;

      border:
        2px solid
        transparent;

      border-radius: 18px;

      cursor: pointer;

      box-shadow:
        0 5px 18px
        rgba(38, 61, 56, 0.07);
    }


    .routeCard.selected {
      border-color:
        var(--teal);
    }


    .routeTop {
      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap: 10px;
    }


    .rank {
      color:
        var(--teal);

      font-size: 11px;
      font-weight: 850;
    }


    .time {
      margin-top: 3px;

      font-size: 29px;
      font-weight: 850;
    }


    .originalTime {
      margin-top: 2px;

      color:
        var(--gray);

      font-size: 11px;
    }


    .badge {
      padding:
        7px 9px;

      background:
        var(--cream1);

      border-radius: 20px;

      font-size: 11px;
      font-weight: 850;

      text-align: center;
    }


    .badge.passed {
      background:
        var(--mint1);
    }


    .badge.failed {
      background:
        #F1E1DD;

      color:
        #814B43;
    }


    .chips {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }


    .chip {
      padding:
        7px 8px;

      background:
        #F4F6F3;

      border-radius: 8px;

      color:
        var(--green4);

      font-size: 12px;
    }


    .transport {
      margin-top: 12px;

      color:
        var(--deep);

      font-size: 13px;
      font-weight: 750;
      line-height: 1.7;
    }


    .realtime {
      margin-top: 12px;
      padding: 12px;

      background:
        var(--cream1);

      border-radius: 11px;

      font-size: 12px;
      line-height: 1.75;
    }


    .detailButton {
      margin-top: 13px;
      padding-top: 12px;

      border-top:
        1px solid
        var(--border);

      color:
        var(--green4);

      font-size: 12px;
      font-weight: 800;
    }


    .details {
      display: none;

      margin-top: 14px;
    }


    .routeCard.open .details {
      display: block;
    }


    .step {
      margin-bottom: 10px;
      padding: 12px;

      background:
        #F7F8F5;

      border-radius: 11px;

      font-size: 13px;
      line-height: 1.6;
    }


    .stepTitle {
      display: flex;
      align-items: center;

      flex-wrap: wrap;

      gap: 7px;

      font-weight: 850;
    }


    .stepMeta {
      margin-top: 5px;

      color:
        var(--gray);

      font-size: 12px;
    }


    .arrivalBadge {
      margin-left: auto;

      padding:
        5px 9px;

      border-radius: 999px;

      background:
        var(--cream1);

      color:
        var(--deep);

      font-size: 12px;
      font-weight: 850;

      white-space: nowrap;
    }


    .arrivalBadge.passed {
      background:
        var(--mint1);
    }


    .arrivalBadge.failed {
      background:
        #F2DFDB;

      color:
        #82463E;
    }


    .arrivalBadge.unknown {
      background:
        #ECEEEA;

      color:
        #69726E;
    }


    .stepRealtime {
      margin-top: 7px;

      padding-top: 7px;

      border-top:
        1px dashed
        #D9DED8;

      color:
        var(--green4);

      font-size: 11px;
      line-height: 1.65;
    }


    .waitText {
      font-weight: 800;
    }


    @media (
      max-width: 480px
    ) {

      #map {
        height: 300px;
      }


      .panel,
      .mapSection {
        margin-left: 12px;
        margin-right: 12px;
      }


      #routeResults {
        padding:
          0 12px;
      }

    }
  </style>


  <!--
    Kakao Maps SDK

    동적 autoload=false 방식은 사용하지 않습니다.
    임시 JavaScript 키는 기존 파일의 값을 그대로 사용합니다.
  -->

  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=16010f0659e99afc9e0d760620666d16&libraries=services">
  </script>

</head>


<body>

<div class="app">


  <header>

    <div class="smallTitle">
      FAST ROUTE
    </div>


    <h1>
      빠른길
    </h1>


    <div class="headerText">

      버스·지하철 실시간 도착정보와
      환승 대기시간까지 계산해

      지금 출발했을 때
      실제로 탈 수 있는 경로를 찾습니다.

    </div>

  </header>



  <section class="panel">


    <div class="inputRow">

      <div class="letter">
        A
      </div>

      <input
        id="start"
        type="text"
        placeholder="현재 위치"
        readonly
      >

    </div>



    <div class="inputRow">

      <div class="letter">
        B
      </div>

      <input
        id="end"
        type="text"
        placeholder="도착지를 입력하세요"
      >

    </div>



    <div class="buttons">

      <button
        id="locationButton"
        onclick="findMyLocation()"
      >
        📍 현재 위치
      </button>


      <button
        id="destinationButton"
        onclick="searchDestination()"
      >
        🔍 도착지 찾기
      </button>

    </div>



    <button
      id="routeButton"
      onclick="findRoute()"
    >
      🚍 빠른 대중교통 찾기
    </button>


  </section>



  <div id="message">
    지도를 준비하고 있습니다...
  </div>



  <section class="mapSection">

    <div class="sectionTop">

      <div class="sectionTitle">
        지도
      </div>

      <div class="sectionSub">
        경로 카드를 누르면 지도에 표시됩니다
      </div>

    </div>


    <div class="mapCard">

      <div id="map">
      </div>

    </div>

  </section>



  <section id="routeResults">
  </section>


</div>



<script>

// ==================================================
// 핵심 규칙
// ==================================================

// 차량이 승차장에 도착하는 시각과
// 내가 승차장에 도착하는 시각의 차이가
//
// 반드시 180초를 "초과"해야 한다.
//
// 181초 → 가능
// 180초 → 불가능
// 179초 → 불가능

const MIN_SPARE_SECONDS =
  180;


// 현재 위치에서 첫 승차지까지
// 실제 WALKING step이 없는 경우에만
// 추정 도보 계산에 사용.

const WALKING_SPEED_MPS =
  1.11;

const WALKING_DISTANCE_FACTOR =
  1.25;


// API 요청 제한시간

const REALTIME_TIMEOUT_MS =
  5000;



// ==================================================
// 전역 상태
// ==================================================

let map =
  null;

let places =
  null;


let startLat =
  null;

let startLng =
  null;


let endLat =
  null;

let endLng =
  null;


let myMarker =
  null;

let destinationMarker =
  null;


let routePolylines =
  [];


let displayedRoutes =
  [];


let selectedRouteIndex =
  0;


let currentSearchId =
  0;



// ==================================================
// Kakao SDK 확인
// ==================================================

function isKakaoReady() {

  return (

    typeof window.kakao !==
      "undefined" &&

    window.kakao.maps &&

    window.kakao.maps.services

  );

}



// ==================================================
// 지도 초기화
// ==================================================

function initializeMap() {

  if (
    !isKakaoReady()
  ) {

    console.error(
      "Kakao Maps SDK를 불러오지 못했습니다."
    );


    setMessage(
      "카카오 지도를 불러오지 못했습니다."
    );


    return false;
  }


  if (
    !map
  ) {

    const container =
      document.getElementById(
        "map"
      );


    const center =
      new kakao.maps.LatLng(
        37.5665,
        126.9780
      );


    map =
      new kakao.maps.Map(
        container,
        {
          center: center,
          level: 7
        }
      );

  }


  if (
    !places
  ) {

    places =
      new kakao.maps.services.Places();

  }


  return true;
}



// ==================================================
// 메시지
// ==================================================

function setMessage(
  text
) {

  const element =
    document.getElementById(
      "message"
    );


  if (
    element
  ) {

    element.textContent =
      text;

  }

}



// ==================================================
// 현재 위치
// ==================================================

function findMyLocation() {

  if (
    !initializeMap()
  ) {

    return;
  }


  if (
    !navigator.geolocation
  ) {

    setMessage(
      "이 브라우저에서는 현재 위치를 사용할 수 없습니다."
    );

    return;
  }


  setMessage(
    "현재 위치를 확인하고 있습니다..."
  );


  navigator.geolocation
    .getCurrentPosition(

      function(
        position
      ) {

        if (
          !initializeMap()
        ) {

          return;
        }


        startLat =
          Number(
            position.coords.latitude
          );


        startLng =
          Number(
            position.coords.longitude
          );


        const point =
          new kakao.maps.LatLng(
            startLat,
            startLng
          );


        if (
          myMarker
        ) {

          myMarker.setMap(
            null
          );

        }


        myMarker =
          new kakao.maps.Marker({
            map: map,
            position: point
          });


        map.setCenter(
          point
        );


        map.setLevel(
          5
        );


        document
          .getElementById(
            "start"
          )
          .value =
          "현재 위치";


        setMessage(
          "현재 위치를 찾았습니다."
        );

      },


      function(
        error
      ) {

        console.error(
          "위치 오류:",
          error
        );


        setMessage(
          "현재 위치를 가져오지 못했습니다. 브라우저의 위치 권한을 확인해주세요."
        );

      },


      {
        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          30000
      }

    );

}



// ==================================================
// 도착지 검색
// ==================================================

function searchDestination() {

  if (
    !initializeMap()
  ) {

    return;
  }


  const keyword =
    document
      .getElementById(
        "end"
      )
      .value
      .trim();


  if (
    !keyword
  ) {

    setMessage(
      "도착지를 입력해주세요."
    );

    return;
  }


  setMessage(
    "도착지를 찾고 있습니다..."
  );


  places.keywordSearch(

    keyword,

    function(
      data,
      status
    ) {

      if (
        status !==
          kakao.maps.services.Status.OK ||

        !Array.isArray(
          data
        ) ||

        data.length ===
          0
      ) {

        setMessage(
          "도착지를 찾지 못했습니다."
        );

        return;
      }


      const place =
        data[0];


      endLat =
        Number(
          place.y
        );


      endLng =
        Number(
          place.x
        );


      const point =
        new kakao.maps.LatLng(
          endLat,
          endLng
        );


      if (
        destinationMarker
      ) {

        destinationMarker
          .setMap(
            null
          );

      }


      destinationMarker =
        new kakao.maps.Marker({
          map: map,
          position: point
        });


      document
        .getElementById(
          "end"
        )
        .value =
        place.place_name ||
        keyword;


      map.setCenter(
        point
      );


      setMessage(
        "도착지를 선택했습니다. 빠른 대중교통 찾기를 눌러주세요."
      );

    }

  );

}



// ==================================================
// Enter로 도착지 검색
// ==================================================

document
  .getElementById(
    "end"
  )
  .addEventListener(

    "keydown",

    function(
      event
    ) {

      if (
        event.key ===
        "Enter"
      ) {

        searchDestination();

      }

    }

  );



// ==================================================
// 경로 검색
// ==================================================

async function findRoute() {

  if (
    !initializeMap()
  ) {

    return;
  }


  if (
    startLat ===
      null ||

    startLng ===
      null
  ) {

    setMessage(
      "먼저 현재 위치를 찾아주세요."
    );

    return;
  }


  if (
    endLat ===
      null ||

    endLng ===
      null
  ) {

    setMessage(
      "먼저 도착지를 검색해주세요."
    );

    return;
  }


  const searchId =
    ++currentSearchId;


  setMessage(
    "대중교통 경로를 찾고 있습니다..."
  );


  try {

    const url =
      "/api/kakao" +

      "?startX=" +
      encodeURIComponent(
        startLng
      ) +

      "&startY=" +
      encodeURIComponent(
        startLat
      ) +

      "&endX=" +
      encodeURIComponent(
        endLng
      ) +

      "&endY=" +
      encodeURIComponent(
        endLat
      );


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    console.log(
      "경로 결과:",
      data
    );


    if (
      searchId !==
      currentSearchId
    ) {

      return;
    }


    if (
      !response.ok
    ) {

      throw new Error(
        data?.error ||
        "경로 API 오류"
      );

    }


    const routes =
      Array.isArray(
        data.routes
      )

        ? data.routes

        : [];


    if (
      routes.length ===
      0
    ) {

      displayedRoutes =
        [];


      renderRoutes();


      setMessage(
        "대중교통 경로를 찾지 못했습니다."
      );


      return;
    }


    // Kakao 기본 소요시간 순으로 정렬

    const sorted =
      routes
        .slice()
        .sort(

          function(
            a,
            b
          ) {

            return (

              Number(
                a?.properties
                  ?.totalTime ||
                0
              )

              -

              Number(
                b?.properties
                  ?.totalTime ||
                0
              )

            );

          }

        );


    // 실시간 분석 전에도
    // 우선 Kakao 경로 3개를 즉시 표시.

    displayedRoutes =
      sorted
        .slice(
          0,
          3
        )
        .map(
          createInitialRouteState
        );


    selectedRouteIndex =
      0;


    renderRoutes();


    if (
      displayedRoutes[0]
    ) {

      drawRoute(
        displayedRoutes[0]
          .route
      );

    }


    setMessage(
      "경로를 찾았습니다. 버스·지하철 실시간 도착시간과 환승 대기시간을 계산하고 있습니다..."
    );


    // ----------------------------------------------
    // 여기부터가 이번 버전의 핵심.
    //
    // 모든 경로를
    //
    // 현재시각
    // → 첫 도보
    // → 첫 차량
    // → 이동
    // → 환승 도보
    // → 다음 차량
    //
    // 순서로 계산한다.
    // ----------------------------------------------

    verifyRealtimeRoutes(
      sorted,
      searchId
    );

  }


  catch (
    error
  ) {

    console.error(
      "경로 검색 오류:",
      error
    );


    setMessage(
      "대중교통 경로를 가져오지 못했습니다."
    );

  }

}



// ==================================================
// 초기 경로 상태
// ==================================================

function createInitialRouteState(
  route
) {

  return {

    route:
      route,


    // 아직 실시간 계산 전

    realtimeChecked:
      false,


    realtimeState:
      "checking",


    catchable:
      null,


    // 각 BUS / SUBWAY step의
    // 실시간 계산 결과가 들어간다.
    //
    // 예:
    //
    // transitResults[2] = {
    //   type: "BUS",
    //   arrivalSeconds: 1260,
    //   waitSeconds: 240,
    //   boardAtSeconds: 1260
    // }

    transitResults:
      {},


    // 현재부터 최종 목적지까지
    // 실시간 대기시간을 포함한 예상 초.

    realtimeTotalSeconds:
      null,


    // 첫 탑승지까지 도보

    walkingSeconds:
      null,


    walkingDistance:
      null,


    walkingEstimated:
      false,


    reason:
      "실시간 확인 중"

  };

}



// ==================================================
// 매우 중요
//
// 이번 버전의 시간 계산 기준
// ==================================================
//
// 모든 시간은 "경로 검색을 시작한 현재 시각"을
// 0초로 본다.
//
// 예:
//
// 현재 08:00
//
// 300초 = 08:05
// 600초 = 08:10
// 1200초 = 08:20
//
//
// cumulativeSeconds:
//
// 사용자가 지금 출발해서
// 현재 step 위치에 도착하는 데 걸리는
// 누적 시간을 뜻한다.
//
// 예:
//
// 현재 위치
// ↓ 도보 4분
//
// cumulativeSeconds = 240
//
// 첫 버스가 지금부터 8분 후 도착
//
// arrivalSeconds = 480
//
// 480 - 240 = 240초
//
// 240 > 180
//
// 따라서 탑승 가능.
//
// 버스 이동시간이 10분이면
//
// cumulativeSeconds =
//   480 + 600
// = 1080초
//
// 즉 지금부터 18분 뒤에
// 버스에서 내린다.
//
// 이후 환승 도보가 2분이면
//
// cumulativeSeconds = 1200
//
// 즉 지금부터 20분 뒤
// 두 번째 정류장에 도착.
//
// 두 번째 버스가
// "7분 뒤 도착"이었다면
//
// arrivalSeconds = 420
//
// 이미 20분 뒤에 도착하는 사용자보다
// 훨씬 전에 지나갔으므로 자동 탈락.
//
// 다음 버스가 25분 뒤라면
//
// 1500 - 1200 = 300초
//
// 300 > 180
//
// 탑승 가능.
//
// 이 방식으로 모든 환승을 계산한다.
// ==================================================
  // ==================================================
// 모든 경로 실시간 검증
// ==================================================

async function verifyRealtimeRoutes(
  routes,
  searchId
) {

  const analyzed =
    await Promise.all(

      routes.map(

        function(
          route
        ) {

          return analyzeRouteWithTimeout(
            route,
            9000
          );

        }

      )

    );


  if (
    searchId !==
    currentSearchId
  ) {

    return;
  }


  // 모든 환승까지 실시간 검증된 경로

  const passed =
    analyzed

      .filter(

        function(
          item
        ) {

          return (
            item.realtimeChecked === true &&
            item.catchable === true
          );

        }

      )

      .sort(
        compareRealtimeTime
      );


  // 일부 실시간 정보를 확인하지 못한 경로

  const unknown =
    analyzed

      .filter(

        function(
          item
        ) {

          return (
            item.realtimeChecked === false
          );

        }

      )

      .sort(
        compareRealtimeTime
      );


  // 실제로 환승 불가능한 경로

  const failed =
    analyzed

      .filter(

        function(
          item
        ) {

          return (
            item.realtimeChecked === true &&
            item.catchable === false
          );

        }

      )

      .sort(
        compareRealtimeTime
      );


  // 탑승 가능한 경로 우선.
  // 그 안에서는 실시간 예상 총시간이 빠른 순.

  displayedRoutes =
    passed
      .concat(
        unknown
      )
      .concat(
        failed
      )
      .slice(
        0,
        3
      );


  selectedRouteIndex =
    0;


  renderRoutes();


  if (
    displayedRoutes.length > 0
  ) {

    drawRoute(
      displayedRoutes[0]
        .route
    );

  }


  if (
    passed.length > 0
  ) {

    setMessage(
      "실시간 도착·환승 대기시간 계산 완료 · 탑승 가능한 빠른 경로를 우선 표시합니다."
    );

  }

  else {

    setMessage(
      "실시간 계산을 완료했지만 모든 환승에서 3분 초과 여유가 확인된 경로가 없습니다."
    );

  }

}



// ==================================================
// 실시간 예상시간 정렬
// ==================================================

function compareRealtimeTime(
  a,
  b
) {

  const aTime =
    Number.isFinite(
      a.realtimeTotalSeconds
    )

      ? a.realtimeTotalSeconds

      : Number(
          a.route
            ?.properties
            ?.totalTime ||
          999999
        );


  const bTime =
    Number.isFinite(
      b.realtimeTotalSeconds
    )

      ? b.realtimeTotalSeconds

      : Number(
          b.route
            ?.properties
            ?.totalTime ||
          999999
        );


  return (
    aTime -
    bTime
  );

}



// ==================================================
// 경로 분석 제한시간
// ==================================================

async function analyzeRouteWithTimeout(
  route,
  timeoutMs
) {

  const fallback =
    createInitialRouteState(
      route
    );


  fallback.realtimeState =
    "unknown";


  fallback.reason =
    "실시간 확인 시간이 초과되었습니다.";


  try {

    return await Promise.race([

      analyzeFullRoute(
        route
      ),


      new Promise(

        function(
          resolve
        ) {

          setTimeout(

            function() {

              resolve(
                fallback
              );

            },

            timeoutMs

          );

        }

      )

    ]);

  }


  catch (
    error
  ) {

    console.error(
      "실시간 경로 분석 오류:",
      error
    );


    fallback.realtimeState =
      "unknown";


    fallback.reason =
      "실시간 정보를 확인하지 못했습니다.";


    return fallback;

  }

}



// ==================================================
// 경로 전체를 시간 순서대로 분석
// ==================================================

async function analyzeFullRoute(
  route
) {

  const result =
    createInitialRouteState(
      route
    );


  if (
    !route ||
    !Array.isArray(
      route.steps
    )
  ) {

    result.realtimeState =
      "unknown";


    result.reason =
      "경로 단계가 없습니다.";


    return result;
  }


  let cumulativeSeconds =
    0;


  let allRealtimeKnown =
    true;


  let allCatchable =
    true;


  let firstTransitFound =
    false;


  for (
    let index = 0;
    index < route.steps.length;
    index++
  ) {

    const step =
      route.steps[index];


    const type =
      getStepType(
        step
      );


    const properties =
      step.properties ||
      {};


    // ----------------------------------------------
    // 도보
    // ----------------------------------------------

    if (
      type === "WALKING" ||
      type === "WALK"
    ) {

      const walkingSeconds =
        Number(
          properties.time ||
          0
        );


      if (
        Number.isFinite(
          walkingSeconds
        ) &&
        walkingSeconds > 0
      ) {

        cumulativeSeconds +=
          walkingSeconds;

      }


      continue;
    }


    // ----------------------------------------------
    // 버스 / 지하철이 아니면
    // 시간만 더한다.
    // ----------------------------------------------

    if (
      type !== "BUS" &&
      type !== "SUBWAY"
    ) {

      const otherSeconds =
        Number(
          properties.time ||
          0
        );


      if (
        Number.isFinite(
          otherSeconds
        ) &&
        otherSeconds > 0
      ) {

        cumulativeSeconds +=
          otherSeconds;

      }


      continue;
    }


    // ----------------------------------------------
    // 첫 대중교통인데
    // Kakao가 앞 도보 step을 주지 않은 경우
    // 현재 위치 → 첫 path 좌표로 도보 추정
    // ----------------------------------------------

    if (
      !firstTransitFound
    ) {

      firstTransitFound =
        true;


      const access =
        calculateInitialAccessWalking(
          route,
          index
        );


      // 앞에 실제 WALKING step이 없었던 경우에만
      // 추정값을 누적한다.

      if (
        access.shouldAdd ===
        true &&
        access.seconds !==
        null
      ) {

        cumulativeSeconds +=
          access.seconds;

      }


      result.walkingSeconds =
        access.seconds;


      result.walkingDistance =
        access.distance;


      result.walkingEstimated =
        access.estimated;

    }


    // ----------------------------------------------
    // 사용자가 이 승차장에 도착하는 시점
    // ----------------------------------------------

    const passengerArrivalSeconds =
      cumulativeSeconds;


    // ----------------------------------------------
    // 해당 대중교통 실시간 조회
    // ----------------------------------------------

    let realtimeResult =
      null;


    if (
      type === "BUS"
    ) {

      realtimeResult =
        await getBusStepRealtime(
          step,
          passengerArrivalSeconds
        );

    }


    if (
      type === "SUBWAY"
    ) {

      realtimeResult =
        await getSubwayStepRealtime(
          step,
          passengerArrivalSeconds
        );

    }


    // step 번호별 결과 저장

    result.transitResults[
      index
    ] =
      realtimeResult;


    // ----------------------------------------------
    // 실시간 조회 자체가 불가능
    // ----------------------------------------------

    if (
      !realtimeResult ||
      realtimeResult.known !== true
    ) {

      allRealtimeKnown =
        false;


      // 실시간을 모른다고
      // 경로 자체를 중단하면
      // 이후 step 표시도 불가능해진다.
      //
      // 따라서 Kakao step 시간만 누적.

      const travelSeconds =
        Number(
          properties.time ||
          0
        );


      if (
        Number.isFinite(
          travelSeconds
        ) &&
        travelSeconds > 0
      ) {

        cumulativeSeconds +=
          travelSeconds;

      }


      continue;
    }


    // ----------------------------------------------
    // 실시간 정보는 있는데
    // 조건을 만족하는 차량이 없음
    // ----------------------------------------------

    if (
      realtimeResult.catchable !==
      true
    ) {

      allCatchable =
        false;


      result.realtimeChecked =
        true;


      result.catchable =
        false;


      result.realtimeState =
        "failed";


      result.realtimeTotalSeconds =
        null;


      result.reason =
        realtimeResult.reason ||
        "환승 가능한 차량이 없습니다.";


      // 여기서 경로 계산 종료.
      // 이 차량을 못 타면 이후 환승도 의미가 없다.

      return result;
    }


    // ----------------------------------------------
    // 탈 수 있는 차량을 찾음
    //
    // 핵심:
    //
    // cumulativeSeconds를
    // 차량 도착 시각으로 이동시킨다.
    //
    // 즉 기다린 시간까지 자동 포함된다.
    // ----------------------------------------------

    cumulativeSeconds =
      realtimeResult
        .arrivalSeconds;


    // ----------------------------------------------
    // 차량 이동시간
    // ----------------------------------------------

    const transitTravelSeconds =
      Number(
        properties.time ||
        0
      );


    if (
      Number.isFinite(
        transitTravelSeconds
      ) &&
      transitTravelSeconds > 0
    ) {

      cumulativeSeconds +=
        transitTravelSeconds;

    }

  }


  // ==================================================
  // 모든 step 처리 완료
  // ==================================================

  result.realtimeTotalSeconds =
    cumulativeSeconds;


  if (
    allRealtimeKnown &&
    allCatchable
  ) {

    result.realtimeChecked =
      true;


    result.catchable =
      true;


    result.realtimeState =
      "passed";


    result.reason =
      "모든 승차·환승에서 3분 초과 여유 확인";

  }

  else {

    result.realtimeChecked =
      false;


    result.catchable =
      null;


    result.realtimeState =
      "unknown";


    result.reason =
      "일부 구간의 실시간 도착정보를 확인하지 못했습니다.";

  }


  return result;

}



// ==================================================
// 지하철 step 실시간 조회
// ==================================================

async function getSubwayStepRealtime(
  step,
  passengerArrivalSeconds
) {

  const info =
    getTransitInfo(
      step
    );


  const station =
    getSubwayApiStationName(
      info.boarding
    );


  if (
    !station
  ) {

    return createUnknownTransitResult(
      "SUBWAY",
      info,
      passengerArrivalSeconds,
      "승차역을 확인할 수 없습니다."
    );

  }


  try {

    const controller =
      new AbortController();


    const timer =
      setTimeout(

        function() {

          controller.abort();

        },

        REALTIME_TIMEOUT_MS

      );


    const response =
      await fetch(

        "/api/seoul-subway?station=" +
        encodeURIComponent(
          station
        ),

        {
          signal:
            controller.signal
        }

      );


    clearTimeout(
      timer
    );


    const data =
      await response.json();


    if (
      !response.ok ||
      data.success !== true
    ) {

      return createUnknownTransitResult(
        "SUBWAY",
        info,
        passengerArrivalSeconds,
        data?.error ||
        "지하철 실시간 정보를 확인하지 못했습니다."
      );

    }


    let arrivals =
      Array.isArray(
        data.arrivals
      )

        ? data.arrivals.slice()

        : [];


    // ----------------------------------------------
    // 0초 / 음수 제거
    // ----------------------------------------------

    arrivals =
      arrivals.filter(

        function(
          arrival
        ) {

          const seconds =
            Number(
              arrival.arrivalSeconds
            );


          return (
            Number.isFinite(
              seconds
            ) &&
            seconds > 0
          );

        }

      );


    // ----------------------------------------------
    // 호선 필터
    // ----------------------------------------------

    const lineName =
      info.name ||
      "";


    const lineId =
      getExpectedSubwayId(
        lineName
      );


    if (
      lineId
    ) {

      const lineFiltered =
        arrivals.filter(

          function(
            arrival
          ) {

            return (
              String(
                arrival.subwayId ||
                ""
              ) ===
              lineId
            );

          }

        );


      if (
        lineFiltered.length > 0
      ) {

        arrivals =
          lineFiltered;

      }

    }


    // ----------------------------------------------
    // 진행방향 확인
    //
    // Kakao의 다음 역과
    // 서울 API의 trainLine을 비교한다.
    // ----------------------------------------------

    const nextStop =
      stationBaseName(
        info.nextStop
      );


    if (
      nextStop
    ) {

      const directionFiltered =
        arrivals.filter(

          function(
            arrival
          ) {

            const trainLine =
              normalizeStationText(
                arrival.trainLine ||
                ""
              );


            const next =
              normalizeStationText(
                nextStop
              );


            return (
              trainLine.includes(
                next
              )
            );

          }

        );


      // 방향을 특정할 수 있는 경우에만 사용.
      // 반대방향 열차를 억지로 사용하지 않는다.

      if (
        directionFiltered.length ===
        0
      ) {

        return createUnknownTransitResult(
          "SUBWAY",
          info,
          passengerArrivalSeconds,
          "진행 방향의 실시간 열차를 확인하지 못했습니다."
        );

      }


      arrivals =
        directionFiltered;

    }


    arrivals.sort(

      function(
        a,
        b
      ) {

        return (
          Number(
            a.arrivalSeconds
          )
          -
          Number(
            b.arrivalSeconds
          )
        );

      }

    );


    return chooseCatchableArrival(
      "SUBWAY",
      info,
      arrivals,
      passengerArrivalSeconds
    );

  }


  catch (
    error
  ) {

    console.error(
      "지하철 실시간 조회 오류:",
      error
    );


    return createUnknownTransitResult(
      "SUBWAY",
      info,
      passengerArrivalSeconds,
      "지하철 실시간 조회에 실패했습니다."
    );

  }

}



// ==================================================
// 버스 step 실시간 조회
// ==================================================

async function getBusStepRealtime(
  step,
  passengerArrivalSeconds
) {

  const info =
    getTransitInfo(
      step
    );


  if (
    !info.boarding ||
    !Array.isArray(
      info.busNumbers
    ) ||
    info.busNumbers.length ===
      0
  ) {

    return createUnknownTransitResult(
      "BUS",
      info,
      passengerArrivalSeconds,
      "버스 정류장 또는 버스 번호를 확인할 수 없습니다."
    );

  }


  try {

    const controller =
      new AbortController();


    const timer =
      setTimeout(

        function() {

          controller.abort();

        },

        REALTIME_TIMEOUT_MS

      );


    const response =
      await fetch(

        "/api/seoul-bus" +

        "?station=" +
        encodeURIComponent(
          info.boarding
        ) +

        "&buses=" +
        encodeURIComponent(
          info.busNumbers.join(
            ","
          )
        ),

        {
          signal:
            controller.signal
        }

      );


    clearTimeout(
      timer
    );


    const data =
      await response.json();


    if (
      !response.ok ||
      data.success !== true
    ) {

      return createUnknownTransitResult(
        "BUS",
        info,
        passengerArrivalSeconds,
        data?.error ||
        data?.message ||
        "버스 실시간 정보를 확인하지 못했습니다."
      );

    }


    let arrivals =
      Array.isArray(
        data.arrivals
      )

        ? data.arrivals.slice()

        : [];


    // 서버 응답 형태가
    // results 안에 들어있는 경우도 지원.

    if (
      arrivals.length === 0 &&
      Array.isArray(
        data.results
      )
    ) {

      data.results.forEach(

        function(
          bus
        ) {

          const busNumber =
            String(
              bus.busNumber ||
              bus.routeName ||
              bus.rtNm ||
              ""
            );


          const candidateValues = [

            bus.arrivalSeconds,

            bus.firstArrivalSeconds,

            bus.secondArrivalSeconds,

            bus.traTime1,

            bus.traTime2

          ];


          candidateValues.forEach(

            function(
              value
            ) {

              const seconds =
                Number(
                  value
                );


              if (
                Number.isFinite(
                  seconds
                ) &&
                seconds > 0
              ) {

                arrivals.push({

                  arrivalSeconds:
                    seconds,

                  busNumber:
                    busNumber

                });

              }

            }

          );

        }

      );

    }


    // ----------------------------------------------
    // Kakao가 제시한 버스 번호만 사용
    // ----------------------------------------------

    const wantedBuses =
      info.busNumbers.map(
        normalizeBusNumber
      );


    arrivals =
      arrivals.filter(

        function(
          arrival
        ) {

          const seconds =
            Number(
              arrival.arrivalSeconds
            );


          if (
            !Number.isFinite(
              seconds
            ) ||
            seconds <= 0
          ) {

            return false;
          }


          const arrivalBus =
            normalizeBusNumber(

              arrival.busNumber ||
              arrival.routeName ||
              arrival.rtNm ||
              ""

            );


          // API가 버스번호를 제공했다면
          // 반드시 Kakao 후보와 일치해야 함.

          if (
            arrivalBus
          ) {

            return wantedBuses.includes(
              arrivalBus
            );

          }


          return true;

        }

      );


    arrivals.sort(

      function(
        a,
        b
      ) {

        return (
          Number(
            a.arrivalSeconds
          )
          -
          Number(
            b.arrivalSeconds
          )
        );

      }

    );


    return chooseCatchableArrival(
      "BUS",
      info,
      arrivals,
      passengerArrivalSeconds
    );

  }


  catch (
    error
  ) {

    console.error(
      "버스 실시간 조회 오류:",
      error
    );


    return createUnknownTransitResult(
      "BUS",
      info,
      passengerArrivalSeconds,
      "버스 실시간 조회에 실패했습니다."
    );

  }

}



// ==================================================
// 탈 수 있는 차량 선택
// ==================================================

function chooseCatchableArrival(
  type,
  info,
  arrivals,
  passengerArrivalSeconds
) {

  if (
    !Array.isArray(
      arrivals
    ) ||
    arrivals.length ===
      0
  ) {

    return {

      known:
        true,


      type:
        type,


      catchable:
        false,


      transitName:
        info.name ||
        "",


      boarding:
        info.boarding ||
        "",


      alighting:
        info.alighting ||
        "",


      passengerArrivalSeconds:
        passengerArrivalSeconds,


      arrivalSeconds:
        null,


      waitSeconds:
        null,


      spareSeconds:
        null,


      reason:
        "현재 확인 가능한 도착 차량이 없습니다."

    };

  }


  // ----------------------------------------------
  // 도착 순서대로 검사
  //
  // 예:
  //
  // 사용자가 환승지에 10분 뒤 도착
  //
  // 차량 7분 뒤  → 이미 지나감
  // 차량 12분 뒤 → 여유 2분 → 실패
  // 차량 13분 뒤 → 정확히 3분 → 실패
  // 차량 15분 뒤 → 여유 5분 → 성공
  // ----------------------------------------------

  for (
    let i = 0;
    i < arrivals.length;
    i++
  ) {

    const arrival =
      arrivals[i];


    const arrivalSeconds =
      Number(
        arrival.arrivalSeconds
      );


    if (
      !Number.isFinite(
        arrivalSeconds
      ) ||
      arrivalSeconds <= 0
    ) {

      continue;
    }


    const spareSeconds =
      arrivalSeconds -
      passengerArrivalSeconds;


    console.log(
      "환승 탑승 가능 판정:",
      {

        type:
          type,

        transit:
          arrival.busNumber ||
          info.name,

        boarding:
          info.boarding,

        passengerArrivalSeconds:
          passengerArrivalSeconds,

        vehicleArrivalSeconds:
          arrivalSeconds,

        spareSeconds:
          spareSeconds,

        passed:
          spareSeconds >
          MIN_SPARE_SECONDS

      }
    );


    // ------------------------------------------
    // 핵심 조건
    //
    // 정확히 180초는 실패.
    // 180초 초과만 성공.
    // ------------------------------------------

    if (
      spareSeconds >
      MIN_SPARE_SECONDS
    ) {

      return {

        known:
          true,


        type:
          type,


        catchable:
          true,


        transitName:

          arrival.busNumber ||

          info.name ||

          "",


        boarding:
          info.boarding ||
          "",


        alighting:
          info.alighting ||
          "",


        passengerArrivalSeconds:
          passengerArrivalSeconds,


        // 지금부터 몇 초 뒤
        // 차량이 오는가

        arrivalSeconds:
          arrivalSeconds,


        // 승차장 도착 후
        // 실제 기다리는 시간

        waitSeconds:
          spareSeconds,


        spareSeconds:
          spareSeconds,


        selectedArrivalIndex:
          i,


        reason:
          "3분 초과 탑승 여유 확인"

      };

    }

  }


  // ----------------------------------------------
  // 현재 API가 알려준 차량은 전부 못 탐
  // ----------------------------------------------

  const last =
    arrivals[
      arrivals.length - 1
    ];


  const lastSeconds =
    Number(
      last?.arrivalSeconds
    );


  return {

    known:
      true,


    type:
      type,


    catchable:
      false,


    transitName:
      info.name ||
      "",


    boarding:
      info.boarding ||
      "",


    alighting:
      info.alighting ||
      "",


    passengerArrivalSeconds:
      passengerArrivalSeconds,


    arrivalSeconds:

      Number.isFinite(
        lastSeconds
      )

        ? lastSeconds

        : null,


    waitSeconds:
      null,


    spareSeconds:

      Number.isFinite(
        lastSeconds
      )

        ? lastSeconds -
          passengerArrivalSeconds

        : null,


    reason:
      "확인된 차량 중 환승지 도착 후 3분 초과 여유가 있는 차량이 없습니다."

  };

}

// ==================================================
// 첫 탑승지까지 도보 계산
// ==================================================

function calculateInitialAccessWalking(
  route,
  firstTransitIndex
) {

  let actualSeconds =
    0;


  let actualDistance =
    0;


  let actualFound =
    false;


  // ----------------------------------------------
  // Kakao가 첫 대중교통 앞에
  // 실제 WALKING step을 제공했는지 확인.
  //
  // analyzeFullRoute에서 이미 이 WALKING 시간을
  // cumulativeSeconds에 더했으므로
  // shouldAdd는 false.
  // ----------------------------------------------

  for (
    let i = 0;
    i < firstTransitIndex;
    i++
  ) {

    const step =
      route.steps[i];


    const type =
      getStepType(
        step
      );


    if (
      type === "WALKING" ||
      type === "WALK"
    ) {

      const properties =
        step.properties ||
        {};


      const seconds =
        Number(
          properties.time ||
          0
        );


      const distance =
        Number(
          properties.distance ||
          0
        );


      if (
        Number.isFinite(
          seconds
        ) &&
        seconds > 0
      ) {

        actualSeconds +=
          seconds;


        actualFound =
          true;

      }


      if (
        Number.isFinite(
          distance
        ) &&
        distance > 0
      ) {

        actualDistance +=
          distance;

      }

    }

  }


  if (
    actualFound
  ) {

    return {

      seconds:
        actualSeconds,


      distance:
        actualDistance > 0

          ? actualDistance

          : null,


      estimated:
        false,


      shouldAdd:
        false

    };

  }


  // ----------------------------------------------
  // 실제 도보 step이 없으면
  // 첫 대중교통 path.points[0] 좌표를 사용해
  // 접근 도보시간을 추정.
  // ----------------------------------------------

  const firstTransitStep =
    route.steps[
      firstTransitIndex
    ];


  const points =
    firstTransitStep
      ?.path
      ?.points;


  if (
    startLat === null ||
    startLng === null ||

    !Array.isArray(
      points
    ) ||

    points.length === 0 ||

    !Array.isArray(
      points[0]
    ) ||

    points[0].length < 2
  ) {

    return {

      seconds:
        null,


      distance:
        null,


      estimated:
        true,


      shouldAdd:
        false

    };

  }


  const boardingLng =
    Number(
      points[0][0]
    );


  const boardingLat =
    Number(
      points[0][1]
    );


  if (
    !Number.isFinite(
      boardingLat
    ) ||
    !Number.isFinite(
      boardingLng
    )
  ) {

    return {

      seconds:
        null,

      distance:
        null,

      estimated:
        true,

      shouldAdd:
        false

    };

  }


  const straightDistance =
    haversineDistance(

      startLat,
      startLng,

      boardingLat,
      boardingLng

    );


  const estimatedDistance =
    straightDistance *
    WALKING_DISTANCE_FACTOR;


  const estimatedSeconds =
    estimatedDistance /
    WALKING_SPEED_MPS;


  return {

    seconds:
      Math.max(
        0,
        Math.round(
          estimatedSeconds
        )
      ),


    distance:
      Math.max(
        0,
        Math.round(
          estimatedDistance
        )
      ),


    estimated:
      true,


    shouldAdd:
      true

  };

}



// ==================================================
// 직선거리 계산
// ==================================================

function haversineDistance(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const earthRadius =
    6371000;


  const toRad =
    Math.PI /
    180;


  const dLat =
    (
      lat2 -
      lat1
    ) *
    toRad;


  const dLng =
    (
      lng2 -
      lng1
    ) *
    toRad;


  const a =

    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(
      lat1 *
      toRad
    )

    *

    Math.cos(
      lat2 *
      toRad
    )

    *

    Math.sin(
      dLng / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(

      Math.sqrt(
        a
      ),

      Math.sqrt(
        1 - a
      )

    );


  return (
    earthRadius *
    c
  );

}



// ==================================================
// 대중교통 step 정보
// ==================================================

function getTransitInfo(
  step
) {

  const empty = {

    type:
      "",

    name:
      "",

    busNumbers:
      [],

    boarding:
      "",

    alighting:
      "",

    nextStop:
      ""

  };


  if (
    !step
  ) {

    return empty;

  }


  const properties =
    step.properties ||
    {};


  const type =
    getStepType(
      step
    );


  const stops =
    Array.isArray(
      properties.stops
    )

      ? properties.stops

      : [];


  const boardingRaw =
    stops.length > 0

      ? getStopName(
          stops[0]
        )

      : "";


  const alightingRaw =
    stops.length > 0

      ? getStopName(
          stops[
            stops.length - 1
          ]
        )

      : "";


  const nextStopRaw =
    stops.length > 1

      ? getStopName(
          stops[1]
        )

      : "";


  let name =
    "";


  let busNumbers =
    [];


  if (
    type === "SUBWAY"
  ) {

    name =
      getSubwayLineName(
        properties.guidance ||
        ""
      );

  }


  if (
    type === "BUS"
  ) {

    busNumbers =
      getBusNumbers(
        properties
      );


    name =
      busNumbers.length > 0

        ? busNumbers.join(
            " · "
          )

        : "버스";

  }


  // 버스 정류장의 "역" 글자는 지우지 않는다.
  //
  // 예:
  // 연신내역.로데오거리
  //
  // 이 이름은 버스 API 정류장 검색에
  // 그대로 필요할 수 있다.

  return {

    type:
      type,


    name:
      name,


    busNumbers:
      busNumbers,


    boarding:

      type === "SUBWAY"

        ? cleanStationName(
            boardingRaw
          )

        : String(
            boardingRaw ||
            ""
          ).trim(),


    alighting:

      type === "SUBWAY"

        ? cleanStationName(
            alightingRaw
          )

        : String(
            alightingRaw ||
            ""
          ).trim(),


    nextStop:

      type === "SUBWAY"

        ? cleanStationName(
            nextStopRaw
          )

        : String(
            nextStopRaw ||
            ""
          ).trim()

  };

}



// ==================================================
// 버스 번호 추출
// ==================================================

function getBusNumbers(
  properties
) {

  const vehicles =
    Array.isArray(
      properties.vehicles
    )

      ? properties.vehicles

      : [];


  const numbers =
    vehicles

      .map(

        function(
          vehicle
        ) {

          return String(
            vehicle.name ||
            ""
          ).trim();

        }

      )

      .filter(
        Boolean
      );


  if (
    numbers.length > 0
  ) {

    return [
      ...new Set(
        numbers
      )
    ];

  }


  // vehicles가 없을 경우
  // guidance 앞부분에서 번호 추출

  const guidance =
    String(
      properties.guidance ||
      ""
    );


  const firstParen =
    guidance.indexOf(
      "("
    );


  const prefix =
    firstParen !== -1

      ? guidance.slice(
          0,
          firstParen
        )

      : guidance;


  const matches =
    prefix.match(
      /\b\d+[A-Za-z가-힣-]*\b/g
    );


  return matches

    ? [
        ...new Set(
          matches
        )
      ]

    : [];

}

// ==================================================
// 정류장 / 역 이름
// ==================================================

function getStopName(
  stop
) {

  if (
    !stop
  ) {

    return "";

  }


  if (
    typeof stop ===
    "string"
  ) {

    return stop.trim();

  }


  return String(
    stop.name ||
    stop.stationName ||
    stop.stNm ||
    ""
  ).trim();

}



// ==================================================
// 지하철 표시용 역 이름
// ==================================================

function cleanStationName(
  value
) {

  return String(
    value ||
    ""
  )
    .trim()
    .replace(
      /역$/,
      ""
    )
    .trim();

}



// ==================================================
// 서울 지하철 API 검색용 역 이름
//
// 새절(신사) → 새절
// ==================================================

function getSubwayApiStationName(
  value
) {

  let text =
    cleanStationName(
      value
    );


  const parenthesis =
    text.indexOf(
      "("
    );


  if (
    parenthesis > 0
  ) {

    text =
      text.slice(
        0,
        parenthesis
      );

  }


  return text.trim();

}



// ==================================================
// 역 이름 기본형
// ==================================================

function stationBaseName(
  value
) {

  return getSubwayApiStationName(
    value
  );

}



// ==================================================
// 역 이름 비교용
// ==================================================

function normalizeStationText(
  value
) {

  return stationBaseName(
    value
  )
    .replace(
      /\s+/g,
      ""
    )
    .replace(
      /역$/g,
      ""
    )
    .toLowerCase();

}



// ==================================================
// 지하철 노선명
// ==================================================

function getSubwayLineName(
  guidance
) {

  const text =
    String(
      guidance ||
      ""
    ).trim();


  if (
    !text
  ) {

    return "지하철";

  }


  const firstParen =
    text.indexOf(
      "("
    );


  if (
    firstParen > 0
  ) {

    return text
      .slice(
        0,
        firstParen
      )
      .trim();

  }


  return text;

}



// ==================================================
// 서울 실시간 지하철 subwayId 예상
// ==================================================

function getExpectedSubwayId(
  lineName
) {

  const text =
    String(
      lineName ||
      ""
    )
      .replace(
        /\s+/g,
        ""
      )
      .toUpperCase();


  const numberMatch =
    text.match(
      /([1-9])호선/
    );


  if (
    numberMatch
  ) {

    return (
      "100" +
      numberMatch[1]
    );

  }


  // 확인된 서울 API 계열 ID

  if (
    text.includes(
      "공항"
    ) ||
    text.includes(
      "AREX"
    )
  ) {

    return "1065";

  }


  if (
    text.includes(
      "경의중앙"
    )
  ) {

    return "1063";

  }


  // GTX-A 등은 API의 노선 ID가
  // 환경/응답에 따라 다를 수 있으므로
  // 억지로 ID를 지정하지 않고
  // 방향정보를 우선 사용한다.

  return "";

}

// ==================================================
// 카드 선택
// ==================================================

function selectRoute(
  index
) {

  if (
    !displayedRoutes[index]
  ) {

    return;
  }


  const selectedCard =
    document.getElementById(
      "route-" +
      index
    );


  const wasOpen =
    selectedCard
      ?.classList
      .contains(
        "open"
      );


  selectedRouteIndex =
    index;


  document
    .querySelectorAll(
      ".routeCard"
    )
    .forEach(

      function(
        card,
        cardIndex
      ) {

        if (
          cardIndex ===
          index
        ) {

          card.classList.add(
            "selected"
          );


          if (
            wasOpen
          ) {

            card.classList.remove(
              "open"
            );

          }

          else {

            card.classList.add(
              "open"
            );

          }

        }

        else {

          card.classList.remove(
            "selected"
          );


          card.classList.remove(
            "open"
          );

        }

      }

    );


  drawRoute(
    displayedRoutes[index]
      .route
  );

}

// 경로 상태

function getRealtimeStatus(
  item
) {

  if (
    item.realtimeState ===
    "passed"
  ) {

    return {

      text:
        "환승 가능 확인",

      className:
        "passed"

    };

  }


  if (
    item.realtimeState ===
    "failed"
  ) {

    return {

      text:
        "환승 여유 부족",

      className:
        "failed"

    };

  }


  if (
    item.realtimeState ===
    "checking"
  ) {

    return {

      text:
        "실시간 계산 중",

      className:
        ""

    };

  }


  return {

    text:
      "일부 실시간 확인 불가",

    className:
      ""

  };

}



// ==================================================
// 카드 실시간 요약
// ==================================================

function buildRealtimeSummary(
  item
) {

  const parts =
    [];


  if (
    item.walkingSeconds !==
    null
  ) {

    const walkingMinutes =
      Math.max(

        1,

        Math.ceil(
          item.walkingSeconds /
          60
        )

      );


    let walkingText =
      "🚶 첫 탑승지까지 " +
      walkingMinutes +
      "분";


    if (
      item.walkingDistance !==
      null
    ) {

      walkingText +=
        " · " +
        formatDistance(
          item.walkingDistance
        );

    }


    if (
      item.walkingEstimated
    ) {

      walkingText +=
        " · 추정 도보";

    }


    parts.push(
      walkingText
    );

  }


  if (
    item.realtimeState ===
    "passed"
  ) {

    if (
      Number.isFinite(
        item.realtimeTotalSeconds
      )
    ) {

      parts.push(

        "⏱ 실시간 대기 포함 예상 " +

        Math.ceil(
          item.realtimeTotalSeconds /
          60
        ) +

        "분"

      );

    }


    parts.push(
      "✅ 모든 확인 가능한 승차·환승에서 3분 초과 여유"
    );

  }


  else if (
    item.realtimeState ===
    "failed"
  ) {

    parts.push(
      "⚠️ " +
      escapeHTML(
        item.reason ||
        "환승 여유가 부족합니다."
      )
    );

  }


  else if (
    item.realtimeState ===
    "checking"
  ) {

    parts.push(
      "🕐 버스·지하철 실시간 도착정보 계산 중"
    );

  }


  else {

    parts.push(
      "ℹ️ " +
      escapeHTML(
        item.reason ||
        "일부 실시간 정보를 확인하지 못했습니다."
      )
    );

  }


  return parts.join(
    "<br>"
  );

}



// ==================================================
// 대중교통 요약
// ==================================================

function buildTransportSummary(
  route
) {

  if (
    !Array.isArray(
      route?.steps
    )
  ) {

    return "";

  }


  const parts =
    [];


  route.steps.forEach(

    function(
      step
    ) {

      const type =
        getStepType(
          step
        );


      const info =
        getTransitInfo(
          step
        );


      if (
        type ===
        "SUBWAY"
      ) {

        parts.push(
          "🚇 " +
          (
            info.name ||
            "지하철"
          )
        );

      }


      if (
        type ===
        "BUS"
      ) {

        parts.push(
          "🚌 " +
          (
            info.name ||
            "버스"
          )
        );

      }

    }

  );


  return parts
    .map(
      escapeHTML
    )
    .join(
      " → "
    );

}



// ==================================================
// 상세 경로
// ==================================================

function buildRouteSteps(
  item
) {

  const route =
    item.route;


  if (
    !Array.isArray(
      route?.steps
    )
  ) {

    return "";
  }


  let html =
    "";


  route.steps.forEach(

    function(
      step,
      index
    ) {

      const type =
        getStepType(
          step
        );


      const properties =
        step.properties ||
        {};


      const seconds =
        Number(
          properties.time ||
          0
        );


      const minutes =
        seconds > 0

          ? Math.max(

              1,

              Math.ceil(
                seconds /
                60
              )

            )

          : null;


      // ============================================
      // 도보
      // ============================================

      if (
        type === "WALKING" ||
        type === "WALK"
      ) {

        const walkingText =
          buildWalkingGuidance(
            route,
            index
          );


        html += `

          <div class="step">

            <div class="stepTitle">

              🚶

              ${escapeHTML(
                walkingText
              )}

            </div>


            <div class="stepMeta">

              ${
                minutes

                  ? minutes +
                    "분"

                  : ""
              }


              ${
                Number(
                  properties.distance ||
                  0
                ) > 0

                  ? " · " +
                    formatDistance(
                      properties.distance
                    )

                  : ""
              }

            </div>

          </div>

        `;


        return;
      }


      // ============================================
      // BUS / SUBWAY
      // ============================================

      if (
        type !== "BUS" &&
        type !== "SUBWAY"
      ) {

        return;
      }


      const info =
        getTransitInfo(
          step
        );


      const realtime =
        item.transitResults
          ?.[index];


      const icon =

        type === "BUS"

          ? "🚌"

          : "🚇";


      let displayName =
        info.name ||
        (
          type === "BUS"

            ? "버스"

            : "지하철"
        );


      if (
        realtime
          ?.transitName
      ) {

        displayName =
          realtime.transitName;

      }


      const arrivalBadge =
        buildArrivalBadge(
          realtime
        );


      const realtimeDetail =
        buildStepRealtimeDetail(
          realtime,
          index,
          item
        );


      html += `

        <div class="step">

          <div class="stepTitle">

            <span>
              ${icon}
            </span>


            <span>
              ${escapeHTML(
                displayName
              )}
            </span>


            ${arrivalBadge}

          </div>


          <div class="stepMeta">

            ${escapeHTML(
              info.boarding ||
              "승차"
            )}

            →

            ${escapeHTML(
              info.alighting ||
              "하차"
            )}


            ${
              minutes

                ? " · " +
                  minutes +
                  "분"

                : ""
            }

          </div>


          ${realtimeDetail}

        </div>

      `;

    }

  );


  return html;

}



// ==================================================
// 차량 옆 도착 표시
// ==================================================

function buildArrivalBadge(
  realtime
) {

  if (
    !realtime
  ) {

    return `
      <span class="arrivalBadge unknown">
        실시간 확인 중
      </span>
    `;

  }


  if (
    realtime.known !==
    true
  ) {

    return `
      <span class="arrivalBadge unknown">
        실시간 정보 없음
      </span>
    `;

  }


  if (
    realtime.catchable !==
    true
  ) {

    return `
      <span class="arrivalBadge failed">
        탑승 어려움
      </span>
    `;

  }


  const arrivalMinutes =
    Math.max(

      1,

      Math.ceil(
        realtime.arrivalSeconds /
        60
      )

    );


  return `

    <span class="arrivalBadge passed">

      ${arrivalMinutes}분 뒤 도착

    </span>

  `;

}



// ==================================================
// 각 BUS / SUBWAY 상세 실시간 문구
// ==================================================

function buildStepRealtimeDetail(
  realtime,
  stepIndex,
  item
) {

  if (
    !realtime
  ) {

    return `
      <div class="stepRealtime">
        실시간 도착정보를 계산하고 있습니다.
      </div>
    `;

  }


  if (
    realtime.known !==
    true
  ) {

    return `

      <div class="stepRealtime">

        실시간 정보 없음

        ${
          realtime.reason

            ? " · " +
              escapeHTML(
                realtime.reason
              )

            : ""
        }

      </div>

    `;

  }


  if (
    realtime.catchable !==
    true
  ) {

    return `

      <div class="stepRealtime">

        ⚠️

        ${escapeHTML(
          realtime.reason ||
          "3분 초과 탑승 여유가 없습니다."
        )}

      </div>

    `;

  }


  const passengerArrivalSeconds =
    Number(
      realtime
        .passengerArrivalSeconds
    );


  const vehicleArrivalSeconds =
    Number(
      realtime
        .arrivalSeconds
    );


  const waitSeconds =
    Number(
      realtime
        .waitSeconds
    );


  const waitMinutes =

    Number.isFinite(
      waitSeconds
    )

      ? Math.max(
          1,
          Math.ceil(
            waitSeconds /
            60
          )
        )

      : null;


  const boardTime =
    Number.isFinite(
      vehicleArrivalSeconds
    )

      ? formatClockFromNow(
          vehicleArrivalSeconds
        )

      : "";


  const isFirstTransit =
    isFirstTransitIndex(
      item.route,
      stepIndex
    );


  let waitLabel =
    "";


  if (
    waitMinutes !==
    null
  ) {

    if (
      isFirstTransit
    ) {

      waitLabel =
        "승차지 도착 후 약 " +
        waitMinutes +
        "분 여유";

    }

    else {

      waitLabel =
        "환승지 도착 후 약 " +
        waitMinutes +
        "분 대기";

    }

  }


  let passengerArrivalText =
    "";


  if (
    Number.isFinite(
      passengerArrivalSeconds
    )
  ) {

    passengerArrivalText =

      isFirstTransit

        ? "승차지 도착 예상 " +
          formatClockFromNow(
            passengerArrivalSeconds
          )

        : "환승지 도착 예상 " +
          formatClockFromNow(
            passengerArrivalSeconds
          );

  }


  return `

    <div class="stepRealtime">

      ${
        passengerArrivalText

          ? escapeHTML(
              passengerArrivalText
            ) +
            "<br>"

          : ""
      }


      ${
        waitLabel

          ? `<span class="waitText">
               ${escapeHTML(
                 waitLabel
               )}
             </span><br>`

          : ""
      }


      ${
        boardTime

          ? "예상 탑승 " +
            escapeHTML(
              boardTime
            )

          : ""
      }

    </div>

  `;

}



// ==================================================
// 첫 대중교통 step인지 확인
// ==================================================

function isFirstTransitIndex(
  route,
  targetIndex
) {

  if (
    !Array.isArray(
      route?.steps
    )
  ) {

    return false;
  }


  for (
    let i = 0;
    i < route.steps.length;
    i++
  ) {

    const type =
      getStepType(
        route.steps[i]
      );


    if (
      type === "BUS" ||
      type === "SUBWAY"
    ) {

      return (
        i ===
        targetIndex
      );

    }

  }


  return false;

}



// ==================================================
// 현재 시각 + N초 → HH:MM
// ==================================================

function formatClockFromNow(
  seconds
) {

  const value =
    Number(
      seconds
    );


  if (
    !Number.isFinite(
      value
    )
  ) {

    return "";
  }


  const date =
    new Date(

      Date.now() +

      value *
      1000

    );


  return date.toLocaleTimeString(

    "ko-KR",

    {
      hour:
        "2-digit",

      minute:
        "2-digit",

      hour12:
        false
    }

  );

}



// ==================================================
// 도보 안내 문구
// ==================================================

function buildWalkingGuidance(
  route,
  stepIndex
) {

  const previous =
    findTransitBefore(
      route,
      stepIndex
    );


  const next =
    findTransitAfter(
      route,
      stepIndex
    );


  if (
    previous &&
    next
  ) {

    const previousInfo =
      getTransitInfo(
        previous
      );


    const nextInfo =
      getTransitInfo(
        next
      );


    if (
      previousInfo.alighting &&
      nextInfo.boarding
    ) {

      if (

        normalizeStationText(
          previousInfo.alighting
        )

        ===

        normalizeStationText(
          nextInfo.boarding
        )

      ) {

        return (
          previousInfo.alighting +
          " 환승 이동"
        );

      }


      return (

        previousInfo.alighting +

        "에서 " +

        nextInfo.boarding +

        "까지 도보 이동"

      );

    }

  }


  if (
    next
  ) {

    const nextInfo =
      getTransitInfo(
        next
      );


    if (
      nextInfo.boarding
    ) {

      return (
        nextInfo.boarding +
        "까지 도보 이동"
      );

    }

  }


  if (
    previous
  ) {

    const previousInfo =
      getTransitInfo(
        previous
      );


    if (
      previousInfo.alighting
    ) {

      return (
        previousInfo.alighting +
        "에서 목적지 방향으로 도보 이동"
      );

    }

  }


  return "도보 이동";

}



// ==================================================
// 이전 대중교통
// ==================================================

function findTransitBefore(
  route,
  index
) {

  if (
    !Array.isArray(
      route?.steps
    )
  ) {

    return null;
  }


  for (
    let i = index - 1;
    i >= 0;
    i--
  ) {

    const type =
      getStepType(
        route.steps[i]
      );


    if (
      type === "BUS" ||
      type === "SUBWAY"
    ) {

      return route.steps[i];

    }

  }


  return null;

}



// ==================================================
// 다음 대중교통
// ==================================================

function findTransitAfter(
  route,
  index
) {

  if (
    !Array.isArray(
      route?.steps
    )
  ) {

    return null;
  }


  for (
    let i = index + 1;
    i < route.steps.length;
    i++
  ) {

    const type =
      getStepType(
        route.steps[i]
      );


    if (
      type === "BUS" ||
      type === "SUBWAY"
    ) {

      return route.steps[i];

    }

  }


  return null;

}



// ==================================================
// 거리 표시
// ==================================================

function formatDistance(
  meters
) {

  const value =
    Number(
      meters
    );


  if (
    !Number.isFinite(
      value
    )
  ) {

    return "-";

  }


  if (
    value >= 1000
  ) {

    return (
      (
        value /
        1000
      ).toFixed(
        1
      ) +
      "km"
    );

  }


  return (
    Math.round(
      value
    ) +
    "m"
  );

}



// ==================================================
// 초 표시
// ==================================================

function formatSeconds(
  seconds
) {

  const value =
    Number(
      seconds
    );


  if (
    !Number.isFinite(
      value
    )
  ) {

    return "-";
  }


  if (
    value < 60
  ) {

    return (
      Math.round(
        value
      ) +
      "초"
    );

  }


  const minutes =
    Math.floor(
      value /
      60
    );


  const remain =
    Math.round(
      value %
      60
    );


  if (
    remain === 0
  ) {

    return (
      minutes +
      "분"
    );

  }


  return (
    minutes +
    "분 " +
    remain +
    "초"
  );

}



// ==================================================
// HTML escape
// ==================================================

function escapeHTML(
  value
) {

  return String(
    value ??
    ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



// ==================================================
// 기존 경로선 삭제
// ==================================================

function clearRouteLines() {

  routePolylines.forEach(

    function(
      line
    ) {

      line.setMap(
        null
      );

    }

  );


  routePolylines =
    [];

}



// ==================================================
// 지도에 경로 표시
// ==================================================

function drawRoute(
  route
) {

  if (
    !initializeMap()
  ) {

    return;
  }


  clearRouteLines();


  if (
    !route ||
    !Array.isArray(
      route.steps
    )
  ) {

    return;
  }


  const bounds =
    new kakao.maps.LatLngBounds();


  let hasPoint =
    false;


  route.steps.forEach(

    function(
      step
    ) {

      const type =
        getStepType(
          step
        );


      const points =
        step
          ?.path
          ?.points;


      if (
        !Array.isArray(
          points
        ) ||
        points.length <
          2
      ) {

        return;
      }


      const path =
        [];


      points.forEach(

        function(
          point
        ) {

          if (
            !Array.isArray(
              point
            ) ||
            point.length < 2
          ) {

            return;
          }


          const lng =
            Number(
              point[0]
            );


          const lat =
            Number(
              point[1]
            );


          if (
            !Number.isFinite(
              lat
            ) ||
            !Number.isFinite(
              lng
            )
          ) {

            return;
          }


          const latLng =
            new kakao.maps.LatLng(
              lat,
              lng
            );


          path.push(
            latLng
          );


          bounds.extend(
            latLng
          );


          hasPoint =
            true;

        }

      );


      if (
        path.length < 2
      ) {

        return;
      }


      let strokeColor =
        "#4F6962";


      let strokeWeight =
        5;


      let strokeOpacity =
        0.9;


      let strokeStyle =
        "solid";


      if (
        type === "SUBWAY"
      ) {

        strokeColor =
          "#263D38";


        strokeWeight =
          6;

      }


      else if (
        type === "BUS"
      ) {

        strokeColor =
          "#4B8281";


        strokeWeight =
          5;

      }


      else if (
        type === "WALKING" ||
        type === "WALK"
      ) {

        strokeColor =
          "#8BA58A";


        strokeWeight =
          4;


        strokeStyle =
          "shortdash";

      }


      const polyline =
        new kakao.maps.Polyline({

          map:
            map,


          path:
            path,


          strokeWeight:
            strokeWeight,


          strokeColor:
            strokeColor,


          strokeOpacity:
            strokeOpacity,


          strokeStyle:
            strokeStyle

        });


      routePolylines.push(
        polyline
      );

    }

  );


  // 현재 위치도 bounds에 포함

  if (
    startLat !== null &&
    startLng !== null
  ) {

    const startPoint =
      new kakao.maps.LatLng(
        startLat,
        startLng
      );


    bounds.extend(
      startPoint
    );


    hasPoint =
      true;

  }


  // 도착지도 bounds에 포함

  if (
    endLat !== null &&
    endLng !== null
  ) {

    const endPoint =
      new kakao.maps.LatLng(
        endLat,
        endLng
      );


    bounds.extend(
      endPoint
    );


    hasPoint =
      true;

  }


  if (
    hasPoint
  ) {

    map.setBounds(
      bounds
    );

  }

}



// ==================================================
// 페이지 시작
// ==================================================

window.addEventListener(

  "load",

  function() {

    if (
      initializeMap()
    ) {

      setMessage(
        "현재 위치를 찾은 뒤 도착지를 입력해주세요."
      );

    }

  }

);

</script>
