<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>빠른길</title>
<style>
:root{--mint:#98C0AB;--mint2:#7FA18E;--teal:#4B8281;--cream:#E0E1D2;--cream2:#D0D4BC;--g1:#A4BCA5;--g2:#8BA58A;--g3:#778D78;--deep:#263D38;--bg:#F4F6F2;--line:#E2E7E1;--gray:#6D7873;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--deep);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;padding-bottom:50px}header{padding:28px 20px 24px;background:var(--deep);color:#fff}.small{color:var(--mint);font-size:12px;font-weight:900;letter-spacing:1px}h1{margin:5px 0 0;font-size:30px}.sub{margin-top:8px;color:var(--cream);font-size:13px;line-height:1.6}.panel,.routeCard,.mapCard{background:#fff;box-shadow:0 5px 20px rgba(38,61,56,.08)}.panel{margin:15px;padding:17px;border-radius:19px}.row{display:flex;align-items:center;gap:9px;margin-bottom:10px}.letter{width:31px;height:31px;flex:0 0 31px;display:grid;place-items:center;background:var(--cream);border-radius:50%;font-size:12px;font-weight:900}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;outline:0;font-size:15px}input:focus{border-color:var(--teal)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{padding:13px 8px;border:0;border-radius:11px;cursor:pointer;font-weight:850}#locationButton{background:var(--cream)}#destinationButton{background:var(--mint)}#routeButton{width:100%;margin-top:9px;background:var(--deep);color:#fff}#message{margin:0 15px 15px;padding:12px;background:var(--cream);border-radius:11px;text-align:center;font-size:13px;line-height:1.5}.mapSection{margin:0 15px 20px}.sectionTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.sectionTitle{font-size:18px;font-weight:850}.sectionHint{font-size:11px;color:var(--gray)}.mapCard{padding:5px;border-radius:17px;overflow:hidden}#map{height:330px;border-radius:13px;background:#e9ede8}#routeResults{padding:0 15px}.resultsTitle{font-size:20px;font-weight:900}.resultsSub{margin:5px 0 12px;color:var(--gray);font-size:12px;line-height:1.5}.routeCard{margin-bottom:13px;padding:17px;border:2px solid transparent;border-radius:18px;cursor:pointer}.routeCard.selected{border-color:var(--teal)}.routeTop{display:flex;justify-content:space-between;gap:10px}.rank{color:var(--teal);font-size:11px;font-weight:900}.time{font-size:29px;font-weight:900}.timeLabel,.stepMeta{color:var(--gray);font-size:11px}.badge,.chip{background:#f4f6f3;border-radius:20px;font-size:11px;font-weight:850}.badge{padding:7px 9px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{padding:7px 8px}.summary{margin-top:12px;font-size:13px;font-weight:750}.detailButton{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;font-weight:850}.details{display:none;margin-top:14px}.routeCard.open .details{display:block}.step,.transferWalk,.sameStop,.finalWalk{margin-bottom:10px;padding:13px;border-radius:12px;font-size:13px;line-height:1.6}.step{background:#f7f8f5}.walk{background:#f2f6f1}.sameStop{background:var(--mint);font-weight:900}.sameStop small{display:block;font-weight:650}.transferWalk{background:#f2f6f1}.candidateArea{margin:8px 0 12px;padding-top:10px;border-top:1px solid var(--line)}.candidateTitle{font-size:11px;font-weight:900;margin-bottom:7px}.candidate{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:6px;padding:9px 10px;border-radius:9px}.candidate.slow{background:#eceeea;color:#626b67}.candidate.good{background:#e2eee7;color:#42665a}.candidate.prepare{background:#f0efd9;color:#716b39}.candidate.warning{background:#fff0d7;color:#8a5b13}.candidate.danger{background:#f5dfdb;color:#82463e}.candidateArrival,.candidateState{font-size:12px;font-weight:900}.candidateCalc{margin-top:2px;font-size:10px;opacity:.82}.selectedCandidate{outline:2px solid var(--teal)}.selectedLabel{color:var(--teal);font-size:10px;margin-left:5px}.finalWalk{background:var(--cream)}.finish{margin-top:6px;font-weight:900}@media(max-width:480px){#map{height:300px}.panel,.mapSection{margin-left:12px;margin-right:12px}#routeResults{padding:0 12px}}
</style>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=16010f0659e99afc9e0d760620666d16&libraries=services"></script>
</head>
<body><div class="app">
<header><div class="small">FAST ROUTE</div><h1>빠른길</h1><div class="sub">실시간 대중교통 · 환승 · 도보까지 한 번에 계산합니다.</div></header>
<section class="panel">
<div class="row"><div class="letter">A</div><input id="start" placeholder="현재 위치" readonly></div>
<div class="row"><div class="letter">B</div><input id="end" placeholder="도착지를 입력하세요"></div>
<div class="buttons"><button id="locationButton" onclick="findMyLocation()">📍 현재 위치</button><button id="destinationButton" onclick="searchDestination()">🔍 도착지 찾기</button></div>
<button id="routeButton" onclick="findRoute()">🚍 빠른 대중교통 찾기</button>
</section>
<div id="message">지도를 준비하고 있습니다...</div>
<section class="mapSection"><div class="sectionTop"><div class="sectionTitle">지도</div><div class="sectionHint">경로 카드를 누르면 표시됩니다</div></div><div class="mapCard"><div id="map"></div></div></section>
<section id="routeResults"></section>
</div>
<script>
const WALKING_SPEED_MPS=0.9;
const WALKING_DISTANCE_FACTOR=1.25;
const REALTIME_TIMEOUT_MS=6000;
const TIGHT_SECONDS=180, PREPARE_SECONDS=360, GOOD_SECONDS=720;
let map=null,places=null,startLat=null,startLng=null,endLat=null,endLng=null,myMarker=null,destinationMarker=null;
let routePolylines=[],displayedRoutes=[],selectedRouteIndex=0,currentSearchId=0,searchStartedAtMs=null,countdownTimer=null;
function setMessage(t){const e=document.getElementById('message');if(e)e.textContent=t}
function initializeMap(){if(!window.kakao?.maps?.services){setMessage('카카오 지도를 불러오지 못했습니다.');return false}if(!map)map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.5665,126.978),level:7});if(!places)places=new kakao.maps.services.Places();return true}
function findMyLocation(){if(!initializeMap())return;if(!navigator.geolocation){setMessage('현재 위치 기능을 사용할 수 없습니다.');return}setMessage('현재 위치를 확인하고 있습니다...');navigator.geolocation.getCurrentPosition(p=>{startLat=+p.coords.latitude;startLng=+p.coords.longitude;const pos=new kakao.maps.LatLng(startLat,startLng);if(myMarker)myMarker.setMap(null);myMarker=new kakao.maps.Marker({map,position:pos});map.setCenter(pos);map.setLevel(5);document.getElementById('start').value='현재 위치';setMessage('현재 위치를 찾았습니다.')},e=>{console.error(e);setMessage('현재 위치를 가져오지 못했습니다.')},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
function searchDestination(){if(!initializeMap())return;const q=document.getElementById('end').value.trim();if(!q){setMessage('도착지를 입력해주세요.');return}setMessage('도착지를 찾고 있습니다...');places.keywordSearch(q,(data,status)=>{if(status!==kakao.maps.services.Status.OK||!data?.length){setMessage('도착지를 찾지 못했습니다.');return}const p=data[0];endLat=+p.y;endLng=+p.x;const pos=new kakao.maps.LatLng(endLat,endLng);if(destinationMarker)destinationMarker.setMap(null);destinationMarker=new kakao.maps.Marker({map,position:pos});document.getElementById('end').value=p.place_name||q;map.setCenter(pos);setMessage('도착지를 선택했습니다.')})}
document.getElementById('end').addEventListener('keydown',e=>{if(e.key==='Enter')searchDestination()});
function createRouteState(route){return{route,state:'checking',realtimeTotalSeconds:null,firstWalk:null,finalWalk:null,transitResults:{},transferResults:[],reason:''}}
async function findRoute(){if(!initializeMap())return;if(startLat===null){setMessage('먼저 현재 위치를 찾아주세요.');return}if(endLat===null){setMessage('먼저 도착지를 찾아주세요.');return}searchStartedAtMs=Date.now();const id=++currentSearchId;if(countdownTimer)clearInterval(countdownTimer);setMessage('대중교통 경로를 찾고 있습니다...');try{const r=await fetch(`/api/kakao?startX=${encodeURIComponent(startLng)}&startY=${encodeURIComponent(startLat)}&endX=${encodeURIComponent(endLng)}&endY=${encodeURIComponent(endLat)}`);const data=await r.json();if(id!==currentSearchId)return;if(!r.ok)throw new Error(data?.error||'경로 요청 실패');const routes=Array.isArray(data.routes)?data.routes:[];if(!routes.length){displayedRoutes=[];renderRoutes();setMessage('대중교통 경로가 없습니다.');return}const sorted=routes.slice().sort((a,b)=>(+a?.properties?.totalTime||999999)-(+b?.properties?.totalTime||999999));displayedRoutes=sorted.slice(0,3).map(createRouteState);renderRoutes();drawRoute(displayedRoutes[0].route);setMessage('실시간 차량과 환승 시간을 계산하고 있습니다...');const analyzed=await Promise.all(sorted.slice(0,8).map(analyzeRoute));if(id!==currentSearchId)return;displayedRoutes=analyzed.sort(compareRoutes).slice(0,3);selectedRouteIndex=0;renderRoutes();if(displayedRoutes[0])drawRoute(displayedRoutes[0].route);startCountdown();setMessage('실시간 환승 계산이 완료되었습니다.')}catch(e){console.error(e);setMessage('경로를 가져오지 못했습니다.')}}
function compareRoutes(a,b){const ta=Number.isFinite(a.realtimeTotalSeconds)?a.realtimeTotalSeconds:(+a.route?.properties?.totalTime||999999);const tb=Number.isFinite(b.realtimeTotalSeconds)?b.realtimeTotalSeconds:(+b.route?.properties?.totalTime||999999);return ta-tb}
function getTransferState(s){if(!Number.isFinite(s))return{key:'slow',label:'정보없음',icon:'⚪'};if(s<=0)return{key:'danger',label:'매우촉박',icon:'🔴'};if(s<=TIGHT_SECONDS)return{key:'warning',label:'촉박',icon:'🟠'};if(s<=PREPARE_SECONDS)return{key:'prepare',label:'준비',icon:'🟡'};if(s<=GOOD_SECONDS)return{key:'good',label:'여유있음',icon:'🟢'};return{key:'slow',label:'느림',icon:'⚪'}}
function normalizePlace(v){return String(v||'').toLowerCase().replace(/\([^)]*\)/g,'').replace(/정류장/g,'').replace(/[\s.,·\-_/]/g,'').trim()}
function isSameTransferPlace(a,b){a=normalizePlace(a);b=normalizePlace(b);if(!a||!b)return false;if(a===b)return true;return a.length>=4&&b.length>=4&&(a.includes(b)||b.includes(a))}
function getStepType(s){return String(s?.properties?.type||s?.type||'').trim().toUpperCase()}
function getStopName(s){if(!s)return'';return typeof s==='string'?s.trim():String(s.name||s.stationName||s.stNm||'').trim()}
function parseGuidanceStops(g){const t=String(g||'');const a=t.indexOf('('),b=t.lastIndexOf(')');if(a<0||b<=a)return{boarding:'',alighting:''};const inside=t.slice(a+1,b),x=inside.indexOf('>');if(x<0)return{boarding:'',alighting:''};return{boarding:inside.slice(0,x).trim(),alighting:inside.slice(x+1).trim()}}
function getGuidancePrefix(g){const t=String(g||'').trim(),i=t.indexOf('(');return i>0?t.slice(0,i).trim():t}
function cleanStationName(v){return String(v||'').trim().replace(/역$/,'').trim()}
function getBusNumbers(p){return[...new Set((Array.isArray(p?.vehicles)?p.vehicles:[]).map(v=>String(v?.name||'').trim()).filter(Boolean))]}
function getTransitInfo(step){const p=step?.properties||{},type=getStepType(step),stops=Array.isArray(p.stops)?p.stops:[];let boarding=stops.length?getStopName(stops[0]):'',alighting=stops.length?getStopName(stops[stops.length-1]):'',nextStop=stops.length>1?getStopName(stops[1]):'';if(!boarding||!alighting){const x=parseGuidanceStops(p.guidance);boarding=boarding||x.boarding;alighting=alighting||x.alighting}if(type==='BUS'){const nums=getBusNumbers(p);return{type,name:nums.join(' · ')||getGuidancePrefix(p.guidance)||'버스',busNumbers:nums,boarding,alighting,nextStop}}if(type==='SUBWAY')return{type,name:getGuidancePrefix(p.guidance)||'지하철',busNumbers:[],boarding:cleanStationName(boarding),alighting:cleanStationName(alighting),nextStop:cleanStationName(nextStop)};return{type,name:'',busNumbers:[],boarding,alighting,nextStop}}
function isValidPoint(p){return Array.isArray(p)&&p.length>=2&&Number.isFinite(+p[0])&&Number.isFinite(+p[1])}
function haversineDistance(a,b,c,d){const R=6371000,r=Math.PI/180,da=(c-a)*r,db=(d-b)*r,x=Math.sin(da/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(db/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function adjustedWalking(step){const d=+step?.properties?.distance||0,t=+step?.properties?.time||0;if(d>0)return{seconds:Math.round(d/WALKING_SPEED_MPS),distance:Math.round(d),estimated:false};if(t>0)return{seconds:Math.round(t*(1.11/WALKING_SPEED_MPS)),distance:null,estimated:true};return null}
function calculateFirstWalk(route,first){let sec=0,dist=0,found=false,estimated=false;for(let i=0;i<first;i++){if(!['WALKING','WALK'].includes(getStepType(route.steps[i])))continue;const w=adjustedWalking(route.steps[i]);if(w){sec+=w.seconds;dist+=w.distance||0;estimated ||= w.estimated;found=true}}if(found)return{seconds:sec,distance:dist||null,estimated,source:'kakao'};const p=route.steps[first]?.path?.points?.[0];if(startLat===null||!isValidPoint(p))return{seconds:null,distance:null,estimated:true};const d=haversineDistance(startLat,startLng,+p[1],+p[0])*WALKING_DISTANCE_FACTOR;return{seconds:Math.round(d/WALKING_SPEED_MPS),distance:Math.round(d),estimated:true,source:'estimated'}}
function calculateFinalWalk(route,last){let sec=0,dist=0,found=false,estimated=false;for(let i=last+1;i<route.steps.length;i++){if(!['WALKING','WALK'].includes(getStepType(route.steps[i])))continue;const w=adjustedWalking(route.steps[i]);if(w){sec+=w.seconds;dist+=w.distance||0;estimated ||= w.estimated;found=true}}if(found)return{seconds:sec,distance:dist||null,estimated,source:'kakao'};const pts=route.steps[last]?.path?.points,p=Array.isArray(pts)&&pts.length?pts[pts.length-1]:null;if(endLat===null||!isValidPoint(p))return{seconds:null,distance:null,estimated:true};const d=haversineDistance(+p[1],+p[0],endLat,endLng)*WALKING_DISTANCE_FACTOR;if(d<20)return{seconds:0,distance:Math.round(d),estimated:true};return{seconds:Math.round(d/WALKING_SPEED_MPS),distance:Math.round(d),estimated:true,source:'estimated'}}
function calculateTransferWalk(route,prev,next,prevInfo,nextInfo){if(isSameTransferPlace(prevInfo.alighting,nextInfo.boarding))return{samePlace:true,seconds:0,distance:0,estimated:false,label:'📍 현재위치환승!'};let sec=0,dist=0,found=false,estimated=false;for(let i=prev+1;i<next;i++){if(!['WALKING','WALK'].includes(getStepType(route.steps[i])))continue;const w=adjustedWalking(route.steps[i]);if(w){sec+=w.seconds;dist+=w.distance||0;estimated ||= w.estimated;found=true}}if(found)return{samePlace:false,seconds:sec,distance:dist||null,estimated,label:'🚶 환승 도보'};const a=route.steps[prev]?.path?.points,b=route.steps[next]?.path?.points,p=a?.[a.length-1],q=b?.[0];if(!isValidPoint(p)||!isValidPoint(q))return{samePlace:false,seconds:null,distance:null,estimated:true,label:'🚶 환승 도보'};const d=haversineDistance(+p[1],+p[0],+q[1],+q[0])*WALKING_DISTANCE_FACTOR;return{samePlace:false,seconds:Math.round(d/WALKING_SPEED_MPS),distance:Math.round(d),estimated:true,label:'🚶 환승 도보'}}
function calculateCandidate(arrivalEpoch,now,transitRemaining,walk){const vehicle=Math.max(0,(arrivalEpoch-now)/1000),required=Math.max(0,+transitRemaining||0)+Math.max(0,+walk||0),spare=vehicle-required;return{vehicleRemainingSeconds:vehicle,currentTransitRemainingSeconds:Math.max(0,+transitRemaining||0),walkingSeconds:Math.max(0,+walk||0),requiredSeconds:required,spareSeconds:spare,state:getTransferState(spare)}}
function chooseCandidate(cands){return cands.filter(c=>c?.calculation&&Number.isFinite(c.arrivalEpochMs)&&c.calculation.spareSeconds>0).sort((a,b)=>a.arrivalEpochMs-b.arrivalEpochMs)[0]||null}
// 첫 번째 탑승만: 정류장/역 도착 후 최소 3분 여유가 있는 차량 선택
function chooseFirstBoardingCandidate(cands){return cands.filter(c=>c?.calculation&&Number.isFinite(c.arrivalEpochMs)&&c.calculation.spareSeconds>=180).sort((a,b)=>a.arrivalEpochMs-b.arrivalEpochMs)[0]||null}
async function fetchWithTimeout(url,ms){const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{signal:c.signal})}finally{clearTimeout(id)}}
function normalizeBusNumber(v){return String(v||'').replace(/\s+/g,'').toUpperCase()}
async function getBusCandidates(step){const info=getTransitInfo(step),out={type:'BUS',info,available:false,candidates:[],selectedCandidate:null,reason:''};if(!info.boarding||!info.busNumbers.length){out.reason='버스 정보가 부족합니다.';return out}try{const r=await fetchWithTimeout(`/api/seoul-bus?station=${encodeURIComponent(info.boarding)}&buses=${encodeURIComponent(info.busNumbers.join(','))}`,REALTIME_TIMEOUT_MS),received=Date.now(),data=await r.json();if(!r.ok||data.success!==true){out.reason=data?.error||data?.message||'버스 실시간 정보 없음';return out}let arr=Array.isArray(data.arrivals)?data.arrivals.slice():[];if(!arr.length&&Array.isArray(data.results)){data.results.forEach(x=>{const n=x.busNumber||x.routeName||x.rtNm||'';for(const [s,m] of [[x.firstArrivalSeconds??x.traTime1??x.arrivalSeconds,x.arrmsg1],[x.secondArrivalSeconds??x.traTime2,x.arrmsg2]])if(Number.isFinite(+s)&&+s>0)arr.push({busNumber:n,arrivalSeconds:+s,arrivalMessage:m||''})})}const wanted=info.busNumbers.map(normalizeBusNumber);out.candidates=arr.filter(x=>Number.isFinite(+x.arrivalSeconds)&&+x.arrivalSeconds>0&&(!normalizeBusNumber(x.busNumber||x.routeName||x.rtNm)||wanted.includes(normalizeBusNumber(x.busNumber||x.routeName||x.rtNm)))).map((x,i)=>({id:`bus-${received}-${i}`,type:'BUS',busNumber:String(x.busNumber||x.routeName||x.rtNm||info.busNumbers[0]||'버스'),arrivalEpochMs:received+(+x.arrivalSeconds*1000),arrivalMessage:x.arrivalMessage||'',selected:false,calculation:null})).sort((a,b)=>a.arrivalEpochMs-b.arrivalEpochMs);out.available=!!out.candidates.length;return out}catch(e){console.error(e);out.reason='버스 실시간 조회 실패';return out}}
function getSubwayApiStationName(v){let t=cleanStationName(v),i=t.indexOf('(');return(i>0?t.slice(0,i):t).trim()}
function normalizeStationText(v){return getSubwayApiStationName(v).replace(/\s+/g,'').toLowerCase()}
function getExpectedSubwayId(name){const t=String(name||'').replace(/\s+/g,'').toUpperCase(),m=t.match(/([1-9])호선/);if(m)return`100${m[1]}`;if(t.includes('경의중앙'))return'1063';if(t.includes('공항')||t.includes('AREX'))return'1065';return''}
async function getSubwayCandidates(step){const info=getTransitInfo(step),out={type:'SUBWAY',info,available:false,candidates:[],selectedCandidate:null,reason:''},station=getSubwayApiStationName(info.boarding);if(!station){out.reason='승차역 정보 없음';return out}try{const r=await fetchWithTimeout(`/api/seoul-subway?station=${encodeURIComponent(station)}`,REALTIME_TIMEOUT_MS),received=Date.now(),data=await r.json();if(!r.ok||data.success!==true){out.reason=data?.error||data?.message||'지하철 실시간 정보 없음';return out}let arr=(Array.isArray(data.arrivals)?data.arrivals:[]).filter(x=>Number.isFinite(+x.arrivalSeconds)&&+x.arrivalSeconds>0);const id=getExpectedSubwayId(info.name);if(id){const same=arr.filter(x=>String(x.subwayId||'')===id);if(same.length)arr=same}const next=normalizeStationText(info.nextStop);if(next){const dir=arr.filter(x=>normalizeStationText(x.trainLine||x.trainLineNm||x.destination||'').includes(next));if(dir.length)arr=dir;else{out.reason='진행 방향 실시간 열차 없음';return out}}out.candidates=arr.map((x,i)=>({id:`sub-${received}-${i}`,type:'SUBWAY',lineName:info.name,direction:x.trainLine||x.trainLineNm||x.direction||'',arrivalEpochMs:received+(+x.arrivalSeconds*1000),arrivalMessage:x.arrivalMessage||'',selected:false,calculation:null})).sort((a,b)=>a.arrivalEpochMs-b.arrivalEpochMs);out.available=!!out.candidates.length;return out}catch(e){console.error(e);out.reason='지하철 실시간 조회 실패';return out}}
async function analyzeRoute(route){const out=createRouteState(route),steps=Array.isArray(route?.steps)?route.steps:[],transit=[];steps.forEach((s,i)=>{if(['BUS','SUBWAY'].includes(getStepType(s)))transit.push(i)});if(!transit.length){out.state='unknown';return out}out.firstWalk=calculateFirstWalk(route,transit[0]);out.finalWalk=calculateFinalWalk(route,transit[transit.length-1]);const responses=await Promise.all(transit.map(async i=>({i,realtime:getStepType(steps[i])==='BUS'?await getBusCandidates(steps[i]):await getSubwayCandidates(steps[i])})));responses.forEach(x=>out.transitResults[x.i]=x.realtime);const base=searchStartedAtMs||Date.now();let predicted=base+(+out.firstWalk?.seconds||0)*1000,known=true;for(let order=0;order<transit.length;order++){const idx=transit[order],step=steps[idx],rt=out.transitResults[idx],travel=Math.max(0,+step?.properties?.time||0),cands=rt.candidates||[];if(order===0){cands.forEach(c=>c.calculation=calculateCandidate(c.arrivalEpochMs,base,0,out.firstWalk?.seconds||0));const sel=chooseFirstBoardingCandidate(cands);rt.selectedCandidate=sel;if(sel){sel.selected=true;predicted=Math.max(predicted,sel.arrivalEpochMs)}else known=false;rt.boardingEpochMs=predicted;rt.predictedAlightingEpochMs=predicted+travel*1000;predicted=rt.predictedAlightingEpochMs;continue}// 2번째 대중교통부터: 다음 차량 도착시간 > (이전 선택 차량의 실제 도착시간 + 이전 차량 탑승시간 + 환승 도보시간). 후보는 숨기지 않고 전부 표시한다.
const prevIdx=transit[order-1],prevInfo=getTransitInfo(steps[prevIdx]),info=getTransitInfo(step),prevRt=out.transitResults[prevIdx],walk=calculateTransferWalk(route,prevIdx,idx,prevInfo,info),prevRemain=Number.isFinite(prevRt?.predictedAlightingEpochMs)?Math.max(0,(prevRt.predictedAlightingEpochMs-base)/1000):0;cands.forEach(c=>c.calculation=calculateCandidate(c.arrivalEpochMs,base,prevRemain,walk.seconds||0));out.transferResults.push({transferNumber:order,previousStepIndex:prevIdx,nextStepIndex:idx,previousAlighting:prevInfo.alighting,nextBoarding:info.boarding,samePlace:walk.samePlace,walking:walk,candidates:cands});const sel=chooseCandidate(cands);rt.selectedCandidate=sel;const platform=predicted+(+walk.seconds||0)*1000;rt.predictedPlatformEpochMs=platform;if(sel){sel.selected=true;predicted=Math.max(platform,sel.arrivalEpochMs)}else{known=false;predicted=platform}rt.boardingEpochMs=predicted;rt.predictedAlightingEpochMs=predicted+travel*1000;predicted=rt.predictedAlightingEpochMs}predicted+=(+out.finalWalk?.seconds||0)*1000;out.realtimeTotalSeconds=known?Math.max(0,Math.round((predicted-base)/1000)):null;out.state=known?'ready':'partial';return out}
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function formatCountdown(s){s=Math.max(0,Math.round(+s||0));const m=Math.floor(s/60),r=s%60;return m?`${m}분 ${String(r).padStart(2,'0')}초`:`${r}초`}
function formatSignedTime(s){return Number.isFinite(+s)?(+s<0?'-':'+')+formatCountdown(Math.abs(+s)):'-'}
function formatDistance(m){m=+m;if(!Number.isFinite(m))return'';return m<1000?`${Math.round(m)}m`:`${(m/1000).toFixed(1)}km`}
function transportSummary(route){return(route.steps||[]).filter(s=>['BUS','SUBWAY'].includes(getStepType(s))).map(s=>`${getStepType(s)==='BUS'?'🚌':'🚇'} ${escapeHtml(getTransitInfo(s).name)}`).join(' → ')}
function renderRoutes(){const c=document.getElementById('routeResults');if(!displayedRoutes.length){c.innerHTML='<div class="resultsTitle">추천 경로</div><div class="resultsSub">표시할 경로가 없습니다.</div>';return}c.innerHTML='<div class="resultsTitle">추천 경로</div><div class="resultsSub">환승 차량을 숨기지 않고 상태를 모두 표시합니다.</div>'+displayedRoutes.map((r,i)=>routeCard(r,i)).join('');updateCountdownDisplays()}
function routeCard(rs,i){const p=rs.route?.properties||{},seconds=Number.isFinite(rs.realtimeTotalSeconds)?rs.realtimeTotalSeconds:(+p.totalTime||0),mins=Math.max(1,Math.ceil(seconds/60)),selected=i===selectedRouteIndex;return `<article class="routeCard${selected?' selected open':''}" onclick="selectRoute(${i})"><div class="routeTop"><div><div class="rank">추천 ${i+1}</div><div class="time">${mins}분</div><div class="timeLabel">${Number.isFinite(rs.realtimeTotalSeconds)?'실시간 차량 + 환승 + 도보 반영':'Kakao 기본 예상시간'}</div></div><div class="badge">${rs.state==='ready'?'실시간 계산 완료':rs.state==='partial'?'일부 실시간 미확인':'계산 중'}</div></div><div class="chips"><div class="chip">🔄 환승 ${+p.transfers||0}회</div><div class="chip">📏 ${formatDistance(p.totalDistance)}</div>${rs.firstWalk?.seconds!=null?`<div class="chip">🚶 첫 도보 ${Math.max(1,Math.ceil(rs.firstWalk.seconds/60))}분</div>`:''}${rs.finalWalk?.seconds!=null?`<div class="chip">🏠 마지막 도보 ${rs.finalWalk.seconds?Math.max(1,Math.ceil(rs.finalWalk.seconds/60))+'분':'거의 없음'}</div>`:''}</div><div class="summary">${transportSummary(rs.route)}</div><div class="detailButton">${selected?'▲ 상세 경로':'▼ 상세 경로 보기'}</div><div class="details">${fullDetail(rs,i)}</div></article>`}
function walkHtml(w,title,final=false){if(!w||w.seconds==null)return `<div class="${final?'finalWalk':'step walk'}"><strong>${title}</strong><div class="stepMeta">도보시간을 계산하지 못했습니다.</div>${final?'<div class="finish">🏠 목적지</div>':''}</div>`;if(final&&w.seconds<=0)return'<div class="finalWalk"><strong>🏠 목적지 도착</strong><div class="stepMeta">마지막 하차 지점이 목적지와 매우 가깝습니다.</div></div>';return `<div class="${final?'finalWalk':'step walk'}"><strong>${title}</strong><div class="stepMeta">약 ${Math.max(1,Math.ceil(w.seconds/60))}분${w.distance!=null?' · '+formatDistance(w.distance):''}${w.estimated?' · 추정 도보':''}</div>${final?'<div class="finish">🏠 목적지 도착</div>':''}</div>`}
function fullDetail(rs,ri){const steps=rs.route.steps||[],transit=[];steps.forEach((s,i)=>{if(['BUS','SUBWAY'].includes(getStepType(s)))transit.push(i)});let h=walkHtml(rs.firstWalk,'🚶 첫 승차장까지');transit.forEach((idx,o)=>{const s=steps[idx],info=getTransitInfo(s),rt=rs.transitResults[idx],travel=+s?.properties?.time||0,sel=rt?.selectedCandidate;let arrivalText='실시간 도착정보 없음';if(sel&&Number.isFinite(sel.arrivalEpochMs)){const remain=Math.max(0,(sel.arrivalEpochMs-Date.now())/1000);arrivalText=(getStepType(s)==='BUS'?'정류장에 ':'역에 ')+formatCountdown(remain)+' 후 도착'}h+=`<div class="step"><strong>${getStepType(s)==='BUS'?'🚌':'🚇'} ${escapeHtml(info.name)} · <span id="transit-arrival-${ri}-${idx}">${arrivalText}</span></strong><div class="stepMeta">${escapeHtml(info.boarding)} → ${escapeHtml(info.alighting)}${travel?' · 약 '+Math.max(1,Math.ceil(travel/60))+'분':''}</div>${o===0&&sel?`<div class="stepMeta">첫 탑승 3분 여유 조건 충족</div>`:''}</div>`;if(o<transit.length-1)h+=transferHtml(rs.transferResults[o],ri,o)});h+=walkHtml(rs.finalWalk,'🚶 하차 후 목적지까지',true);return h}
function transferHtml(t,ri,ti){if(!t)return'';let h=t.samePlace?`<div class="sameStop">📍 현재위치환승!<small>${escapeHtml(t.previousAlighting)}에서 바로 다음 교통수단으로 환승</small></div>`:`<div class="transferWalk"><strong>🚶 환승 이동</strong><br>${t.walking?.seconds!=null?'약 '+Math.max(1,Math.ceil(t.walking.seconds/60))+'분':'시간 확인 불가'}${t.walking?.distance!=null?' · '+formatDistance(t.walking.distance):''}${t.walking?.estimated?' · 추정':''}<br>${escapeHtml(t.previousAlighting)} → ${escapeHtml(t.nextBoarding)}</div>`;h+=`<div class="candidateArea"><div class="candidateTitle">🔄 ${t.transferNumber}번째 환승 차량<br><span style="font-weight:600;opacity:.75">다음 차량 - (현재 대중교통 남은시간 + 환승 도보)</span></div>`;if(t.candidates?.length)h+=t.candidates.map((c,ci)=>candidateHtml(c,ri,ti,ci)).join('');return h+'</div>'}
function candidateHtml(c,ri,ti,ci){const x=c.calculation,s=x?.state||getTransferState(NaN),name=c.busNumber||c.lineName||(c.type==='BUS'?'버스':'열차');return `<div class="candidate ${s.key}${c.selected?' selectedCandidate':''}" id="candidate-${ri}-${ti}-${ci}"><div><div class="candidateArrival">${c.type==='BUS'?'🚌':'🚇'} ${escapeHtml(name)} · <span id="candidate-time-${ri}-${ti}-${ci}">${x?formatCountdown(x.vehicleRemainingSeconds)+' 뒤':'시간 확인 중'}</span>${c.selected?'<span class="selectedLabel">예상 탑승</span>':''}</div><div class="candidateCalc" id="candidate-calc-${ri}-${ti}-${ci}">${x?`현재 교통 ${formatCountdown(x.currentTransitRemainingSeconds)} + 환승 도보 ${formatCountdown(x.walkingSeconds)} → 여유 ${formatSignedTime(x.spareSeconds)}`:''}</div></div><div class="candidateState" id="candidate-state-${ri}-${ti}-${ci}">${s.icon} ${s.label}</div></div>`}
function startCountdown(){if(countdownTimer)clearInterval(countdownTimer);updateCountdownDisplays();countdownTimer=setInterval(updateCountdownDisplays,1000)}
function updateCountdownDisplays(){const now=Date.now();displayedRoutes.forEach((rs,ri)=>{Object.keys(rs.transitResults||{}).forEach(idx=>{const rt=rs.transitResults[idx],sel=rt?.selectedCandidate,e=document.getElementById(`transit-arrival-${ri}-${idx}`);if(e){if(sel&&Number.isFinite(sel.arrivalEpochMs)){const step=rs.route?.steps?.[idx],placeWord=getStepType(step)==='BUS'?'정류장에 ':'역에 ';e.textContent=sel.arrivalEpochMs>now?placeWord+formatCountdown((sel.arrivalEpochMs-now)/1000)+' 후 도착':'도착 예정시각 지남'}else e.textContent='실시간 도착정보 없음'}});(rs.transferResults||[]).forEach((t,ti)=>{const prev=rs.transitResults[t.previousStepIndex],remain=Number.isFinite(prev?.predictedAlightingEpochMs)?Math.max(0,(prev.predictedAlightingEpochMs-now)/1000):0,walk=t.samePlace?0:(+t.walking?.seconds||0);(t.candidates||[]).forEach((c,ci)=>{if(!Number.isFinite(c.arrivalEpochMs))return;const x=calculateCandidate(c.arrivalEpochMs,now,remain,walk);c.calculation=x;const row=document.getElementById(`candidate-${ri}-${ti}-${ci}`),tm=document.getElementById(`candidate-time-${ri}-${ti}-${ci}`),ca=document.getElementById(`candidate-calc-${ri}-${ti}-${ci}`),st=document.getElementById(`candidate-state-${ri}-${ti}-${ci}`);if(row)row.className=`candidate ${x.state.key}${c.selected?' selectedCandidate':''}`;if(tm)tm.textContent=x.vehicleRemainingSeconds>0?formatCountdown(x.vehicleRemainingSeconds)+' 뒤':'도착 예정시각 지남';if(ca)ca.textContent=`현재 교통 ${formatCountdown(x.currentTransitRemainingSeconds)} + 환승 도보 ${formatCountdown(x.walkingSeconds)} → 여유 ${formatSignedTime(x.spareSeconds)}`;if(st)st.textContent=`${x.state.icon} ${x.state.label}`})})})}
function selectRoute(i){if(!displayedRoutes[i])return;if(selectedRouteIndex===i){selectedRouteIndex=-1;clearRoutePolylines();renderRoutes();return}selectedRouteIndex=i;renderRoutes();drawRoute(displayedRoutes[i].route)}
function clearRoutePolylines(){routePolylines.forEach(p=>p.setMap(null));routePolylines=[]}
function drawRoute(route){if(!initializeMap())return;clearRoutePolylines();const steps=route?.steps||[],bounds=new kakao.maps.LatLngBounds();let has=false;steps.forEach(s=>{const pts=s?.path?.points;if(!Array.isArray(pts)||pts.length<2)return;const path=pts.filter(isValidPoint).map(p=>{const ll=new kakao.maps.LatLng(+p[1],+p[0]);bounds.extend(ll);has=true;return ll});if(path.length<2)return;const type=getStepType(s),walk=['WALKING','WALK'].includes(type);routePolylines.push(new kakao.maps.Polyline({map,path,strokeWeight:walk?4:6,strokeColor:type==='SUBWAY'?'#263D38':walk?'#778D78':'#4B8281',strokeOpacity:walk?.7:.9,strokeStyle:walk?'shortdash':'solid'}))});const transit=steps.filter(s=>['BUS','SUBWAY'].includes(getStepType(s))),first=transit[0]?.path?.points?.[0],lastPts=transit[transit.length-1]?.path?.points,last=lastPts?.[lastPts.length-1];function dashed(a,b){routePolylines.push(new kakao.maps.Polyline({map,path:[a,b],strokeWeight:3,strokeColor:'#778D78',strokeOpacity:.65,strokeStyle:'shortdash'}));bounds.extend(a);bounds.extend(b);has=true}if(startLat!==null&&isValidPoint(first))dashed(new kakao.maps.LatLng(startLat,startLng),new kakao.maps.LatLng(+first[1],+first[0]));if(endLat!==null&&isValidPoint(last))dashed(new kakao.maps.LatLng(+last[1],+last[0]),new kakao.maps.LatLng(endLat,endLng));if(has)map.setBounds(bounds)}
window.addEventListener('load',()=>{if(initializeMap())setMessage('현재 위치를 찾은 뒤 도착지를 검색해주세요.')});
</script></body></html>
