<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>빠른길</title>

  <!-- 카카오 지도 API -->
  <!-- YOUR_JAVASCRIPT_KEY를 네 JavaScript 키로 바꾸기 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=16010f0659e99afc9e0d760620666d16&libraries=services"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      background: #FEE500;
      margin: 0;
      padding: 15px;
    }

    .box {
      padding: 15px;
      background: white;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 7px;
    }

    #locationButton {
      background: #dddddd;
    }

    #routeButton {
      background: #FEE500;
    }

    #trafficButton {
      background: #333333;
      color: white;
    }

    #message {
      text-align: center;
      padding: 12px;
      background: white;
    }

    #routeResults {
      padding: 15px;
    }

    .routeCard {
      background: white;
      border: 2px solid #FEE500;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .routeCard h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .routeCard h3 {
      font-size: 26px;
      margin: 10px 0;
    }

    .routeCard p {
      margin: 8px 0;
    }

    .steps {
      margin-top: 12px;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 8px;
      line-height: 1.8;
    }

    #map {
      width: 100%;
      height: 500px;
    }

  </style>

</head>


<body>

  <h1>🚶 빠른길</h1>

  <div class="box">

    <!-- 출발지 -->
    <input
      id="start"
      type="text"
      placeholder="출발지를 입력하세요"
    >

    <!-- 도착지 -->
    <input
      id="end"
      type="text"
      placeholder="도착지를 입력하세요"
    >

    <!-- 현재 위치 -->
    <button
      id="locationButton"
      onclick="findMyLocation()"
    >
      📍 내 현재 위치 찾기
    </button>

    <!-- 도착지 찾기 -->
    <button
      id="routeButton"
      onclick="searchDestination()"
    >
      🔍 도착지 찾기
    </button>

    <!-- 대중교통 경로 찾기 -->
    <button
      id="trafficButton"
      onclick="findRoute()"
    >
      🚍 대중교통 빠른 길 찾기
    </button>

  </div>


  <!-- 안내 메시지 -->
  <div id="message">
    내 위치 버튼을 눌러보세요.
  </div>


  <!-- 경로 결과 -->
  <div id="routeResults"></div>


  <!-- 지도 -->
  <div id="map"></div>



  <script>

    // ========================================
    // 지도 만들기
    // ========================================

    const fastRouteMapContainer =
      document.getElementById("map");

    const fastRouteMapOption = {

      center:
        new kakao.maps.LatLng(
          37.5665,
          126.9780
        ),

      level: 4

    };

    const fastRouteMap =
      new kakao.maps.Map(
        fastRouteMapContainer,
        fastRouteMapOption
      );


    // ========================================
    // 좌표 저장
    // 이름 충돌 방지를 위해 이름 변경
    // ========================================

    let appStartLat = null;
    let appStartLng = null;

    let appEndLat = null;
    let appEndLng = null;


    // ========================================
    // 마커 저장
    // ========================================

    let appMyMarker = null;
    let appDestinationMarker = null;


    // ========================================
    // 현재 위치 찾기
    // ========================================

    function findMyLocation() {

      const messageBox =
        document.getElementById("message");

      messageBox.innerText =
        "📡 현재 위치를 찾고 있습니다...";


      if (!navigator.geolocation) {

        messageBox.innerText =
          "❌ 위치 기능을 사용할 수 없습니다.";

        return;
      }


      navigator.geolocation.getCurrentPosition(

        // 위치 찾기 성공
        function(position) {

          const currentLat =
            position.coords.latitude;

          const currentLng =
            position.coords.longitude;


          console.log(
            "현재 위치:",
            currentLat,
            currentLng
          );


          // 출발지 좌표 저장
          appStartLat = currentLat;
          appStartLng = currentLng;


          const currentPosition =
            new kakao.maps.LatLng(
              currentLat,
              currentLng
            );


          // 지도 이동
          fastRouteMap.setCenter(
            currentPosition
          );

          fastRouteMap.setLevel(3);


          // 기존 현재 위치 마커 삭제
          if (appMyMarker !== null) {

            appMyMarker.setMap(null);

          }


          // 현재 위치 마커 생성
          appMyMarker =
            new kakao.maps.Marker({

              position:
                currentPosition

            });


          // 지도에 마커 표시
          appMyMarker.setMap(
            fastRouteMap
          );


          // 출발지 입력창 표시
          document.getElementById(
            "start"
          ).value = "내 현재 위치";


          messageBox.innerText =
            "✅ 현재 위치를 찾았습니다!";

        },


        // 위치 찾기 실패
        function(error) {

          console.error(
            "위치 오류:",
            error
          );


          if (error.code === 1) {

            messageBox.innerText =
              "❌ 위치 권한이 거부되었습니다.";

          }

          else if (error.code === 2) {

            messageBox.innerText =
              "❌ 현재 위치 정보를 가져올 수 없습니다.";

          }

          else if (error.code === 3) {

            messageBox.innerText =
              "❌ 현재 위치 찾기 시간이 초과되었습니다.";

          }

          else {

            messageBox.innerText =
              "❌ 현재 위치를 찾지 못했습니다.";

          }

        },


        // 위치 설정
        {

          enableHighAccuracy: true,

          timeout: 10000,

          maximumAge: 0

        }

      );

    }



    // ========================================
    // 카카오 장소 검색 서비스
    // 이름 충돌 방지를 위해 이름 변경
    // ========================================

    const kakaoPlaceService =
      new kakao.maps.services.Places();



    // ========================================
    // 도착지 검색
    // ========================================

    function searchDestination() {

      const destinationKeyword =
        document.getElementById(
          "end"
        ).value;


      if (
        destinationKeyword.trim() === ""
      ) {

        alert(
          "도착지를 입력해주세요!"
        );

        return;
      }


      document.getElementById(
        "message"
      ).innerText =
        "🔍 도착지를 찾고 있습니다...";


      kakaoPlaceService.keywordSearch(

        destinationKeyword,

        destinationSearchResult

      );

    }



    // ========================================
    // 도착지 검색 결과
    // ========================================

    function destinationSearchResult(
      data,
      status
    ) {

      const messageBox =
        document.getElementById(
          "message"
        );


      if (
        status ===
        kakao.maps.services.Status.OK
      ) {

        const selectedPlace =
          data[0];


        const destinationLat =
          Number(
            selectedPlace.y
          );

        const destinationLng =
          Number(
            selectedPlace.x
          );


        // 도착지 좌표 저장
        appEndLat =
          destinationLat;

        appEndLng =
          destinationLng;


        const destinationPosition =
          new kakao.maps.LatLng(

            destinationLat,

            destinationLng

          );


        // 지도 이동
        fastRouteMap.setCenter(
          destinationPosition
        );


        // 기존 도착지 마커 삭제
        if (
          appDestinationMarker !== null
        ) {

          appDestinationMarker.setMap(
            null
          );

        }


        // 새로운 도착지 마커
        appDestinationMarker =
          new kakao.maps.Marker({

            position:
              destinationPosition

          });


        appDestinationMarker.setMap(
          fastRouteMap
        );


        // 도착지 이름 표시
        document.getElementById(
          "end"
        ).value =
          selectedPlace.place_name;


        messageBox.innerText =
          "✅ 도착지: " +
          selectedPlace.place_name;


        console.log(
          "도착지:",
          selectedPlace.place_name,
          appEndLat,
          appEndLng
        );

      }

      else if (
        status ===
        kakao.maps.services.Status.ZERO_RESULT
      ) {

        messageBox.innerText =
          "❌ 검색 결과가 없습니다.";

      }

      else {

        messageBox.innerText =
          "❌ 장소 검색 중 오류가 발생했습니다.";

      }

    }



    // ========================================
    // 대중교통 경로 찾기
    // ========================================

    async function findRoute() {

      const messageBox =
        document.getElementById(
          "message"
        );


      // 출발지 확인
      if (
        appStartLat === null ||
        appStartLng === null
      ) {

        messageBox.innerText =
          "❌ 먼저 현재 위치를 찾아주세요.";

        return;
      }


      // 도착지 확인
      if (
        appEndLat === null ||
        appEndLng === null
      ) {

        messageBox.innerText =
          "❌ 먼저 도착지를 찾아주세요.";

        return;
      }


      messageBox.innerText =
        "🚌 대중교통 경로를 찾고 있습니다...";


      // Vercel API
      const apiUrl =

        "/api/kakao" +

        "?startX=" +
        encodeURIComponent(
          appStartLng
        ) +

        "&startY=" +
        encodeURIComponent(
          appStartLat
        ) +

        "&endX=" +
        encodeURIComponent(
          appEndLng
        ) +

        "&endY=" +
        encodeURIComponent(
          appEndLat
        );


      console.log(
        "경로 요청 시작"
      );


      try {

        const response =
          await fetch(
            apiUrl
          );


        const data =
          await response.json();


        console.log(
          "경로 검색 결과:",
          data
        );


        // 서버 오류
        if (!response.ok) {

          console.error(
            "경로 API 오류:",
            data
          );


          messageBox.innerText =
            "❌ 경로 검색에 실패했습니다.";

          return;
        }


        // 경로 없음
        if (
          !data.routes ||
          data.routes.length === 0
        ) {

          messageBox.innerText =
            "❌ 이용 가능한 대중교통 경로가 없습니다.";

          return;
        }


        messageBox.innerText =
          "✅ 빠른 경로를 찾았습니다!";


        // 빠른 경로 3개 표시
        showTopRoutes(
          data.routes
        );

      }

      catch (error) {

        console.error(
          "서버 연결 오류:",
          error
        );


        messageBox.innerText =
          "❌ 서버 연결 중 오류가 발생했습니다.";

      }

    }



    // ========================================
    // 빠른 경로 TOP 3 표시
    // ========================================

    function showTopRoutes(routes) {

      const resultBox =
        document.getElementById(
          "routeResults"
        );


      // 빠른 순서대로 정렬
      const sortedRoutes =
        [...routes].sort(

          function(a, b) {

            return (
              a.properties.totalTime -
              b.properties.totalTime
            );

          }

        );


      // 가장 빠른 3개
      const top3 =
        sortedRoutes.slice(
          0,
          3
        );


      // 기존 결과 삭제
      resultBox.innerHTML = "";


      top3.forEach(

        function(route, index) {


          // ====================================
          // 전체 시간
          // ====================================

          const totalSeconds =
            route.properties.totalTime;


          const totalMinutes =
            Math.ceil(
              totalSeconds / 60
            );


          // ====================================
          // 환승 횟수
          // ====================================

          const transfers =
            route.properties.transfers;


          // ====================================
          // 총 거리
          // ====================================

          const distance =

            Math.round(

              route.properties.totalDistance
              / 1000
              * 10

            ) / 10;


          // ====================================
          // 이동 단계 만들기
          // ====================================

          let stepsHTML = "";


          if (
            route.steps &&
            route.steps.length > 0
          ) {


            route.steps.forEach(

              function(step) {


                const stepProperties =
                  step.properties || {};


                // 이동 종류
                const stepType =

                  step.type ||

                  stepProperties.type ||

                  "";


                // 시간
                const stepSeconds =

                  stepProperties.time ||

                  stepProperties.duration ||

                  step.time ||

                  step.duration ||

                  0;


                let stepMinutes = null;


                if (
                  Number(stepSeconds) > 0
                ) {

                  stepMinutes =
                    Math.max(

                      1,

                      Math.ceil(
                        Number(stepSeconds)
                        / 60
                      )

                    );

                }


                // ==============================
                // 도보
                // ==============================

                if (
                  stepType === "WALKING" ||
                  stepType === "WALK"
                ) {

                  stepsHTML += `

                    <div>

                      🚶 도보

                      ${
                        stepMinutes !== null
                        ? " · " +
                          stepMinutes +
                          "분"
                        : ""
                      }

                    </div>

                  `;

                }


                // ==============================
                // 지하철
                // ==============================

                else if (
                  stepType === "SUBWAY"
                ) {

                  const subwayName =

                    stepProperties.name ||

                    stepProperties.lineName ||

                    stepProperties.routeName ||

                    stepProperties.vehicleName ||

                    "지하철";


                  stepsHTML += `

                    <div>

                      🚇 ${subwayName}

                      ${
                        stepMinutes !== null
                        ? " · " +
                          stepMinutes +
                          "분"
                        : ""
                      }

                    </div>

                  `;

                }


                // ==============================
                // 버스
                // ==============================

                else if (
                  stepType === "BUS"
                ) {

                  const busName =

                    stepProperties.name ||

                    stepProperties.busNo ||

                    stepProperties.lineName ||

                    stepProperties.routeName ||

                    stepProperties.vehicleName ||

                    "버스";


                  stepsHTML += `

                    <div>

                      🚌 ${busName}

                      ${
                        stepMinutes !== null
                        ? " · " +
                          stepMinutes +
                          "분"
                        : ""
                      }

                    </div>

                  `;

                }


                // ==============================
                // 아직 구조를 모르는 단계
                // ==============================

                else {

                  stepsHTML += `

                    <div>

                      🚏 이동

                      ${
                        stepMinutes !== null
                        ? " · " +
                          stepMinutes +
                          "분"
                        : ""
                      }

                    </div>

                  `;

                }

              }

            );

          }


          // ====================================
          // 경로 카드
          // ====================================

          resultBox.innerHTML += `

            <div class="routeCard">

              <h2>
                🚍 빠른 경로 ${index + 1}
              </h2>

              <h3>
                ⏱️ 약 ${totalMinutes}분
              </h3>

              <p>
                🔄 환승 ${transfers}회
              </p>

              <p>
                📏 총 거리 ${distance}km
              </p>


              <div class="steps">

                <strong>
                  이동 경로
                </strong>

                ${stepsHTML}

              </div>

            </div>

          `;

        }

      );

    }

  </script>

</body>

</html>
