    <div class="sectionHeader">

      <h2 class="sectionTitle">
        지도
      </h2>

      <div class="sectionDescription">
        카드를 누르면 선택한 경로만 표시됩니다
      </div>

    </div>


    <div class="mapCard">
      <div id="map"></div>
    </div>

  </section>


  <section id="routeResults"></section>

</div>


<script>

  // =====================================================
  // 상태
  // =====================================================

  var fastRouteMap = null;
  var kakaoPlaceService = null;

  var appStartLat = null;
  var appStartLng = null;

  var appEndLat = null;
  var appEndLng = null;

  var appMyMarker = null;
  var appDestinationMarker = null;

  var routePolylines = [];
  var routeMarkers = [];

  // Kakao에서 받은 전체 경로
  var allKakaoRoutes = [];

  // 화면에 표시하는 TOP 3
  var displayedRoutes = [];

  var openedRouteIndex = null;

  // 실시간 검증 세대 번호
  // 새 검색을 했을 때 이전 비동기 결과가
  // 새 화면을 덮어쓰는 것 방지
  var currentSearchId = 0;

  // 정확히 3분은 실패.
  // 반드시 3분 초과.
  var MINIMUM_SPARE_SECONDS = 180;


  // =====================================================
  // 지도 초기화
  // =====================================================

  function initializeMap() {

    if (
      typeof kakao === "undefined" ||
      !kakao.maps
    ) {

      setMessage(
        "카카오 지도를 불러오지 못했습니다."
      );

      return;
    }


    var container =
      document.getElementById("map");


    fastRouteMap =
      new kakao.maps.Map(
        container,
        {
          center:
            new kakao.maps.LatLng(
              37.5665,
              126.9780
            ),

          level: 4
        }
      );


    kakaoPlaceService =
      new kakao.maps.services.Places();


    console.log(
      "지도 초기화 완료"
    );

  }


  window.addEventListener(
    "load",
    initializeMap
  );


  // =====================================================
  // 메시지
  // =====================================================

  function setMessage(text) {

    document.getElementById(
      "message"
    ).innerText = text;

  }


  // =====================================================
  // 현재 위치
  // =====================================================

  function findMyLocation() {

    setMessage(
      "현재 위치를 확인하고 있습니다..."
    );


    if (!navigator.geolocation) {

      setMessage(
        "현재 위치 기능을 사용할 수 없습니다."
      );

      return;
    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        appStartLat =
          position.coords.latitude;

        appStartLng =
          position.coords.longitude;


        document.getElementById(
          "start"
        ).value =
          "내 현재 위치";


        if (fastRouteMap) {

          var latLng =
            new kakao.maps.LatLng(
              appStartLat,
              appStartLng
            );


          fastRouteMap.setCenter(
            latLng
          );


          fastRouteMap.setLevel(3);


          if (appMyMarker) {
            appMyMarker.setMap(null);
          }


          appMyMarker =
            new kakao.maps.Marker({
              position: latLng
            });


          appMyMarker.setMap(
            fastRouteMap
          );

        }


        setMessage(
          "현재 위치를 확인했습니다."
        );

      },


      function(error) {

        console.error(
          "위치 오류:",
          error
        );


        if (error.code === 1) {

          setMessage(
            "위치 권한을 허용해주세요."
          );

        }

        else if (error.code === 3) {

          setMessage(
            "현재 위치 확인 시간이 초과되었습니다."
          );

        }

        else {

          setMessage(
            "현재 위치를 확인하지 못했습니다."
          );

        }

      },


      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );

  }


  // =====================================================
  // 도착지 검색
  // =====================================================

  function searchDestination() {

    var keyword =
      document.getElementById(
        "end"
      ).value.trim();


    if (!keyword) {

      alert(
        "도착지를 입력해주세요."
      );

      return;
    }


    if (!kakaoPlaceService) {

      setMessage(
        "지도가 아직 준비되지 않았습니다."
      );

      return;
    }


    setMessage(
      "도착지를 찾고 있습니다..."
    );


    kakaoPlaceService.keywordSearch(

      keyword,

      function(data, status) {

        if (
          status ===
          kakao.maps.services.Status.OK &&
          data.length > 0
        ) {

          var place =
            data[0];


          appEndLat =
            Number(place.y);

          appEndLng =
            Number(place.x);


          document.getElementById(
            "end"
          ).value =
            place.place_name;


          var destinationLatLng =
            new kakao.maps.LatLng(
              appEndLat,
              appEndLng
            );


          if (appDestinationMarker) {

            appDestinationMarker.setMap(
              null
            );

          }


          appDestinationMarker =
            new kakao.maps.Marker({

              position:
                destinationLatLng

            });


          appDestinationMarker.setMap(
            fastRouteMap
          );


          fastRouteMap.setCenter(
            destinationLatLng
          );


          setMessage(
            "도착지를 설정했습니다 · " +
            place.place_name
          );

        }

        else if (
          status ===
          kakao.maps.services.Status.ZERO_RESULT
        ) {

          setMessage(
            "검색 결과가 없습니다."
          );

        }

        else {

          setMessage(
            "도착지를 검색하지 못했습니다."
          );

        }

      }

    );

  }


  // 엔터 검색
  document
    .getElementById("end")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          searchDestination();

        }

      }
    );


  // =====================================================
  // 경로 검색
  // =====================================================

  async function findRoute() {

    if (
      appStartLat === null ||
      appStartLng === null
    ) {

      setMessage(
        "현재 위치를 먼저 확인해주세요."
      );

      return;
    }


    if (
      appEndLat === null ||
      appEndLng === null
    ) {

      setMessage(
        "도착지를 먼저 설정해주세요."
      );

      return;
    }


    // 새로운 검색 ID
    currentSearchId++;

    var searchId =
      currentSearchId;


    setMessage(
      "대중교통 경로를 찾고 있습니다..."
    );


    document.getElementById(
      "routeResults"
    ).innerHTML = "";


    var apiUrl =

      "/api/kakao" +

      "?startX=" +
      encodeURIComponent(
        appStartLng
      ) +

      "&startY=" +
      encodeURIComponent(
        appStartLat
      ) +

      "&endX=" +
      encodeURIComponent(
        appEndLng
      ) +

      "&endY=" +
      encodeURIComponent(
        appEndLat
      );


    try {

      var response =
        await fetch(apiUrl);


      var data =
        await response.json();


      console.log(
        "경로 결과:",
        data
      );


      if (
        searchId !== currentSearchId
      ) {
        return;
      }


      if (!response.ok) {

        setMessage(
          "대중교통 경로 검색에 실패했습니다."
        );

        return;
      }


      if (
        !data ||
        !Array.isArray(data.routes) ||
        data.routes.length === 0
      ) {

        setMessage(
          "이용 가능한 대중교통 경로가 없습니다."
        );

        return;
      }


      // =========================================
      // 1단계
      // Kakao 경로 즉시 화면 표시
      // =========================================

      allKakaoRoutes =
        data.routes.slice();


      allKakaoRoutes.sort(
        function(a, b) {

          return (
            getTotalTime(a) -
            getTotalTime(b)
          );

        }
      );


      // 일반 경로 TOP 3를 즉시 만든다.
      displayedRoutes =
        allKakaoRoutes
          .slice(0, 3)
          .map(
            function(route) {

              return createInitialRouteState(
                route
              );

            }
          );


      openedRouteIndex =
        null;


      renderRoutes();


      if (
        displayedRoutes.length > 0
      ) {

        drawRouteOnMap(
          displayedRoutes[0].route
        );

      }


      setMessage(

        "경로 " +
        data.routes.length +
        "개를 찾았습니다. 일반 경로를 먼저 표시하고 실시간 탑승 가능 여부를 확인합니다."

      );


      // =========================================
      // 2단계
      // 화면은 이미 떴음.
      //
      // 실시간 검증은 따로 시작.
      // await 하지 않음.
      // =========================================

      verifyRealtimeRoutes(
        allKakaoRoutes,
        searchId
      );

    }

    catch (error) {

      console.error(
        "경로 검색 오류:",
        error
      );


      setMessage(
        "경로를 불러오는 중 오류가 발생했습니다."
      );

    }

  }


  // =====================================================
  // 최초 카드 상태
  // =====================================================

  function createInitialRouteState(
    route
  ) {

    var firstTransit =
      findFirstTransitStep(
        route
      );


    var info =
      getTransitStepInfo(
        firstTransit
      );


    return {

      route: route,

      realtimeState:
        "checking",

      realtimeChecked:
        false,

      catchable:
        false,

      firstTransitType:
        info.type,

      transitName:
        info.transitName,

      boardingName:
        info.boardingName,

      nextStopName:
        info.nextStopName,

      walkingSeconds:
        null,

      walkingDistance:
        null,

      walkingEstimated:
        false,

      arrivalSeconds:
        null,

      spareSeconds:
        null,

      reason:
        "실시간 탑승 가능 여부 확인 중"

    };

  }


  // =====================================================
  // 실시간 검증
  //
  // 중요:
  // 이 함수는 findRoute에서 await하지 않는다.
  // 따라서 이게 느려도 화면은 이미 표시되어 있다.
  // =====================================================

  async function verifyRealtimeRoutes(
    routes,
    searchId
  ) {

    console.log(
      "실시간 검증 시작"
    );


    var analysisPromises =
      routes.map(
        function(route) {

          return analyzeRouteWithTimeout(
            route
          );

        }
      );


    var analyzed =
      await Promise.all(
        analysisPromises
      );


    // 사용자가 그 사이 새로운 검색을 했다면
    // 이전 결과 버림
    if (
      searchId !== currentSearchId
    ) {

      return;

    }


    console.log(
      "실시간 검증 완료:",
      analyzed
    );


    // =========================================
    // 실시간 3분 초과 통과 경로
    // =========================================

    var passed =
      analyzed.filter(
        function(item) {

          return (
            item.realtimeChecked === true &&
            item.catchable === true
          );

        }
      );


    passed.sort(
      function(a, b) {

        return (
          getTotalTime(a.route) -
          getTotalTime(b.route)
        );

      }
    );


    // =========================================
    // 실시간 확인 불가
    // =========================================

    var unknown =
      analyzed.filter(
        function(item) {

          return (
            item.realtimeChecked !== true
          );

        }
      );


    unknown.sort(
      function(a, b) {

        return (
          getTotalTime(a.route) -
          getTotalTime(b.route)
        );

      }
    );


    // =========================================
    // 확인했지만 3분 조건 실패
    // =========================================

    var failed =
      analyzed.filter(
        function(item) {

          return (
            item.realtimeChecked === true &&
            item.catchable === false
          );

        }
      );


    failed.sort(
      function(a, b) {

        return (
          getTotalTime(a.route) -
          getTotalTime(b.route)
        );

      }
    );


    // =========================================
    // 화면 순서
    //
    // 1. 실제 3분 초과 검증 완료
    // 2. 검증 불가
    // 3. 3분 조건 실패
    //
    // 최대 3개
    // =========================================

    displayedRoutes =
      passed
        .concat(unknown)
        .concat(failed)
        .slice(0, 3);


    openedRouteIndex =
      null;


    renderRoutes();


    if (
      displayedRoutes.length > 0
    ) {

      drawRouteOnMap(
        displayedRoutes[0].route
      );

    }


    if (
      passed.length > 0
    ) {

      setMessage(

        "실시간 확인 완료 · 3분 초과 탑승 여유가 확인된 경로 " +
        passed.length +
        "개를 우선 표시합니다."

      );

    }

    else {

      setMessage(
        "일반 경로는 정상입니다. 현재 실시간 3분 초과 조건이 확인된 경로는 없습니다."
      );

    }

  }


  // =====================================================
  // 경로 분석 timeout
  //
  // 실시간 API가 이상해도
  // 최대 4초 뒤에는 해당 경로를
  // '실시간 확인 불가'로 넘긴다.
  // =====================================================

  async function analyzeRouteWithTimeout(
    route
  ) {

    try {

      return await Promise.race([

        analyzeSingleRoute(
          route
        ),

        new Promise(
          function(resolve) {

            setTimeout(
              function() {

                var initial =
                  createInitialRouteState(
                    route
                  );


                initial.realtimeState =
                  "unknown";


                initial.reason =
                  "실시간 응답 시간 초과";


                resolve(
                  initial
                );

              },

              4000
            );

          }
        )

      ]);

    }

    catch (error) {

      console.error(
        "경로 실시간 분석 오류:",
        error
      );


      var fallback =
        createInitialRouteState(
          route
        );


      fallback.realtimeState =
        "unknown";


      fallback.reason =
        "실시간 정보 확인 실패";


      return fallback;

    }

  }


  // =====================================================
  // 개별 경로 분석
  // =====================================================

  async function analyzeSingleRoute(
    route
  ) {

    var result =
      createInitialRouteState(
        route
      );


    var firstTransit =
      findFirstTransitStep(
        route
      );


    if (!firstTransit) {

      result.realtimeState =
        "unknown";


      result.reason =
        "첫 탑승 교통수단을 확인할 수 없습니다.";


      return result;

    }


    // =========================================
    // 탑승지까지 도보
    // =========================================

    var walking =
      calculateAccessWalking(
        route,
        firstTransit
      );


    result.walkingSeconds =
      walking.seconds;


    result.walkingDistance =
      walking.distance;


    result.walkingEstimated =
      walking.estimated;


    // =========================================
    // 버스
    //
    // 아직 실시간 버스 API가 없으므로
    // 경로 자체만 표시
    // =========================================

    if (
      result.firstTransitType ===
      "BUS"
    ) {

      result.realtimeState =
        "unknown";


      result.reason =
        "버스 실시간 도착정보 연결 대기";


      return result;

    }


    // =========================================
    // 지하철
    // =========================================

    if (
      result.firstTransitType !==
      "SUBWAY"
    ) {

      result.realtimeState =
        "unknown";


      result.reason =
        "실시간 판정 대상이 아닙니다.";


      return result;

    }


    if (
      result.walkingSeconds === null
    ) {

      result.realtimeState =
        "unknown";


      result.reason =
        "탑승지까지 도보시간을 계산하지 못했습니다.";


      return result;

    }


    await checkSubwayRealtime(
      result
    );


    return result;

  }


  // =====================================================
  // 첫 대중교통 step 찾기
  // =====================================================

  function findFirstTransitStep(
    route
  ) {

    if (
      !route ||
      !Array.isArray(route.steps)
    ) {

      return null;
    }


    for (
      var i = 0;
      i < route.steps.length;
      i++
    ) {

      var step =
        route.steps[i];


      var type =
        getStepType(
          step
        );


      if (
        type === "SUBWAY" ||
        type === "BUS"
      ) {

        return {

          step: step,
          index: i

        };

      }

    }


    return null;

  }


  // =====================================================
  // 첫 탑승 정보
  // =====================================================

  function getTransitStepInfo(
    firstTransit
  ) {

    var empty = {

      type: "",

      transitName: "",

      boardingName: "",

      alightingName: "",

      nextStopName: ""

    };


    if (
      !firstTransit ||
      !firstTransit.step
    ) {

      return empty;
    }


    var step =
      firstTransit.step;


    var properties =
      step.properties || {};


    var type =
      getStepType(
        step
      );


    var stops =
      Array.isArray(
        properties.stops
      )
        ? properties.stops
        : [];


    var endpoints =
      parseEndpoints(
        properties.guidance ||
        ""
      );


    var boardingName =
      "";


    var alightingName =
      "";


    var nextStopName =
      "";


    if (
      stops.length > 0
    ) {

      boardingName =
        cleanStationName(
          getStopName(
            stops[0]
          )
        );


      alightingName =
        cleanStationName(
          getStopName(
            stops[
              stops.length - 1
            ]
          )
        );

    }


    if (
      stops.length > 1
    ) {

      nextStopName =
        cleanStationName(
          getStopName(
            stops[1]
          )
        );

    }


    if (!boardingName) {

      boardingName =
        cleanStationName(
          endpoints.start
        );

    }


    if (!alightingName) {

      alightingName =
        cleanStationName(
          endpoints.end
        );

    }


    var transitName =
      "";


    if (
      type === "SUBWAY"
    ) {

      transitName =
        getSubwayLineName(
          properties.guidance ||
          ""
        );

    }

    else if (
      type === "BUS"
    ) {

      transitName =
        getBusName(
          properties
        );

    }


    return {

      type:
        type,

      transitName:
        transitName,

      boardingName:
        boardingName,

      alightingName:
        alightingName,

      nextStopName:
        nextStopName

    };

  }


  // =====================================================
  // 첫 탑승지까지 도보
  //
  // Kakao 응답에 실제 초기 WALKING step이 있으면
  // 그 시간을 사용.
  //
  // 없으면 현재 위치 → 첫 transit path 시작점을
  // 직선 기반으로 추정.
  // =====================================================

  function calculateAccessWalking(
    route,
    firstTransit
  ) {

    var transitIndex =
      firstTransit.index;


    var walkingSeconds =
      0;


    var walkingDistance =
      0;


    var foundWalking =
      false;


    // transit 이전의 WALKING step
    for (
      var i = 0;
      i < transitIndex;
      i++
    ) {

      var step =
        route.steps[i];


      var type =
        getStepType(
          step
        );


      if (
        type === "WALKING" ||
        type === "WALK"
      ) {

        var properties =
          step.properties || {};


        var seconds =
          Number(
            properties.time ||
            0
          );


        var distance =
          Number(
            properties.distance ||
            0
          );


        if (
          Number.isFinite(seconds) &&
          seconds > 0
        ) {

          walkingSeconds +=
            seconds;


          foundWalking =
            true;

        }


        if (
          Number.isFinite(distance) &&
          distance > 0
        ) {

          walkingDistance +=
            distance;

        }

      }

    }


    if (foundWalking) {

      return {

        seconds:
          Math.ceil(
            walkingSeconds
          ),

        distance:
          Math.round(
            walkingDistance
          ),

        estimated:
          false

      };

    }


    // =========================================
    // 초기 도보가 Kakao 응답에 없는 경우
    // =========================================

    var boardingPoint =
      getFirstPathPoint(
        firstTransit.step
      );


    if (
      !boardingPoint ||
      appStartLat === null ||
      appStartLng === null
    ) {

      return {

        seconds: null,
        distance: null,
        estimated: true

      };

    }


    var estimate =
      estimateWalking(

        appStartLat,
        appStartLng,

        boardingPoint.lat,
        boardingPoint.lng

      );


    return {

      seconds:
        estimate.seconds,

      distance:
        estimate.distance,

      estimated:
        true

    };

  }


  // =====================================================
  // 서울 지하철 실시간
  // =====================================================

  async function checkSubwayRealtime(
    result
  ) {

    var station =
      normalizeStationName(
        result.boardingName
      );


    if (!station) {

      result.realtimeState =
        "unknown";


      result.reason =
        "승차역 이름을 확인할 수 없습니다.";


      return;

    }


    try {

      var response =
        await fetchWithTimeout(

          "/api/seoul-subway?station=" +

          encodeURIComponent(
            station
          ),

          3500

        );


      var data = null;


      try {

        data =
          await response.json();

      }

      catch (error) {

        result.realtimeState =
          "unknown";


        result.reason =
          "실시간 응답 형식을 읽지 못했습니다.";


        return;

      }


      console.log(
        "지하철 실시간:",
        station,
        response.status,
        data
      );


      // API 자체가 오류
      if (
        !response.ok
      ) {

        result.realtimeState =
          "unknown";


        result.reason =
          data?.error ||
          "실시간 API 응답 오류";


        return;

      }


      // success false
      if (
        data &&
        data.success === false
      ) {

        result.realtimeState =
          "unknown";


        result.reason =
          data.error ||
          data.message ||
          "실시간 정보를 확인할 수 없습니다.";


        return;

      }


      // arrivals 없음
      if (
        !data ||
        !Array.isArray(
          data.arrivals
        ) ||
        data.arrivals.length === 0
      ) {

        result.realtimeState =
          "unknown";


        result.reason =
          data?.message ||
          "현재 실시간 도착정보가 없습니다.";


        return;

      }


      var arrivals =
        data.arrivals.slice();


      // =========================================
      // 호선 필터
      // =========================================

      var subwayId =
        getSubwayId(
          result.transitName
        );


      if (subwayId) {

        arrivals =
          arrivals.filter(
            function(item) {

              return (
                String(
                  item.subwayId ||
                  ""
                ) ===
                String(
                  subwayId
                )
              );

            }
          );


        if (
          arrivals.length === 0
        ) {

          result.realtimeState =
            "unknown";


          result.reason =
            "해당 호선 실시간 정보가 없습니다.";


          return;

        }

      }


      // =========================================
      // 0초 / 음수 제외
      // =========================================

      arrivals =
        arrivals.filter(
          function(item) {

            return (
              Number(
                item.arrivalSeconds
              ) > 0
            );

          }
        );


      if (
        arrivals.length === 0
      ) {

        result.realtimeState =
          "unknown";


        result.reason =
          "사용 가능한 도착시간이 없습니다.";


        return;

      }


      // =========================================
      // 방향 검사
      //
      // 다음 역이 있는데 방향 매칭이 하나도 없으면
      // 반대 방향 열차를 사용하지 않는다.
      // =========================================

      var nextStop =
        normalizeStationName(
          result.nextStopName
        );


      if (nextStop) {

        var target =
          normalizeCompareText(
            nextStop
          );


        var directionMatched =
          arrivals.filter(
            function(item) {

              var trainLine =
                normalizeCompareText(
                  item.trainLine ||
                  ""
                );


              return (
                trainLine.indexOf(
                  target
                ) !== -1
              );

            }
          );


        if (
          directionMatched.length === 0
        ) {

          result.realtimeState =
            "unknown";


          result.reason =
            "진행 방향 실시간 정보를 확인하지 못했습니다.";


          return;

        }


        arrivals =
          directionMatched;

      }


      arrivals.sort(
        function(a, b) {

          return (
            Number(
              a.arrivalSeconds
            ) -
            Number(
              b.arrivalSeconds
            )
          );

        }
      );


      result.realtimeChecked =
        true;


      result.realtimeState =
        "failed";


      // =========================================
      // 첫 열차 → 다음 열차 → 다음 열차
      //
      // 첫 번째로
      // arrival - walking > 180
      // 만족하는 열차 선택
      // =========================================

      for (
        var i = 0;
        i < arrivals.length;
        i++
      ) {

        var arrivalSeconds =
          Number(
            arrivals[i]
              .arrivalSeconds
          );


        var spareSeconds =
          arrivalSeconds -
          result.walkingSeconds;


        console.log(
          "탑승 판정:",
          {
            station:
              result.boardingName,

            line:
              result.transitName,

            arrivalSeconds:
              arrivalSeconds,

            walkingSeconds:
              result.walkingSeconds,

            spareSeconds:
              spareSeconds,

            passed:
              spareSeconds >
              MINIMUM_SPARE_SECONDS
          }
        );


        // 반드시 180초 초과
        if (
          spareSeconds >
          MINIMUM_SPARE_SECONDS
        ) {

          result.catchable =
            true;


          result.realtimeState =
            "passed";


          result.arrivalSeconds =
            arrivalSeconds;


          result.spareSeconds =
            spareSeconds;


          result.reason =
            "3분 초과 탑승 여유 확인";


          return;

        }

      }


      // =========================================
      // 모든 열차가 3분 조건 실패
      // =========================================

      result.catchable =
        false;


      result.realtimeState =
        "failed";


      if (
        arrivals.length > 0
      ) {

        result.arrivalSeconds =
          Number(
            arrivals[0]
              .arrivalSeconds
          );


        result.spareSeconds =

          result.arrivalSeconds -

          result.walkingSeconds;

      }


      result.reason =
        "3분 초과 여유가 있는 열차가 없습니다.";

    }

    catch (error) {

      console.error(
        "실시간 지하철 확인 실패:",
        error
      );


      result.realtimeChecked =
        false;


      result.realtimeState =
        "unknown";


      result.reason =
        error &&
        error.name ===
        "AbortError"

          ? "실시간 응답 시간이 초과되었습니다."

          : "실시간 정보를 확인하지 못했습니다.";

    }

  }


  // =====================================================
  // timeout fetch
  // =====================================================

  async function fetchWithTimeout(
    url,
    timeoutMs
  ) {

    var controller =
      new AbortController();


    var timeout =
      setTimeout(
        function() {

          controller.abort();

        },

        timeoutMs
      );


    try {

      return await fetch(
        url,
        {
          signal:
            controller.signal
        }
      );

    }

    finally {

      clearTimeout(
        timeout
      );

    }

  }

  function getStatusInfo(

    if (
      item.realtimeState ===
      "passed"
    ) {

      return {

        text:
          "3분 초과 확인",

        className:
          "badgePassed"

      };

    }


    if (
      item.realtimeState ===
      "failed"
    ) {

        text:

        className:
          "badgeFailed"

      };

    }

    ) {

      return {

        text:

    }


    if (
      item.firstTransitType ===
      "BUS"
    ) {

      return {

        text:
          "버스 실시간 대기",

        className:
          "badgeUnknown"

      };

    }


    return {

      text:
        "실시간 확인 불가",

      className:
        "badgeUnknown"

    };

  }


  // =====================================================
  // 카드 교통수단 요약
  // =====================================================

  function buildTransportSummary(
    route
  ) {

    if (
      !route ||
      !Array.isArray(
        route.steps
      )
    ) {

      return "";

    }


    var html =
      '<div class="transportSummary">';


    var count =
      0;


    route.steps.forEach(
      function(step) {

        var type =
          getStepType(
            step
          );


        var properties =
          step.properties || {};


        if (
          type === "SUBWAY"
        ) {

          var line =
            getSubwayLineName(
              properties.guidance ||
              ""
            );


          html += `

            <div class="transportChip">

              <span class="transportLetter">
                M
              </span>

              ${escapeHTML(line)}

            </div>

          `;


          count++;

        }


        else if (
          type === "BUS"
        ) {

          var bus =
            getBusName(
              properties
            );


          html += `

            <div class="transportChip">

              <span class="transportLetter">
                B
              </span>

              ${escapeHTML(bus)}

            </div>

          `;


          count++;

        }

      }
    );


    html +=
      "</div>";


    return (
      count > 0
        ? html
        : ""
    );

  }

  // =====================================================

  function toggleRoute(
    index
  ) {

    var selected =
      document.getElementById(
        "route-card-" +
        index
      );


    if (!selected) {
      return;
    }


    if (
      openedRouteIndex ===
      index
    ) {

      selected.classList.remove(
        "open"
      );


      selected.classList.remove(
        "selected"
      );


      openedRouteIndex =
        null;


      return;
    }


    var cards =
      document.querySelectorAll(
        ".routeCard"
      );


    cards.forEach(
      function(card) {

        card.classList.remove(
          "open"
        );


        card.classList.remove(
          "selected"
        );

      }
    );


    selected.classList.add(
      "open"
    );


    selected.classList.add(
      "selected"
    );


    openedRouteIndex =
      index;


    if (
      displayedRoutes[index]
    ) {

      drawRouteOnMap(
        displayedRoutes[index]
          .route
      );

    }

  }


  // =====================================================
  // 상세 경로
  // =====================================================

  function buildDetailedSteps(
    route,
    analyzedItem
  ) {

    if (
      !route ||
      !Array.isArray(
        route.steps
      )
    ) {

      return "";

    }


    var html = "";


    var firstTransit =
      findFirstTransitStep(
        route
      );


    // =========================================
    // Kakao 응답이 첫 transit부터 시작하고
    // 초기 WALKING이 없는 경우
    // 추정 도보를 화면에 추가
    // =========================================

    if (
      firstTransit &&
      firstTransit.index === 0 &&
      analyzedItem &&
      analyzedItem.walkingSeconds !== null
    ) {

      var firstInfo =
        getTransitStepInfo(
          firstTransit
        );


      html +=
        buildStepHTML({

          icon:
            "W",

          title:
            "도보",

          meta:
            secondsToMinutes(
              analyzedItem.walkingSeconds
            ) +
            "분 · " +
            formatDistance(
              analyzedItem.walkingDistance
            ),

          guidance:
            firstInfo.boardingName
              ? firstInfo.boardingName +
                getPlaceSuffix(
                  firstInfo.type
                ) +
                "까지 이동"
              : "첫 탑승지까지 이동",

          estimated:
            true

        });

    }


    route.steps.forEach(
      function(step, index) {

        var type =
          getStepType(
            step
          );


        var properties =
          step.properties || {};


        var seconds =
          Number(
            properties.time ||
            0
          );


        var distance =
          Number(
            properties.distance ||
            0
          );


        // =====================================
        // WALKING
        // =====================================

        if (
          type === "WALKING" ||
          type === "WALK"
        ) {

          var walkingGuidance =
            buildWalkingGuidance(
              route,
              index
            );


          buildAndAppend({

            icon:
              "W",

            title:
              "도보",

            meta:
              buildTimeDistanceMeta(
                seconds,
                distance
              ),

            guidance:
              walkingGuidance,

            estimated:
              false

          });

        }


        // =====================================
        // SUBWAY
        // =====================================

        else if (
          type === "SUBWAY"
        ) {

          var subwayInfo =
            getTransitStepInfo({
              step: step,
              index: index
            });


          buildAndAppend({

            icon:
              "M",

            title:
              subwayInfo.transitName ||
              "지하철",

            meta:
              buildTransitMeta(
                subwayInfo.boardingName,
                subwayInfo.alightingName,
                seconds,
                distance
              ),

            guidance:
              "",

            estimated:
              false

          });

        }


        // =====================================
        // BUS
        // =====================================

        else if (
          type === "BUS"
        ) {

          var busInfo =
            getTransitStepInfo({
              step: step,
              index: index
            });


          buildAndAppend({

            icon:
              "B",

            title:
              busInfo.transitName ||
              "버스",

            meta:
              buildTransitMeta(
                busInfo.boardingName,
                busInfo.alightingName,
                seconds,
                distance
              ),

            guidance:
              "",

            estimated:
              false

          });

        }


        else {

          buildAndAppend({

            icon:
              "•",

            title:
              "이동",

            meta:
              buildTimeDistanceMeta(
                seconds,
                distance
              ),

            guidance:
              cleanGuidance(
                properties.guidance ||
                ""
              ),

            estimated:
              false

          });

        }


        function buildAndAppend(
          data
        ) {

          html +=
            buildStepHTML(
              data
            );

        }

      }
    );


    return html;

  }


  // =====================================================

  // =====================================================
  // 도보 안내문 직접 생성
  //
  // API guidance를 그대로 합치지 않기 때문에
  // 응암응암 / 불광불광 같은 중복 방지
  // =====================================================

  function buildWalkingGuidance(
    route,
    walkingIndex
  ) {

    var previousTransit =
      findPreviousTransit(
        route,
        walkingIndex
      );


    var nextTransit =
      findNextTransit(
        route,
        walkingIndex
      );


    // 출발 → 첫 탑승
    if (
      !previousTransit &&
      nextTransit
    ) {

      var nextInfo =
        getTransitStepInfo(
          nextTransit
        );


      if (
        nextInfo.boardingName
      ) {

        return (
          nextInfo.boardingName +
          getPlaceSuffix(
            nextInfo.type
          ) +
          "까지 도보로 이동"
        );

      }


      return (
        "첫 탑승지까지 도보로 이동"
      );

    }


    // 환승 도보
    if (
      previousTransit &&
      nextTransit
    ) {

      var previousInfo =
        getTransitStepInfo(
          previousTransit
        );


      var nextInfo =
        getTransitStepInfo(
          nextTransit
        );


      var previousName =
        cleanStationName(
          previousInfo.alightingName
        );


      var nextName =
        cleanStationName(
          nextInfo.boardingName
        );


      var previousCompare =
        normalizeCompareText(
          previousName
        );


      var nextCompare =
        normalizeCompareText(
          nextName
        );


      // 불광 → 불광이면
      // 불광불광이 아니라
      // 불광역 환승
      if (
        previousCompare &&
        nextCompare &&
        previousCompare ===
        nextCompare
      ) {

        return (
          previousName +
          getPlaceSuffix(
            nextInfo.type
          ) +
          " 환승"
        );

      }


      if (
        previousName &&
        nextName
      ) {

        return (
          previousName +
          " → " +
          nextName +
          " 환승 이동"
        );

      }


      return (
        "환승을 위해 도보로 이동"
      );

    }


    // 마지막 대중교통 → 목적지
    if (
      previousTransit &&
      !nextTransit
    ) {

      return (
        "목적지까지 도보로 이동"
      );

    }


    return (
      "도보로 이동"
    );

  }


  // =====================================================
  // 이전 transit
  // =====================================================

  function findPreviousTransit(
    route,
    index
  ) {

    for (
      var i = index - 1;
      i >= 0;
      i--
    ) {

      var type =
        getStepType(
          route.steps[i]
        );


      if (
        type === "SUBWAY" ||
        type === "BUS"
      ) {

        return {

          step:
            route.steps[i],

          index:
            i

        };

      }

    }


    return null;

  }


  // =====================================================
  // 다음 transit
  // =====================================================

  function findNextTransit(
    route,
    index
  ) {

    for (
      var i = index + 1;
      i < route.steps.length;
      i++
    ) {

      var type =
        getStepType(
          route.steps[i]
        );


      if (
        type === "SUBWAY" ||
        type === "BUS"
      ) {

        return {

          step:
            route.steps[i],

          index:
            i

        };

      }

    }


    return null;

  }


  // =====================================================
  // suffix
  // =====================================================

  function getPlaceSuffix(
    transitType
  ) {

    if (
      transitType === "SUBWAY"
    ) {

      return "역";

    }


    if (
      transitType === "BUS"
    ) {

      return " 정류장";

    }


    return "";

  }


  // =====================================================
  // Step type
  // =====================================================

  function getStepType(
    step
  ) {

    if (!step) {
      return "";
    }


    var properties =
      step.properties || {};


    return String(
      properties.type ||
      step.type ||
      ""
    ).toUpperCase();

  }


  // =====================================================
  // stop 이름
  // =====================================================

  function getStopName(
    stop
  ) {

    if (!stop) {
      return "";
    }


    if (
      typeof stop ===
      "string"
    ) {

      return stop;
    }


    return String(

      stop.name ||

      stop.stationName ||

      stop.stopName ||

      stop.statnNm ||

      ""

    );

  }


  // =====================================================
  // station 표시 이름 정리
  // =====================================================

  function cleanStationName(
    value
  ) {

    var text =
      String(
        value || ""
      ).trim();


    text =
      text.replace(
        /역역/g,
        "역"
      );


    text =
      text.replace(
        /정류장정류장/g,
        "정류장"
      );


    return text;

  }


  // =====================================================
  // guidance 표시 정리
  // =====================================================

  function cleanGuidance(
    value
  ) {

    var text =
      String(
        value || ""
      ).trim();


    text =
      text.replace(
        /역역/g,
        "역"
      );


    text =
      text.replace(
        /정류장정류장/g,
        "정류장"
      );


    return text;

  }


  // =====================================================
  // 실시간 API용 역 이름
  // =====================================================

  function normalizeStationName(
    value
  ) {

    var text =
      cleanStationName(
        value
      );


    // 새절(신사) → 새절
    text =
      text.replace(
        /\([^)]*\)/g,
        ""
      );


    // 새절역 → 새절
    text =
      text.replace(
        /역$/,
        ""
      );


    return text.trim();

  }


  function normalizeCompareText(
    value
  ) {

    return normalizeStationName(
      value
    )
      .replace(
        /\s+/g,
        ""
      );

  }


  // =====================================================
  // guidance 출발 / 도착
  //
  // 마지막 괄호까지 사용해서
  // 새절(신사) 같은 이름도 최대한 보존
  // =====================================================

  function parseEndpoints(
    guidance
  ) {

    var result = {

      start: "",
      end: ""

    };


    var text =
      String(
        guidance || ""
      );


    var firstParen =
      text.indexOf("(");


    var lastParen =
      text.lastIndexOf(")");


    if (
      firstParen === -1 ||
      lastParen <= firstParen
    ) {

      return result;

    }


    var inside =
      text.substring(
        firstParen + 1,
        lastParen
      );


    var arrow =
      inside.indexOf(
        ">"
      );


    if (
      arrow === -1
    ) {

      return result;

    }


    result.start =
      cleanStationName(
        inside
          .substring(
            0,
            arrow
          )
          .trim()
      );


    result.end =
      cleanStationName(
        inside
          .substring(
            arrow + 1
          )
          .trim()
      );


    return result;

  }


  // =====================================================
  // 지하철 호선명
  // =====================================================

  function getSubwayLineName(
    guidance
  ) {

    var text =
      String(
        guidance || ""
      );


    var index =
      text.indexOf("(");


    if (
      index !== -1
    ) {

      return (
        text
          .substring(
            0,
            index
          )
          .trim() ||
        "지하철"
      );

    }


    return (
      text.trim() ||
      "지하철"
    );

  }


  // =====================================================
  // 서울 지하철 ID
  // =====================================================

  function getSubwayId(
    lineName
  ) {

    var text =
      String(
        lineName || ""
      );


    var match =
      text.match(
        /([1-9])호선/
      );


    if (match) {

      return (
        "100" +
        match[1]
      );

    }


    var map = {

      "경의중앙선":
        "1063",

      "공항철도":
        "1065",

      "경춘선":
        "1067",

      "수인분당선":
        "1075"

    };


    for (
      var key in map
    ) {

      if (
        text.indexOf(key) !==
        -1
      ) {

        return map[key];

      }

    }


    return "";

  }


  // =====================================================
  // 버스 이름
  // =====================================================

  function getBusName(
    properties
  ) {

    var vehicles =
      Array.isArray(
        properties.vehicles
      )
        ? properties.vehicles
        : [];


    if (
      vehicles.length > 0
    ) {

      return vehicles.map(
        function(vehicle) {

          var type =
            String(
              vehicle.type ||
              ""
            ).trim();


          var name =
            String(
              vehicle.name ||
              ""
            ).trim();


          return (
            type +
            " " +
            name
          ).trim();

        }
      ).join(
        " · "
      );

    }


    var guidance =
      String(
        properties.guidance ||
        ""
      );


    if (guidance) {

      return guidance
        .split("(")[0]
        .trim();

    }


    return "버스";

  }


  // =====================================================
  // 첫 path point
  //
  // [longitude, latitude]
  // =====================================================

  function getFirstPathPoint(
    step
  ) {

    if (
      !step ||
      !step.path ||
      !Array.isArray(
        step.path.points
      ) ||
      step.path.points.length === 0
    ) {

      return null;
    }


    var point =
      step.path.points[0];


    if (
      !Array.isArray(point) ||
      point.length < 2
    ) {

      return null;
    }


    var lng =
      Number(
        point[0]
      );


    var lat =
      Number(
        point[1]
      );


    if (
      !Number.isFinite(lng) ||
      !Number.isFinite(lat)
    ) {

      return null;
    }


    return {

      lng:
        lng,

      lat:
        lat

    };

  }


  // =====================================================
  // 추정 도보
  // =====================================================

  function estimateWalking(
    startLat,
    startLng,
    endLat,
    endLng
  ) {

    var earthRadius =
      6371000;


    var lat1 =
      startLat *
      Math.PI / 180;


    var lat2 =
      endLat *
      Math.PI / 180;


    var deltaLat =
      (endLat - startLat) *
      Math.PI / 180;


    var deltaLng =
      (endLng - startLng) *
      Math.PI / 180;


    var a =

      Math.sin(
        deltaLat / 2
      ) ** 2

      +

      Math.cos(lat1) *
      Math.cos(lat2) *

      Math.sin(
        deltaLng / 2
      ) ** 2;


    var c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );


    var straightDistance =
      earthRadius * c;


    // 직선거리보다 25% 길게
    var estimatedDistance =
      straightDistance * 1.25;


    // 약 4km/h
    var walkingSpeed =
      4000 / 3600;


    return {

      seconds:
        Math.ceil(
          estimatedDistance /
          walkingSpeed
        ),

      distance:
        Math.round(
          estimatedDistance
        )

    };

  }


  // =====================================================
  // 지도 경로
  // =====================================================

  function clearRouteObjects() {

    routePolylines.forEach(
      function(polyline) {

        polyline.setMap(null);

      }
    );


    routeMarkers.forEach(
      function(marker) {

        marker.setMap(null);

      }
    );


    routePolylines = [];
    routeMarkers = [];

  }


  function drawRouteOnMap(
    route
  ) {

    if (
      !fastRouteMap ||
      !route ||
      !Array.isArray(
        route.steps
      )
    ) {

      return;
    }


    clearRouteObjects();


    var bounds =
      new kakao.maps.LatLngBounds();


    var hasPoint =
      false;


    if (
      appStartLat !== null &&
      appStartLng !== null
    ) {

      bounds.extend(

        new kakao.maps.LatLng(
          appStartLat,
          appStartLng
        )

      );


      hasPoint =
        true;

    }


    route.steps.forEach(
      function(step) {

        if (
          !step.path ||
          !Array.isArray(
            step.path.points
          )
        ) {

          return;
        }


        var path =
          convertPoints(
            step.path.points
          );


        if (
          path.length === 0
        ) {

          return;
        }


        hasPoint =
          true;


        path.forEach(
          function(position) {

            bounds.extend(
              position
            );

          }
        );


        var type =
          getStepType(
            step
          );


        var color =
          "#8BA58A";


        if (
          type === "SUBWAY"
        ) {

          color =
            "#263D38";

        }

        else if (
          type === "BUS"
        ) {

          color =
            "#4B8281";

        }

        else if (
          type === "WALKING" ||
          type === "WALK"
        ) {

          color =
            "#A4BCA5";

        }


        var polyline =
          new kakao.maps.Polyline({

            path:
              path,

            strokeWeight:
              5,

            strokeColor:
              color,

            strokeOpacity:
              0.88

          });


        polyline.setMap(
          fastRouteMap
        );


        routePolylines.push(
          polyline
        );

      }
    );


    if (
      appEndLat !== null &&
      appEndLng !== null
    ) {

      bounds.extend(

        new kakao.maps.LatLng(
          appEndLat,
          appEndLng
        )

      );


      hasPoint =
        true;

    }


    if (hasPoint) {

      fastRouteMap.setBounds(
        bounds
      );

    }

  }


  // =====================================================
  // [lng, lat] → Kakao LatLng
  // =====================================================

  function convertPoints(
    points
  ) {

    var result = [];


    points.forEach(
      function(point) {

        if (
          !Array.isArray(point) ||
          point.length < 2
        ) {

          return;
        }


        var lng =
          Number(
            point[0]
          );


        var lat =
          Number(
            point[1]
          );


        if (
          Number.isFinite(lng) &&
          Number.isFinite(lat)
        ) {

          result.push(

            new kakao.maps.LatLng(
              lat,
              lng
            )

          );

        }

      }
    );


    return result;

  }


  // =====================================================
  // 메타
  // =====================================================

  function buildTimeDistanceMeta(
    seconds,
    distance
  ) {

    var parts = [];


    if (
      Number(seconds) > 0
    ) {

      parts.push(
        secondsToMinutes(
          seconds
        ) +
        "분"
      );

    }


    if (
      Number(distance) > 0
    ) {

      parts.push(
        formatDistance(
          distance
        )
      );

    }


    return parts.join(
      " · "
    );

  }


  function buildTransitMeta(
    start,
    end,
    seconds,
    distance
  ) {

    var parts = [];


    if (
      start ||
      end
    ) {

      parts.push(

        (start || "?") +
        " → " +
        (end || "?")

      );

    }


    if (
      Number(seconds) > 0
    ) {

      parts.push(
        secondsToMinutes(
          seconds
        ) +
        "분"
      );

    }


    if (
      Number(distance) > 0
    ) {

      parts.push(
        formatDistance(
          distance
        )
      );

    }


    return parts.join(
      " · "
    );

  }


  // =====================================================
  // 총 시간
  // =====================================================

  function getTotalTime(
    route
  ) {

    var value =
      Number(
        route?.properties?.totalTime
      );


    if (
      !Number.isFinite(value)
    ) {

      return 999999999;

    }


    return value;

  }


  // =====================================================
  // 초 → 분
  // =====================================================

  function secondsToMinutes(
    seconds
  ) {

    var value =
      Number(
        seconds
      );


    if (
      !Number.isFinite(value) ||
      value <= 0
    ) {

      return 0;
    }


    return Math.ceil(
      value / 60
    );

  }


  // =====================================================
  // 초 표시
  // =====================================================

  function formatSeconds(
    seconds
  ) {

    var value =
      Math.max(
        0,
        Math.round(
          Number(seconds) ||
          0
        )
      );


    var minutes =
      Math.floor(
        value / 60
      );


    var remaining =
      value % 60;


    if (
      remaining === 0
    ) {

      return (
        minutes +
        "분"
      );

    }


    return (
      minutes +
      "분 " +
      remaining +
      "초"
    );

  }


  // =====================================================
  // 거리
  // =====================================================

  function formatDistance(
    meters
  ) {

    var value =
      Number(
        meters
      );


    if (
      !Number.isFinite(value) ||
      value < 0
    ) {

      return "";
    }


    if (
      value < 1000
    ) {

      return (
        Math.round(value) +
        "m"
      );

    }


    return (

      (
        Math.round(
          value / 100
        ) / 10
      )

      +

      "km"

    );

  }


  // =====================================================
  // HTML escape
  // =====================================================

  function escapeHTML(
    value
  ) {

    return String(
      value || ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>
