<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빠른길</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=16010f0659e99afc9e0d760620666d16"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
    }

    h1{
      text-align:center;
      color:#F7E600;
      background:#3C1E1E;
      padding:15px;
      margin:0;
    }

    #map{
      width:100%;
      height:500px;
    }

    .box{
      padding:15px;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:8px;
      margin-bottom:8px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      background:#F7E600;
      border:none;
      font-size:16px;
      font-weight:bold;
    }
  </style>

</head>
<body>

<h1>🚶 빠른길</h1>

<div class="box">

  <input placeholder="출발지">

  <input placeholder="도착지">

  <button>빠른 길 찾기</button>

</div>

<div id="map"></div>

<script>
const container=document.getElementById("map");

const options={
  center:new kakao.maps.LatLng(37.5665,126.9780),
  level:3
};

const map=new kakao.maps.Map(container,options);

const marker=new kakao.maps.Marker({
  position:new kakao.maps.LatLng(37.5665,126.9780)
});

marker.setMap(map);
</script>

</body>
</html>
