<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>빠른길</title>

  <!--
    여기에 네 기존 카카오 JavaScript 키를 넣어.
    REST API 키가 아니라 JavaScript 키.
  -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=16010f0659e99afc9e0d760620666d16&libraries=services"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      background: #FEE500;
      margin: 0;
      padding: 15px;
    }

    .box {
      padding: 15px;
      background: white;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 7px;
    }

    #locationButton {
      background: #dddddd;
    }

    #routeButton {
      background: #FEE500;
    }

    #trafficButton {
      background: #333333;
      color: white;
    }

    #message {
      text-align: center;
      padding: 12px;
      background: white;
    }

    #routeResults {
      padding: 15px;
    }

    .routeCard {
      background: white;
      border: 2px solid #FEE500;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .routeCard h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .routeCard h3 {
      font-size: 26px;
      margin: 10px 0;
    }

    .routeCard p {
      margin: 8px 0;
    }

    .steps {
      margin-top: 12px;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 8px;
      line-height: 1.8;
    }

    #map {
      width: 100%;
      height: 500px;
    }

  </style>
</head>


<body>

  <h1>🚶 빠른길</h1>

  <div class="box">

    <input
      id="start"
      type="text"
      placeholder="출발지를 입력하세요"
    >

    <input
      id="end"
      type="text"
      placeholder="도착지를 입력하세요"
    >

    <button
      id="locationButton"
      onclick="findMyLocation()"
    >
      📍 내 현재 위치 찾기
    </button>

    <button
      id="routeButton"
      onclick="searchDestination()"
    >
      🔍 도착지 찾기
    </button>

    <button
      id="trafficButton"
      onclick="findRoute()"
    >
      🚍 대중교통 빠른 길 찾기
    </button>

  </div>

  <div id="message">
    내 위치 버튼을 눌러보세요.
  </div>

  <div id="routeResults"></div>

  <div id="map"></div>


  <script>

    // =====================================================
    // 앱 변수
    // =====================================================

    var fastRouteMap = null;
    var kakaoPlaceService = null;

    var appStartLat = null;
    var appStartLng = null;

    var appEndLat = null;
    var appEndLng = null;

    var appMyMarker = null;
    var appDestinationMarker = null;

    var routePolylines = [];
    var routeMarkers = [];

    var displayedRoutes = [];

    // 핵심 조건
    // 열차 도착시간 - 도보시간 > 3분
    var MINIMUM_SPARE_SECONDS = 180;


    // =====================================================
    // 지도 초기화
    // =====================================================

    function initializeMap() {

      var messageBox =
        document.getElementById("message");

      if (
        typeof kakao === "undefined" ||
        !kakao.maps
      ) {

        messageBox.innerText =
          "❌ 카카오 지도 SDK를 불러오지 못했습니다.";

        console.error(
          "Kakao Maps SDK가 로드되지 않았습니다."
        );

        return;
      }


      var mapContainer =
        document.getElementById("map");


      var mapOption = {

        center:
          new kakao.maps.LatLng(
            37.5665,
            126.9780
          ),

        level: 4

      };


      fastRouteMap =
        new kakao.maps.Map(
          mapContainer,
          mapOption
        );


      kakaoPlaceService =
        new kakao.maps.services.Places();


      console.log(
        "카카오 지도 준비 완료"
      );

    }


    // SDK는 자동 로딩 방식이므로
    // 페이지가 모두 로드된 뒤 지도 생성
    window.addEventListener(
      "load",
      initializeMap
    );


    // =====================================================
    // 현재 위치 찾기
    // =====================================================

    function findMyLocation() {

      var messageBox =
        document.getElementById(
          "message"
        );


      messageBox.innerText =
        "📡 현재 위치를 찾고 있습니다...";


      if (!navigator.geolocation) {

        messageBox.innerText =
          "❌ 위치 기능을 사용할 수 없습니다.";

        return;
      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          var currentLat =
            position.coords.latitude;

          var currentLng =
            position.coords.longitude;


          appStartLat =
            currentLat;

          appStartLng =
            currentLng;


          document.getElementById(
            "start"
          ).value =
            "내 현재 위치";


          console.log(
            "현재 위치:",
            currentLat,
            currentLng
          );


          if (fastRouteMap) {

            var currentPosition =
              new kakao.maps.LatLng(
                currentLat,
                currentLng
              );


            fastRouteMap.setCenter(
              currentPosition
            );

            fastRouteMap.setLevel(3);


            if (appMyMarker) {

              appMyMarker.setMap(
                null
              );

            }


            appMyMarker =
              new kakao.maps.Marker({

                position:
                  currentPosition

              });


            appMyMarker.setMap(
              fastRouteMap
            );

          }


          messageBox.innerText =
            "✅ 현재 위치를 찾았습니다!";

        },


        function(error) {

          console.error(
            "위치 오류:",
            error
          );


          if (error.code === 1) {

            messageBox.innerText =
              "❌ 위치 권한이 거부되었습니다.";

          }

          else if (error.code === 2) {

            messageBox.innerText =
              "❌ 현재 위치 정보를 가져올 수 없습니다.";

          }

          else if (error.code === 3) {

            messageBox.innerText =
              "❌ 현재 위치 찾기 시간이 초과되었습니다.";

          }

          else {

            messageBox.innerText =
              "❌ 현재 위치를 찾지 못했습니다.";

          }

        },


        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    // =====================================================
    // 도착지 검색
    // =====================================================

    function searchDestination() {

      var destinationKeyword =
        document.getElementById(
          "end"
        ).value.trim();


      if (!destinationKeyword) {

        alert(
          "도착지를 입력해주세요!"
        );

        return;
      }


      if (!kakaoPlaceService) {

        document.getElementById(
          "message"
        ).innerText =
          "❌ 지도가 아직 준비되지 않았습니다.";

        return;
      }


      document.getElementById(
        "message"
      ).innerText =
        "🔍 도착지를 찾고 있습니다...";


      kakaoPlaceService.keywordSearch(

        destinationKeyword,

        destinationSearchResult

      );

    }


    // =====================================================
    // 도착지 검색 결과
    // =====================================================

    function destinationSearchResult(
      data,
      status
    ) {

      var messageBox =
        document.getElementById(
          "message"
        );


      if (
        status ===
        kakao.maps.services.Status.OK
      ) {

        var selectedPlace =
          data[0];


        appEndLat =
          Number(
            selectedPlace.y
          );

        appEndLng =
          Number(
            selectedPlace.x
          );


        var destinationPosition =
          new kakao.maps.LatLng(
            appEndLat,
            appEndLng
          );


        if (fastRouteMap) {

          fastRouteMap.setCenter(
            destinationPosition
          );


          if (appDestinationMarker) {

            appDestinationMarker.setMap(
              null
            );

          }


          appDestinationMarker =
            new kakao.maps.Marker({

              position:
                destinationPosition

            });


          appDestinationMarker.setMap(
            fastRouteMap
          );

        }


        document.getElementById(
          "end"
        ).value =
          selectedPlace.place_name;


        messageBox.innerText =
          "✅ 도착지: " +
          selectedPlace.place_name;


        console.log(
          "도착지:",
          selectedPlace.place_name,
          appEndLat,
          appEndLng
        );

      }


      else if (
        status ===
        kakao.maps.services.Status.ZERO_RESULT
      ) {

        messageBox.innerText =
          "❌ 검색 결과가 없습니다.";

      }


      else {

        messageBox.innerText =
          "❌ 장소 검색 중 오류가 발생했습니다.";

      }

    }


    // =====================================================
    // 대중교통 경로 찾기
    // =====================================================

    async function findRoute() {

      var messageBox =
        document.getElementById(
          "message"
        );


      if (
        appStartLat === null ||
        appStartLng === null
      ) {

        messageBox.innerText =
          "❌ 먼저 현재 위치를 찾아주세요.";

        return;
      }


      if (
        appEndLat === null ||
        appEndLng === null
      ) {

        messageBox.innerText =
          "❌ 먼저 도착지를 찾아주세요.";

        return;
      }


      messageBox.innerText =
        "🚍 경로와 실시간 도착정보를 분석하고 있습니다...";


      document.getElementById(
        "routeResults"
      ).innerHTML = "";


      var apiUrl =

        "/api/kakao" +

        "?startX=" +
        encodeURIComponent(
          appStartLng
        ) +

        "&startY=" +
        encodeURIComponent(
          appStartLat
        ) +

        "&endX=" +
        encodeURIComponent(
          appEndLng
        ) +

        "&endY=" +
        encodeURIComponent(
          appEndLat
        );


      try {

        var response =
          await fetch(
            apiUrl
          );


        var data =
          await response.json();


        console.log(
          "경로 검색 결과:",
          data
        );


        if (!response.ok) {

          console.error(
            "경로 API 오류:",
            data
          );


          messageBox.innerText =
            "❌ 경로 검색에 실패했습니다.";

          return;
        }


        if (
          !Array.isArray(
            data.routes
          ) ||
          data.routes.length === 0
        ) {

          messageBox.innerText =
            "❌ 이용 가능한 대중교통 경로가 없습니다.";

          return;
        }


        await analyzeAllRoutes(
          data.routes
        );

      }


      catch (error) {

        console.error(
          "경로 분석 오류:",
          error
        );


        messageBox.innerText =
          "❌ 경로 분석 중 오류가 발생했습니다.";

      }

    }


    // =====================================================
    // 모든 경로 분석
    // =====================================================

    async function analyzeAllRoutes(
      routes
    ) {

      var analyzed = [];


      for (
        var i = 0;
        i < routes.length;
        i++
      ) {

        var result =
          await analyzeSingleRoute(
            routes[i]
          );


        analyzed.push(
          result
        );

      }


      // ===================================================
      // 3분 초과 조건을 실제로 통과한 경로
      // ===================================================

      var passed =
        analyzed.filter(
          function(item) {

            return (
              item.realtimeChecked === true &&
              item.catchable === true
            );

          }
        );


      // 조건 통과 후
      // 전체 이동시간이 빠른 순
      passed.sort(
        function(a, b) {

          return (
            Number(
              a.route.properties.totalTime
            ) -
            Number(
              b.route.properties.totalTime
            )
          );

        }
      );


      // 최대 3개
      displayedRoutes =
        passed.slice(
          0,
          3
        );


      showRouteResults(
        displayedRoutes
      );


      if (
        displayedRoutes.length > 0
      ) {

        document.getElementById(
          "message"
        ).innerText =

          "✅ 3분 초과 여유가 있는 경로 " +
          displayedRoutes.length +
          "개를 찾았습니다.";


        drawRouteOnMap(
          displayedRoutes[0].route
        );

      }


      else {

        document.getElementById(
          "message"
        ).innerText =
          "⚠️ 현재 3분 초과 여유 조건을 확인한 경로가 없습니다.";


        showUnavailableInformation(
          analyzed
        );

      }

    }


    // =====================================================
    // 경로 하나 분석
    // =====================================================

    async function analyzeSingleRoute(
      route
    ) {

      var result = {

        route: route,

        firstTransitType: "",

        transitName: "",

        boardingName: "",

        alightingName: "",

        nextStopName: "",

        walkingSeconds: null,

        walkingDistance: null,

        realtimeChecked: false,

        catchable: false,

        arrivalSeconds: null,

        spareSeconds: null,

        arrivalMessage: "",

        reason: ""

      };


      if (
        !route.steps ||
        route.steps.length === 0
      ) {

        result.reason =
          "이동 단계 없음";

        return result;
      }


      var firstTransitStep =
        null;


      // 첫 BUS/SUBWAY 찾기
      for (
        var i = 0;
        i < route.steps.length;
        i++
      ) {

        var step =
          route.steps[i];

        var properties =
          step.properties || {};

        var type =
          String(
            properties.type ||
            step.type ||
            ""
          ).toUpperCase();


        if (
          type === "BUS" ||
          type === "SUBWAY"
        ) {

          firstTransitStep =
            step;

          break;
        }

      }


      if (!firstTransitStep) {

        result.reason =
          "첫 대중교통 없음";

        return result;
      }


      var firstProperties =
        firstTransitStep.properties || {};


      result.firstTransitType =
        String(
          firstProperties.type ||
          firstTransitStep.type ||
          ""
        ).toUpperCase();


      // ===================================================
      // 정류장 / 역 목록
      // ===================================================

      var stops =
        Array.isArray(
          firstProperties.stops
        )
          ? firstProperties.stops
          : [];


      if (stops.length > 0) {

        result.boardingName =
          getStopName(
            stops[0]
          );


        result.alightingName =
          getStopName(
            stops[
              stops.length - 1
            ]
          );

      }


      if (stops.length > 1) {

        result.nextStopName =
          getStopName(
            stops[1]
          );

      }


      // ===================================================
      // guidance
      // ===================================================

      var guidance =
        String(
          firstProperties.guidance ||
          ""
        );


      var endpoints =
        parseEndpoints(
          guidance
        );


      if (!result.boardingName) {

        result.boardingName =
          endpoints.start;

      }


      if (!result.alightingName) {

        result.alightingName =
          endpoints.end;

      }


      // ===================================================
      // 교통수단 이름
      // ===================================================

      if (
        result.firstTransitType ===
        "SUBWAY"
      ) {

        result.transitName =
          getSubwayLineName(
            guidance
          );

      }


      else if (
        result.firstTransitType ===
        "BUS"
      ) {

        result.transitName =
          getBusName(
            firstProperties
          );

      }


      // ===================================================
      // 첫 탑승지 좌표
      // path.points[0] = [경도, 위도]
      // ===================================================

      var boardingPoint =
        getFirstPathPoint(
          firstTransitStep
        );


      if (boardingPoint) {

        var walking =
          estimateWalking(

            appStartLat,
            appStartLng,

            boardingPoint.lat,
            boardingPoint.lng

          );


        result.walkingSeconds =
          walking.seconds;

        result.walkingDistance =
          walking.distance;

      }


      // ===================================================
      // 지하철 실시간
      // ===================================================

      if (
        result.firstTransitType ===
        "SUBWAY"
      ) {

        if (
          result.walkingSeconds === null
        ) {

          result.reason =
            "첫 탑승지 좌표 확인 실패";

          return result;
        }


        await checkSubwayRealtime(
          result
        );

      }


      // ===================================================
      // 버스
      // 아직 실시간 API 연결 전
      // ===================================================

      else if (
        result.firstTransitType ===
        "BUS"
      ) {

        result.reason =
          "버스 실시간 API 연결 대기";

      }


      return result;

    }


    // =====================================================
    // 지하철 실시간 조회
    // =====================================================

    async function checkSubwayRealtime(
      result
    ) {

      var station =
        normalizeStationName(
          result.boardingName
        );


      if (!station) {

        result.reason =
          "승차역 이름 없음";

        return;
      }


      try {

        var response =
          await fetch(

            "/api/seoul-subway?station=" +

            encodeURIComponent(
              station
            )

          );


        var data =
          await response.json();


        console.log(
          "지하철 실시간:",
          station,
          data
        );


        if (
          !response.ok ||
          !data.success ||
          !Array.isArray(
            data.arrivals
          )
        ) {

          result.reason =
            data.error ||
            "실시간 정보 없음";

          return;
        }


        var arrivals =
          data.arrivals.slice();


        // =================================================
        // 호선 맞추기
        // =================================================

        var subwayId =
          getSubwayId(
            result.transitName
          );


        if (subwayId) {

          arrivals =
            arrivals.filter(
              function(item) {

                return (
                  String(
                    item.subwayId
                  ) ===
                  String(
                    subwayId
                  )
                );

              }
            );

        }


        // =================================================
        // 0초 데이터 제외
        // =================================================

        arrivals =
          arrivals.filter(
            function(item) {

              return (
                Number(
                  item.arrivalSeconds
                ) > 0
              );

            }
          );


        // =================================================
        // 진행 방향 맞추기
        //
        // 예:
        // 새절 → 증산 → ...
        //
        // 서울 API:
        // "... 증산방면"
        // =================================================

        var normalizedNext =
          normalizeStationName(
            result.nextStopName
          );


        if (normalizedNext) {

          var directionMatched =
            arrivals.filter(
              function(item) {

                var trainLine =
                  normalizeCompareText(
                    item.trainLine || ""
                  );


                var target =
                  normalizeCompareText(
                    normalizedNext
                  );


                return (
                  trainLine.indexOf(
                    target
                  ) !== -1
                );

              }
            );


          // 방향이 실제로 매칭됐을 때만 사용
          if (
            directionMatched.length > 0
          ) {

            arrivals =
              directionMatched;

          }

        }


        arrivals.sort(
          function(a, b) {

            return (
              Number(
                a.arrivalSeconds
              ) -
              Number(
                b.arrivalSeconds
              )
            );

          }
        );


        result.realtimeChecked =
          true;


        // =================================================
        // 핵심 알고리즘
        //
        // 실시간 도착시간 - 도보시간 > 180초
        //
        // 첫 번째 열차가 안 되면
        // 다음 열차를 계속 검사
        // =================================================

        for (
          var i = 0;
          i < arrivals.length;
          i++
        ) {

          var arrivalSeconds =
            Number(
              arrivals[i]
                .arrivalSeconds
            );


          var spareSeconds =
            arrivalSeconds -
            result.walkingSeconds;


          console.log(
            result.transitName,
            result.boardingName,
            "도착:",
            arrivalSeconds,
            "도보:",
            result.walkingSeconds,
            "여유:",
            spareSeconds
          );


          if (
            spareSeconds >
            MINIMUM_SPARE_SECONDS
          ) {

            result.catchable =
              true;


            result.arrivalSeconds =
              arrivalSeconds;


            result.spareSeconds =
              spareSeconds;


            result.arrivalMessage =
              arrivals[i]
                .arrivalMessage ||
              "";


            result.reason =
              "3분 초과 조건 통과";


            return;

          }

        }


        result.catchable =
          false;


        result.reason =
          "3분 초과 여유 열차 없음";

      }


      catch (error) {

        console.error(
          "지하철 실시간 오류:",
          error
        );


        result.reason =
          "지하철 실시간 조회 오류";

      }

    }


    // =====================================================
    // 임시 도보시간 추정
    // =====================================================

    function estimateWalking(
      startLat,
      startLng,
      endLat,
      endLng
    ) {

      var earthRadius =
        6371000;


      var lat1 =
        startLat *
        Math.PI / 180;


      var lat2 =
        endLat *
        Math.PI / 180;


      var deltaLat =
        (endLat - startLat) *
        Math.PI / 180;


      var deltaLng =
        (endLng - startLng) *
        Math.PI / 180;


      var a =

        Math.sin(
          deltaLat / 2
        ) *
        Math.sin(
          deltaLat / 2
        ) +

        Math.cos(lat1) *
        Math.cos(lat2) *

        Math.sin(
          deltaLng / 2
        ) *
        Math.sin(
          deltaLng / 2
        );


      var c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );


      var straightDistance =
        earthRadius * c;


      // 실제 길은 직선보다 길 수 있으므로
      // 현재는 임시 1.25배
      var estimatedDistance =
        straightDistance * 1.25;


      // 약 시속 4km
      var walkingSpeed =
        4000 / 3600;


      var seconds =
        Math.ceil(
          estimatedDistance /
          walkingSpeed
        );


      return {

        seconds:
          seconds,

        distance:
          Math.round(
            estimatedDistance
          )

      };

    }


    // =====================================================
    // 첫 path 좌표
    // =====================================================

    function getFirstPathPoint(
      step
    ) {

      if (
        !step ||
        !step.path ||
        !Array.isArray(
          step.path.points
        ) ||
        step.path.points.length === 0
      ) {

        return null;
      }


      var point =
        step.path.points[0];


      // 확인된 실제 구조:
      // [경도, 위도]
      if (
        Array.isArray(point) &&
        point.length >= 2
      ) {

        var lng =
          Number(
            point[0]
          );


        var lat =
          Number(
            point[1]
          );


        if (
          Number.isFinite(lng) &&
          Number.isFinite(lat)
        ) {

          return {

            lng: lng,
            lat: lat

          };

        }

      }


      return null;

    }


    // =====================================================
    // stop 이름
    // =====================================================

    function getStopName(
      stop
    ) {

      if (!stop) {
        return "";
      }


      if (
        typeof stop === "string"
      ) {

        return stop;
      }


      return String(
        stop.name ||
        stop.stationName ||
        stop.stopName ||
        stop.statnNm ||
        ""
      );

    }


    // =====================================================
    // guidance 출발/도착
    // =====================================================

    function parseEndpoints(
      guidance
    ) {

      var result = {

        start: "",
        end: ""

      };


      var match =
        String(
          guidance || ""
        ).match(
          /\((.*?)\s*>\s*(.*?)\)/
        );


      if (match) {

        result.start =
          match[1].trim();


        result.end =
          match[2].trim();

      }


      return result;

    }


    // =====================================================
    // 지하철 호선 이름
    // =====================================================

    function getSubwayLineName(
      guidance
    ) {

      var text =
        String(
          guidance || ""
        );


      var index =
        text.indexOf("(");


      if (index !== -1) {

        return text
          .substring(
            0,
            index
          )
          .trim();

      }


      return (
        text.trim() ||
        "지하철"
      );

    }


    // =====================================================
    // 지하철 ID
    // =====================================================

    function getSubwayId(
      lineName
    ) {

      var text =
        String(
          lineName || ""
        );


      var numberMatch =
        text.match(
          /([1-9])호선/
        );


      if (numberMatch) {

        return (
          "100" +
          numberMatch[1]
        );

      }


      var map = {

        "경의중앙선": "1063",

        "공항철도": "1065",

        "경춘선": "1067",

        "수인분당선": "1075"

      };


      for (
        var name in map
      ) {

        if (
          text.indexOf(
            name
          ) !== -1
        ) {

          return map[name];

        }

      }


      return "";

    }


    // =====================================================
    // 역 이름 정리
    // =====================================================
function cleanStationDisplayName(name) {

  var text =
    String(name || "").trim();

  // 공백 제거한 비교용 문자열
  var compact =
    text.replace(/\s+/g, "");

  // "응암응암" → "응암"
  // "불광불광" → "불광"
  // "충무로충무로" → "충무로"
  var length =
    compact.length;

  if (length % 2 === 0) {

    var half =
      length / 2;

    var first =
      compact.substring(0, half);

    var second =
      compact.substring(half);

    if (first === second) {
      compact = first;
    }
  }

  // 역이 이미 붙어 있으면 중복 추가 방지
  compact =
    compact.replace(/역역$/, "역");

  return compact;
}
    function normalizeStationName(
      name
    ) {

      var text =
        String(
          name || ""
        ).trim();


      // 새절(신사) → 새절
      text =
        text.replace(
          /\([^)]*\)/g,
          ""
        );


      // 서울역 → 서울
      text =
        text.replace(
          /역$/,
          ""
        );


      return text.trim();

    }


    function normalizeCompareText(
      value
    ) {

      return normalizeStationName(
        value
      )
      .replace(
        /\s+/g,
        ""
      );

    }


    // =====================================================
    // 버스 번호
    // =====================================================

    function getBusName(
      properties
    ) {

      var vehicles =
        Array.isArray(
          properties.vehicles
        )
          ? properties.vehicles
          : [];


      if (vehicles.length > 0) {

        return vehicles.map(
          function(vehicle) {

            var type =
              vehicle.type || "";

            var name =
              vehicle.name || "";


            return (
              type +
              " " +
              name
            ).trim();

          }
        ).join(
          " · "
        );

      }


      var guidance =
        String(
          properties.guidance ||
          ""
        );


      if (guidance) {

        return guidance
          .split("(")[0]
          .trim();

      }


      return "버스";

    }


    // =====================================================
    // 결과 화면
    // =====================================================

    function showRouteResults(
      routes
    ) {

      var resultBox =
        document.getElementById(
          "routeResults"
        );


      resultBox.innerHTML =
        "";


      if (
        routes.length === 0
      ) {

        return;
      }


      routes.forEach(
        function(item, index) {

          var route =
            item.route;


          var totalMinutes =
            Math.max(
              1,
              Math.ceil(
                Number(
                  route.properties.totalTime
                ) / 60
              )
            );


          var transfers =
            Number(
              route.properties.transfers ||
              0
            );


          var distance =
            formatDistance(
              route.properties.totalDistance
            );


          var walkingMinutes =
            secondsToMinutes(
              item.walkingSeconds
            );


          var arrivalMinutes =
            secondsToMinutes(
              item.arrivalSeconds
            );


          var spareMinutes =
            secondsToMinutes(
              item.spareSeconds
            );


          var stepsHTML =
            buildStepsHTML(
              route
            );


          resultBox.innerHTML += `

            <div
              class="routeCard"
              onclick="selectRoute(${index})"
            >

              <h2>
                🚍 추천 경로 ${index + 1}
              </h2>

              <h3>
                ⏱️ 약 ${totalMinutes}분
              </h3>

              <p>
                🔄 환승 ${transfers}회
              </p>

              <p>
                📏 총 거리 ${distance}
              </p>

              <p>
                🚏 첫 탑승:
                ${escapeHTML(item.boardingName)}
              </p>

              <p>
                🚇 ${escapeHTML(item.transitName)}
              </p>

              <p>
                🚶 첫 탑승지까지 추정 도보
                약 ${walkingMinutes}분
                · ${formatDistance(item.walkingDistance)}
              </p>

              <p>
                🚇 탑승 가능한 열차
                약 ${arrivalMinutes}분 후
              </p>

              <p>
                ⏱️ 탑승 여유
                약 ${spareMinutes}분
              </p>

              <p>
                ✅ 3분 초과 조건 통과
              </p>

              <div class="steps">

                <strong>
                  이동 경로
                </strong>

                ${stepsHTML}

              </div>

            </div>

          `;

        }
      );

    }


    // =====================================================
    // 추천 결과가 0개일 때
    // =====================================================

    function showUnavailableInformation(
      analyzed
    ) {

      var resultBox =
        document.getElementById(
          "routeResults"
        );


      var html = `

        <div class="routeCard">

          <h2>
            현재 추천 경로 없음
          </h2>

          <p>
            3분 초과 여유가 있다고
            실시간으로 확인된 경로가 없습니다.
          </p>

      `;


      var busCount =
        analyzed.filter(
          function(item) {

            return (
              item.firstTransitType ===
              "BUS"
            );

          }
        ).length;


      if (busCount > 0) {

        html += `

          <p>
            🚌 버스 경로 ${busCount}개는
            실시간 버스 API 연결 후 판정됩니다.
          </p>

        `;

      }


      var unavailableSubway =
        analyzed.filter(
          function(item) {

            return (
              item.firstTransitType ===
              "SUBWAY" &&
              item.realtimeChecked ===
              false
            );

          }
        );


      if (
        unavailableSubway.length > 0
      ) {

        html += `

          <p>
            🚇 일부 지하철 경로는
            해당 역의 실시간 데이터를
            받지 못했습니다.
          </p>

        `;

      }


      html +=
        "</div>";


      resultBox.innerHTML =
        html;

    }


    // =====================================================
    // 이동 단계 표시
    // =====================================================

    function buildStepsHTML(
      route
    ) {

      var html = "";


      if (
        !Array.isArray(
          route.steps
        )
      ) {

        return html;
      }


      route.steps.forEach(
        function(step) {

          var properties =
            step.properties || {};


          var type =
            String(
              properties.type ||
              step.type ||
              ""
            ).toUpperCase();


          var time =
            Number(
              properties.time ||
              0
            );


          var distance =
            Number(
              properties.distance ||
              0
            );


          var minutes =
            time > 0
              ? secondsToMinutes(
                  time
                )
              : null;


          var guidance =
            String(
              properties.guidance ||
              ""
            );


          // WALKING
          if (
            type === "WALKING" ||
            type === "WALK"
          ) {

            html += `

              <div>
                🚶 도보
                ${
                  minutes !== null
                    ? " · " +
                      minutes +
                      "분"
                    : ""
                }
                ${
                  distance > 0
                    ? " · " +
                      formatDistance(
                        distance
                      )
                    : ""
                }
              </div>

            `;


            if (guidance) {

              html += `

                <div>
                  ${escapeHTML(guidance)}
                </div>

              `;

            }

          }


          // SUBWAY
          else if (
            type === "SUBWAY"
          ) {

            var subwayName =
              getSubwayLineName(
                guidance
              );


            var subwayEndpoints =
              parseEndpoints(
                guidance
              );


            html += `

              <div>
                🚇 ${escapeHTML(subwayName)}
                ${
                  minutes !== null
                    ? " · " +
                      minutes +
                      "분"
                    : ""
                }
                ${
                  distance > 0
                    ? " · " +
                      formatDistance(
                        distance
                      )
                    : ""
                }
              </div>

              <div>
                🚉
                ${escapeHTML(subwayEndpoints.start)}
                →
                ${escapeHTML(subwayEndpoints.end)}
              </div>

            `;

          }


          // BUS
          else if (
            type === "BUS"
          ) {

            var busName =
              getBusName(
                properties
              );


            var busEndpoints =
              parseEndpoints(
                guidance
              );


            html += `

              <div>
                🚌 ${escapeHTML(busName)}
                ${
                  minutes !== null
                    ? " · " +
                      minutes +
                      "분"
                    : ""
                }
                ${
                  distance > 0
                    ? " · " +
                      formatDistance(
                        distance
                      )
                    : ""
                }
              </div>

              <div>
                🚏
                ${escapeHTML(busEndpoints.start)}
                →
                ${escapeHTML(busEndpoints.end)}
              </div>

            `;

          }

        }
      );


      return html;

    }


    // =====================================================
    // 경로 카드 클릭
    // =====================================================

    function selectRoute(
      index
    ) {

      if (
        !displayedRoutes[index]
      ) {

        return;
      }


      drawRouteOnMap(
        displayedRoutes[index]
          .route
      );

    }


    // =====================================================
    // 기존 경로선 삭제
    // =====================================================

    function clearRouteObjects() {

      routePolylines.forEach(
        function(polyline) {

          polyline.setMap(
            null
          );

        }
      );


      routeMarkers.forEach(
        function(marker) {

          marker.setMap(
            null
          );

        }
      );


      routePolylines = [];
      routeMarkers = [];

    }


    // =====================================================
    // 지도에 경로 그리기
    // =====================================================

    function drawRouteOnMap(
      route
    ) {

      if (
        !fastRouteMap ||
        !route ||
        !Array.isArray(
          route.steps
        )
      ) {

        return;
      }


      clearRouteObjects();


      var bounds =
        new kakao.maps.LatLngBounds();


      if (
        appStartLat !== null &&
        appStartLng !== null
      ) {

        bounds.extend(

          new kakao.maps.LatLng(
            appStartLat,
            appStartLng
          )

        );

      }


      route.steps.forEach(
        function(step) {

          var properties =
            step.properties || {};


          var type =
            String(
              properties.type ||
              step.type ||
              ""
            ).toUpperCase();


          var points = [];


          if (
            step.path &&
            Array.isArray(
              step.path.points
            )
          ) {

            points =
              step.path.points;

          }


          var kakaoPath =
            convertPoints(
              points
            );


          if (
            kakaoPath.length === 0
          ) {

            return;
          }


          kakaoPath.forEach(
            function(position) {

              bounds.extend(
                position
              );

            }
          );


          var color =
            "#666666";


          if (type === "BUS") {

            color =
              "#1976D2";

          }


          else if (
            type === "SUBWAY"
          ) {

            color =
              "#E53935";

          }


          var polyline =
            new kakao.maps.Polyline({

              path:
                kakaoPath,

              strokeWeight:
                5,

              strokeColor:
                color,

              strokeOpacity:
                0.8

            });


          polyline.setMap(
            fastRouteMap
          );


          routePolylines.push(
            polyline
          );


          // 승차 / 하차 마커
          if (
            type === "BUS" ||
            type === "SUBWAY"
          ) {

            var startMarker =
              new kakao.maps.Marker({

                position:
                  kakaoPath[0]

              });


            var endMarker =
              new kakao.maps.Marker({

                position:
                  kakaoPath[
                    kakaoPath.length - 1
                  ]

              });


            startMarker.setMap(
              fastRouteMap
            );


            endMarker.setMap(
              fastRouteMap
            );


            routeMarkers.push(
              startMarker
            );


            routeMarkers.push(
              endMarker
            );

          }

        }
      );


      if (
        appEndLat !== null &&
        appEndLng !== null
      ) {

        bounds.extend(

          new kakao.maps.LatLng(
            appEndLat,
            appEndLng
          )

        );

      }


      fastRouteMap.setBounds(
        bounds
      );

    }


    // =====================================================
    // [경도, 위도] → Kakao LatLng
    // =====================================================

    function convertPoints(
      points
    ) {

      var result = [];


      if (!Array.isArray(points)) {

        return result;
      }


      points.forEach(
        function(point) {

          if (
            !Array.isArray(point) ||
            point.length < 2
          ) {

            return;
          }


          var lng =
            Number(
              point[0]
            );


          var lat =
            Number(
              point[1]
            );


          if (
            !Number.isFinite(lng) ||
            !Number.isFinite(lat)
          ) {

            return;
          }


          result.push(

            new kakao.maps.LatLng(
              lat,
              lng
            )

          );

        }
      );


      return result;

    }


    // =====================================================
    // 초 → 분
    // =====================================================

    function secondsToMinutes(
      seconds
    ) {

      var value =
        Number(
          seconds
        );


      if (
        !Number.isFinite(value) ||
        value <= 0
      ) {

        return 0;
      }


      return Math.ceil(
        value / 60
      );

    }


    // =====================================================
    // 거리 표시
    // =====================================================

    function formatDistance(
      meters
    ) {

      var value =
        Number(
          meters
        );


      if (
        !Number.isFinite(value)
      ) {

        return "";
      }


      if (value < 1000) {

        return (
          Math.round(value) +
          "m"
        );

      }


      return (
        (
          Math.round(
            value / 100
          ) / 10
        ) +
        "km"
      );

    }


    // =====================================================
    // HTML 안전 처리
    // =====================================================

    function escapeHTML(
      value
    ) {

      return String(
        value || ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }

  </script>
