<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>빠른길</title>

  <!-- 카카오 지도 API -->
  <!-- YOUR_JAVASCRIPT_KEY를 네 JavaScript 키로 바꾸기 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_JAVASCRIPT_KEY&libraries=services"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      background: #FEE500;
      margin: 0;
      padding: 15px;
    }

    .box {
      padding: 15px;
      background: white;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 7px;
    }

    #locationButton {
      background: #dddddd;
    }

    #routeButton {
      background: #FEE500;
    }

    #trafficButton {
      background: #333333;
      color: white;
    }

    #message {
      text-align: center;
      padding: 12px;
      background: white;
    }

    #routeResults {
      padding: 15px;
    }

    .routeCard {
      background: white;
      border: 2px solid #FEE500;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .routeCard h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .routeCard h3 {
      font-size: 26px;
      margin: 10px 0;
    }

    .routeCard p {
      margin: 8px 0;
    }

    .steps {
      margin-top: 12px;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 8px;
      line-height: 1.8;
    }

    #map {
      width: 100%;
      height: 500px;
    }

  </style>

</head>


<body>

  <h1>🚶 빠른길</h1>

  <div class="box">

    <!-- 출발지 -->
    <input
      id="start"
      type="text"
      placeholder="출발지를 입력하세요"
    >

    <!-- 도착지 -->
    <input
      id="end"
      type="text"
      placeholder="도착지를 입력하세요"
    >

    <!-- 현재 위치 -->
    <button
      id="locationButton"
      onclick="findMyLocation()"
    >
      📍 내 현재 위치 찾기
    </button>

    <!-- 도착지 찾기 -->
    <button
      id="routeButton"
      onclick="searchDestination()"
    >
      🔍 도착지 찾기
    </button>

    <!-- 대중교통 경로 찾기 -->
    <button
      id="trafficButton"
      onclick="findRoute()"
    >
      🚍 대중교통 빠른 길 찾기
    </button>

  </div>


  <!-- 안내 메시지 -->
  <div id="message">
    내 위치 버튼을 눌러보세요.
  </div>


  <!-- 경로 결과 -->
  <div id="routeResults"></div>


  <!-- 지도 -->
  <div id="map"></div>



  <script>

    // ========================================
    // 지도 만들기
    // ========================================

    const mapContainer =
      document.getElementById("map");

    const mapOption = {

      center:
        new kakao.maps.LatLng(
          37.5665,
          126.9780
        ),

      level: 4

    };

    const map =
      new kakao.maps.Map(
        mapContainer,
        mapOption
      );


    // ========================================
    // 좌표 저장
    // ========================================

    let startLatitude = null;
    let startLongitude = null;

    let endLatitude = null;
    let endLongitude = null;


    // 마커
    let myMarker = null;
    let destinationMarker = null;


    // ========================================
    // 현재 위치 찾기
    // ========================================

    function findMyLocation() {

      const message =
        document.getElementById("message");

      message.innerText =
        "📡 현재 위치를 찾고 있습니다...";


      if (!navigator.geolocation) {

        message.innerText =
          "❌ 위치 기능을 사용할 수 없습니다.";

        return;
      }


      navigator.geolocation.getCurrentPosition(

        // 성공
        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;


          // 출발지 좌표 저장
          startLatitude = latitude;
          startLongitude = longitude;


          const myPosition =
            new kakao.maps.LatLng(
              latitude,
              longitude
            );


          // 지도 이동
          map.setCenter(myPosition);
          map.setLevel(3);


          // 기존 마커 삭제
          if (myMarker !== null) {
            myMarker.setMap(null);
          }


          // 현재 위치 마커
          myMarker =
            new kakao.maps.Marker({
              position: myPosition
            });


          myMarker.setMap(map);


          // 출발지 표시
          document.getElementById("start").value =
            "내 현재 위치";


          message.innerText =
            "✅ 현재 위치를 찾았습니다!";

        },


        // 실패
        function(error) {

          console.log(error);

          if (error.code === 1) {

            message.innerText =
              "❌ 위치 권한이 거부되었습니다.";

          } else {

            message.innerText =
              "❌ 현재 위치를 찾지 못했습니다.";

          }

        },


        // 설정
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    // ========================================
    // 장소 검색 준비
    // ========================================

    const places =
      new kakao.maps.services.Places();


    // ========================================
    // 도착지 검색
    // ========================================

    function searchDestination() {

      const keyword =
        document.getElementById("end").value;


      if (keyword.trim() === "") {

        alert("도착지를 입력해주세요!");

        return;
      }


      document.getElementById("message").innerText =
        "🔍 도착지를 찾고 있습니다...";


      places.keywordSearch(
        keyword,
        destinationSearchResult
      );

    }


    // ========================================
    // 도착지 검색 결과
    // ========================================

    function destinationSearchResult(
      data,
      status
    ) {

      if (
        status ===
        kakao.maps.services.Status.OK
      ) {

        const place = data[0];


        const latitude =
          Number(place.y);

        const longitude =
          Number(place.x);


        // 도착지 좌표 저장
        endLatitude = latitude;
        endLongitude = longitude;


        const position =
          new kakao.maps.LatLng(
            latitude,
            longitude
          );


        // 지도 이동
        map.setCenter(position);


        // 기존 마커 삭제
        if (destinationMarker !== null) {
          destinationMarker.setMap(null);
        }


        // 도착지 마커
        destinationMarker =
          new kakao.maps.Marker({
            position: position
          });


        destinationMarker.setMap(map);


        // 장소 이름 표시
        document.getElementById("end").value =
          place.place_name;


        document.getElementById("message").innerText =
          "✅ 도착지: " +
          place.place_name;

      }

      else {

        document.getElementById("message").innerText =
          "❌ 장소를 찾지 못했습니다.";

      }

    }


    // ========================================
    // 대중교통 경로 찾기
    // ========================================

    async function findRoute() {

      const message =
        document.getElementById("message");


      // 출발지 확인
      if (
        startLatitude === null ||
        startLongitude === null
      ) {

        message.innerText =
          "❌ 먼저 현재 위치를 찾아주세요.";

        return;
      }


      // 도착지 확인
      if (
        endLatitude === null ||
        endLongitude === null
      ) {

        message.innerText =
          "❌ 먼저 도착지를 찾아주세요.";

        return;
      }


      message.innerText =
        "🚌 대중교통 경로를 찾고 있습니다...";


      // 우리 Vercel 서버
      const url =

        "/api/kakao" +

        "?startX=" +
        startLongitude +

        "&startY=" +
        startLatitude +

        "&endX=" +
        endLongitude +

        "&endY=" +
        endLatitude;


      try {

        const response =
          await fetch(url);


        const data =
          await response.json();


        console.log(
          "경로 검색 결과:",
          data
        );


        // 서버 오류
        if (!response.ok) {

          message.innerText =
            "❌ 경로 검색에 실패했습니다.";

          console.log(data);

          return;
        }


        // 경로 없음
        if (
          !data.routes ||
          data.routes.length === 0
        ) {

          message.innerText =
            "❌ 이용 가능한 대중교통 경로가 없습니다.";

          return;
        }


        message.innerText =
          "✅ 빠른 경로를 찾았습니다!";


        // TOP 3 출력
        showTopRoutes(
          data.routes
        );

      }

      catch (error) {

        console.log(error);

        message.innerText =
          "❌ 서버 연결 중 오류가 발생했습니다.";

      }

    }


    // ========================================
    // 빠른 경로 TOP 3
    // ========================================

    function showTopRoutes(routes) {

      const resultBox =
        document.getElementById(
          "routeResults"
        );


      // 빠른 순서로 정렬
      const sortedRoutes =
        [...routes].sort(

          function(a, b) {

            return (
              a.properties.totalTime -
              b.properties.totalTime
            );

          }

        );


      // 3개만 선택
      const top3 =
        sortedRoutes.slice(0, 3);


      resultBox.innerHTML = "";


      top3.forEach(

        function(route, index) {


          // ====================================
          // 총 시간
          // ====================================

          const totalSeconds =
            route.properties.totalTime;


          const totalMinutes =
            Math.ceil(
              totalSeconds / 60
            );


          // ====================================
          // 환승
          // ====================================

          const transfers =
            route.properties.transfers;


          // ====================================
          // 거리
          // ====================================

          const distance =

            Math.round(

              route.properties.totalDistance
              / 1000
              * 10

            ) / 10;


          // ====================================
          // 이동 단계
          // ====================================

          let stepsHTML = "";


          route.steps.forEach(

            function(step) {


              // step 안에 properties가 있으면 사용
              const p =
                step.properties || {};


              // 이동 종류
              const type =
                step.type ||
                p.type ||
                "";


              // 시간 찾기
              const seconds =
                p.time ||
                p.duration ||
                step.time ||
                step.duration ||
                0;


              const minutes =
                seconds > 0
                ? Math.max(
                    1,
                    Math.ceil(seconds / 60)
                  )
                : null;


              // =================================
              // 도보
              // =================================

              if (
                type === "WALKING" ||
                type === "WALK"
              ) {

                stepsHTML += `
                  <div>
                    🚶 도보
                    ${
                      minutes !== null
                      ? minutes + "분"
                      : ""
                    }
                  </div>
                `;

              }


              // =================================
              // 지하철
              // =================================

              else if (
                type === "SUBWAY"
              ) {

                const subwayName =

                  p.name ||
                  p.lineName ||
                  p.routeName ||
                  p.vehicleName ||
                  "지하철";


                stepsHTML += `
                  <div>
                    🚇 ${subwayName}
                    ${
                      minutes !== null
                      ? " · " + minutes + "분"
                      : ""
                    }
                  </div>
                `;

              }


              // =================================
              // 버스
              // =================================

              else if (
                type === "BUS"
              ) {

                const busName =

                  p.name ||
                  p.busNo ||
                  p.lineName ||
                  p.routeName ||
                  p.vehicleName ||
                  "버스";


                stepsHTML += `
                  <div>
                    🚌 ${busName}
                    ${
                      minutes !== null
                      ? " · " + minutes + "분"
                      : ""
                    }
                  </div>
                `;

              }


              // =================================
              // 타입을 못 찾았을 때
              // =================================

              else {

                stepsHTML += `
                  <div>
                    🚏 이동
                    ${
                      minutes !== null
                      ? " · " + minutes + "분"
                      : ""
                    }
                  </div>
                `;

              }

            }

          );


          // ====================================
          // 경로 카드 만들기
          // ====================================

          resultBox.innerHTML += `

            <div class="routeCard">

              <h2>
                🚍 빠른 경로 ${index + 1}
              </h2>

              <h3>
                ⏱️ 약 ${totalMinutes}분
              </h3>

              <p>
                🔄 환승 ${transfers}회
              </p>

              <p>
                📏 총 거리 ${distance}km
              </p>


              <div class="steps">

                <strong>
                  이동 경로
                </strong>

                ${stepsHTML}

              </div>

            </div>

          `;

        }

      );

    }


  </script>

</body>

</html>
